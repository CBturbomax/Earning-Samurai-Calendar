name: 일본 수출 트래커 매일 갱신
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'japan-exports/scripts/**'
      - 'japan-exports/tests/**'
      - '.github/workflows/japan-exports.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: japan-exports
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 수집기 검증
        run: python -m unittest discover -s japan-exports/tests -v
      - name: 공식 통계 수집 및 세계합계 대조
        id: collect
        continue-on-error: true
        run: python japan-exports/scripts/collect.py
      - name: 검증된 데이터 또는 실패 상태 저장
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add japan-exports/data
          if ! git diff --cached --quiet; then
            git commit -m "일본 수출 공식 통계 확인 [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: GitHub Pages 새 데이터 반영
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: exit 1
