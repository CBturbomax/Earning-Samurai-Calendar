# 일본 월매출(月次)의 **숫자** — 첨부 PDF 의 표에서 읽는다.
#
# 처음에는 발표 속보 루프(fresh.yml)에 끼워 두었다. 두 가지가 나빴다.
#   · 한 바퀴가 길어졌다. 첨부는 종목마다 200KB 고, 암호 걸린 공시는 파이썬
#     AES 로 풀어야 해서 느리다.
#   · **로그가 안 보였다.** 루프 안에서는 `|| true` 가 오류를 삼켜, 수집기가
#     시간을 넘겨 죽고 있는데도 겉으로는 멀쩡해 보였다(실제로 그랬다).
# 그래서 뗐다. 이 파일이 data/monthly_nums_jp.json 의 **주인**이다.
#
# 목록(data/monthly_jp.json)은 fresh.yml 이 만든다 — 여기서는 읽기만 한다.

name: 월매출 수치 (첨부 PDF)

on:
  workflow_dispatch:
  schedule:
    # 새 월매출 공시는 하루 몇 건이다. 밀린 것을 따라잡는 동안만 바쁘고,
    # 그 뒤에는 대개 몇 초에 끝난다(본 공시는 주소로 건너뛴다).
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_mon_jp.py'
      - 'montable.py'
      - 'pdftext.py'
      - 'pdfcrypt.py'
      - 'scrape_mon_web.py'
      - 'monweb.py'
      - '.github/workflows/monthly.yml'

permissions:
  contents: write

concurrency:
  group: monthly-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 수집기가 스스로 시간을 잰다(MON_SECS). 워크플로의 timeout 이 먼저
      # 닿으면 그 실행에서 받은 것을 저장도 못 하고 죽어, 다음 실행이 같은
      # 자리에서 또 죽는 덫이 된다.
      - name: 🗾 월매출 수치
        timeout-minutes: 12
        env:
          MON_PDF_PER_RUN: '120'
          MON_SECS: '600'
        run: |
          set -o pipefail
          python scrape_mon_jp.py | tee mon.log
          {
            echo '### 월매출 수치'
            echo '```'
            tail -20 mon.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 流通ニュース 는 **다른 우주를 메운다** — 적시공시를 안 내는 큰 소매·외식
      # (니토리·패스트리·시마무라·젠쇼…)이 위 목록에는 아예 없다. 남의 뉴스
      # 서버라 한 번 두드리고 쉬며(WEB_PAUSE) 스스로 시간을 잰다.
      - name: 🏬 월매출 (流通ニュース)
        timeout-minutes: 13
        env:
          WEB_PER_RUN: '250'
          WEB_SECS: '440'
        run: |
          set -o pipefail
          python scrape_mon_web.py | tee web.log
          {
            echo '### 월매출 (流通ニュース)'
            echo '```'
            tail -12 web.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 페이지 다시 만들기
        run: python build.py > /dev/null

      # 되커밋 방식은 다른 워크플로와 같다 — 만들어진 파일은 방금 받은 우리
      # 것이 최신이므로 부딪히면 우리 것을 택하고, 합친 코드로 다시 만든다.
      - name: 저장소에 반영
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mon.log web.log
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "월매출 수치 $(date -u +%F' '%H:%M) [skip ci]"

          for i in 1 2 3 4 5; do
            git merge --abort 2>/dev/null || true
            git add data/ index.html 2>/dev/null || true
            git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
            git fetch origin main || { sleep $((2**i)); continue; }
            if ! git merge --no-edit origin/main; then
              stuck=$(git diff --name-only --diff-filter=U)
              if [ -z "$stuck" ]; then
                echo "merge 실패(충돌 아님), 재시도"; sleep $((2**i)); continue
              fi
              others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' || true)
              if [ -n "$others" ]; then
                echo "코드가 부딪혔다. 손으로 봐야 한다:"; echo "$others"; exit 1
              fi
              # shellcheck disable=SC2086
              git checkout --ours -- $stuck
              git add $stuck
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "충돌을 못 풀었다:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git commit --no-edit
            fi
            python build.py > /dev/null
            git add index.html
            git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"
            git push origin HEAD:main && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
