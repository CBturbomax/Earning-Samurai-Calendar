# 사업부별 매출 뼈대 — SEC 분기 벌크에서 미국 전 종목을 한꺼번에.
#
# stockanalysis 는 **종목마다 요청 한 번**이라 시총 상위부터 조금씩 채울 수밖에
# 없었다. 1,350종목을 두드려 223종목. 회원님이 열어 보는 종목은 거의 늘 비었다.
#
# SEC 가 분기마다 내는 벌크 zip(85MB)에는 부문 축이 그대로 살아 있다 —
# 우리가 쓰던 companyfacts API 가 축을 떨어뜨렸을 뿐이다. zip 하나에 그 분기에
# 접수된 모든 서류가 들어 있어 **분기당 요청 한 번**으로 전 종목이 들어온다.
#
# **왜 워크플로를 따로 뒀나.** 열여섯 분기를 훑으면 1.4GB · 4분이 걸린다.
# 20분마다 도는 numbers.yml 에 끼우면 그날 하루 그 워크플로가 시간을 넘겨
# 되커밋까지 못 간다. 그래서 저장소 규칙대로 **건드리는 파일을 갈라** 뗐다.
#
#   collect.yml   1시간   data/earnings*.json · data/caps.json
#   numbers.yml   20분    data/financials*.json · data/segments.json
#   여기          3시간   data/segments_sec.json · data/segments_edgar.json
#
# 겹치는 건 만들어진 index.html 뿐이고, 그건 합친 자료로 다시 만들면 그만이다.
#
# **벌크만으로는 늘 두 분기 늦는다.** 벌크는 접수된 분기 기준이라, 6월 결산을
# 7월에 신고하면 그 서류는 10월에 나오는 묶음에 들어간다. 재보니 부문 자료가
# 있는 1,600종목 중 61%가 두 분기 뒤졌다 — 총매출은 2Q26 까지 그려지는데 부문
# 막대는 4Q25 에서 끊겼다. 메우라고 붙여 둔 stockanalysis 는 1,784종목 중
# 1,484종목이 빈 기록이었다.
#
# 그래서 두 단계로 돈다.
#   1) 벌크 확인 — 대개 요청 한 번으로 끝난다(넉 달에 한 번만 진짜로 일한다)
#   2) 제출 서류 — 분기 색인 한 장으로 최근 10-Q/10-K 를 찾아, 뒤진 종목부터
#      인라인 XBRL 인스턴스를 뜯는다. 이미 본 서류는 접수번호로 건너뛴다.

name: 사업부별 매출 (SEC 벌크 + 제출 서류)

on:
  workflow_dispatch:
  # 30분마다. 벌크 확인은 요청 한 번이고, 나머지는 제출 서류를 따라간다.
  # **다 따라잡으면 몇 초에 끝난다** — 색인 세 장을 받아 '새 서류 없음'을 확인하고
  # 곧장 나온다. 그래서 자주 도는 값이 싸다. 처음 한 바퀴(7,678건)만 서너 번
  # 크게 돌면 되고, 그 뒤로는 새로 접수된 서류 몇십 건이 전부다. 공개 저장소라
  # Actions 시간이 무제한 무료이므로 한 시간을 기다릴 이유가 없다 — 방금 발표한
  # 외국 기업(아메르스포츠류)의 새치기 줄도 이만큼 더 자주 돈다.
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_seg_sec.py'
      - 'scrape_seg_edgar.py'
      - 'scrape_seg_fpi.py'
      - '.github/workflows/segments.yml'

permissions:
  contents: write
  actions: write      # 다음 실행 예약(이어달리기)

concurrency:
  group: segments-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  segments:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 150
    steps:
      - name: 시작 시각
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      # **최신 main 으로 맞추고 시작한다.** checkout 은 이 실행을 부른 커밋을
      # 꺼내 오는데, 실행이 줄을 서면 그게 벌써 낡은 것이다 — 앞 실행이 방금
      # 커밋한 수집분을 못 보고 **같은 일을 처음부터 다시 한다.** 실제로
      # 그랬다(09:22 와 09:32 두 실행이 기사 250건을 똑같이 받아 왔고, 결과가
      # 글자까지 같아 커밋에도 안 보였다 — 남의 서버만 두 배로 두드린 셈이다).
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧩 SEC 벌크에서 부문별 매출
        # 1Q18 부터라 묶음이 서른아홉 개다(열두 개일 때 15분이었다) — 넉넉히. 판(SEG_SEC_VER)을 올리면 통째로 다시 훑는다
        timeout-minutes: 75
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
        run: |
          python scrape_seg_sec.py | tee seg.log
          {
            echo '### 사업부별 매출 (SEC 벌크)'
            echo '```'
            cat seg.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 수주잔고(RPO) — 분기 묶음에는 거의 없어 companyconcept 로 따로 받는다(종목당 한 번, 열흘마다)
      - name: 📦 수주잔고 RPO (SEC companyconcept)
        continue-on-error: true
        timeout-minutes: 12
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
          RPO_SECS: '600'
        run: python scrape_rpo_us.py | tail -5

      # 인수 확인 — 매출이 계단처럼 뛴 회사만 SEC '사업 인수 지출'을 본다(회원님 11/03 닥터페퍼)
      - name: 🔀 인수 확인 (SEC)
        continue-on-error: true
        timeout-minutes: 6
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
          ACQ_SECS: '240'
        run: python scrape_acq_us.py | tail -3

      # 벌크가 아직 안 실은 최근 분기를 제출 서류에서 직접 받는다.
      # 서류 하나에 요청 두 번 · 300KB(gzip) 라, 한 번에 700건이면 8분쯤이다.
      - name: 📄 제출 서류에서 최근 분기 부문 매출
        continue-on-error: true
        timeout-minutes: 25
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
        run: |
          python scrape_seg_edgar.py | tee edgar.log
          {
            echo '### 사업부별 매출 (제출 서류)'
            echo '```'
            tail -30 edgar.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 외국 기업(20-F·6-K)은 위 둘이 구조적으로 못 잡는다. 종목당 요청이
      # 한 번(제출목록) + 서류마다 두 번이라 값이 싸고, 이미 본 서류는
      # 접수번호로 건너뛴다.
      - name: 🌏 외국 기업 부문 매출 (20-F·6-K)
        continue-on-error: true
        timeout-minutes: 22
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
          # 처음 한 바퀴는 밀린 회사가 수백 곳이라 넉넉히 돈다. 회사당 요청이
          # 한 번(제출목록) + 서류마다 두 번이고 SEC 는 초당 열 번까지 받는다.
          # 뜯어낸 행을 남기게 되면서(PARSE_VER 3) 본 서류를 한 번 다시
          # 훑는다. 1,944곳이라 150씩이면 열세 시간이다 — 실측 3분/150곳
          # 이었으니 220 으로 올려도 넉넉하다.
          FPI_PER_RUN: '220'
        run: |
          # **파이프가 죽음을 삼키지 않게.** tee 를 거치면 파이썬이 예외로 죽어도
          # bash 는 tee 의 성공만 본다 — 그래서 수집이 매번 일곱 번째 회사에서
          # 죽고 있는데도 워크플로는 초록불이었다.
          set -o pipefail
          python scrape_seg_fpi.py | tee fpi.log
          {
            echo '### 외국 기업 부문 매출·실적 수치'
            echo '```'
            tail -25 fpi.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 페이지 다시 만들기
        run: python build.py > /dev/null

      # 되커밋 방식은 다른 둘과 같다 — 만들어진 파일은 방금 받은 우리 것이
      # 최신이므로 부딪히면 우리 것을 택하고, 합친 코드로 페이지를 다시 만든다.
      # rebase 는 쓰지 않는다(충돌 상태로 멈춰 재시도가 전부 실패한다).
      # merge 하지 않는다 — 제 파일만 최신 main(얕게) 위에 얹어 민다(11/04, save_owned.sh)
      - name: 저장소에 반영
        id: publish
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/save_owned.sh "사업부별 매출 갱신 $(date -u +%F' '%H:%M) [skip ci]" \
            data/segments_sec.json data/segments_edgar.json data/segments_fpi.json data/financials_fpi.json data/rpo_us.json data/acq_us.json
          python build.py > /dev/null || true
          bash .github/scripts/save_owned.sh "페이지 다시 만들기 [skip ci]" index.html version.txt \
            || echo "페이지 푸시는 다음 루프에 맡긴다"

      # 30분 크론이 실제로는 몇 시간에 한 번만 떴다(11/04: 06:45 → 13:43 → 14:56) — 10-Q 가 올라와도
      # 그만큼 늦게 들어왔다. 끝나면 바로 다음 실행을 건다(빨리 끝나도 10분은 채운다).
      - name: 다음 실행 예약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 600 - ($(date +%s) - ${T0:-0}) ))
          [ "$left" -gt 0 ] && sleep "$left"
          gh workflow run segments.yml --ref main -R "$GITHUB_REPOSITORY" || echo "예약 실패 — 크론에 맡긴다"
