# 사업부별 매출 뼈대 — SEC 분기 벌크에서 미국 전 종목을 한꺼번에.
#
# stockanalysis 는 **종목마다 요청 한 번**이라 시총 상위부터 조금씩 채울 수밖에
# 없었다. 1,350종목을 두드려 223종목. 회원님이 열어 보는 종목은 거의 늘 비었다.
#
# SEC 가 분기마다 내는 벌크 zip(85MB)에는 부문 축이 그대로 살아 있다 —
# 우리가 쓰던 companyfacts API 가 축을 떨어뜨렸을 뿐이다. zip 하나에 그 분기에
# 접수된 모든 서류가 들어 있어 **분기당 요청 한 번**으로 전 종목이 들어온다.
#
# **왜 워크플로를 따로 뒀나.** 열여섯 분기를 훑으면 1.4GB · 4분이 걸린다.
# 20분마다 도는 numbers.yml 에 끼우면 그날 하루 그 워크플로가 시간을 넘겨
# 되커밋까지 못 간다. 그래서 저장소 규칙대로 **건드리는 파일을 갈라** 뗐다.
#
#   collect.yml   1시간   data/earnings*.json · data/caps.json
#   numbers.yml   20분    data/financials*.json · data/segments.json
#   여기          3시간   data/segments_sec.json · data/segments_edgar.json
#
# 겹치는 건 만들어진 index.html 뿐이고, 그건 합친 자료로 다시 만들면 그만이다.
#
# **벌크만으로는 늘 두 분기 늦는다.** 벌크는 접수된 분기 기준이라, 6월 결산을
# 7월에 신고하면 그 서류는 10월에 나오는 묶음에 들어간다. 재보니 부문 자료가
# 있는 1,600종목 중 61%가 두 분기 뒤졌다 — 총매출은 2Q26 까지 그려지는데 부문
# 막대는 4Q25 에서 끊겼다. 메우라고 붙여 둔 stockanalysis 는 1,784종목 중
# 1,484종목이 빈 기록이었다.
#
# 그래서 두 단계로 돈다.
#   1) 벌크 확인 — 대개 요청 한 번으로 끝난다(넉 달에 한 번만 진짜로 일한다)
#   2) 제출 서류 — 분기 색인 한 장으로 최근 10-Q/10-K 를 찾아, 뒤진 종목부터
#      인라인 XBRL 인스턴스를 뜯는다. 이미 본 서류는 접수번호로 건너뛴다.

name: 사업부별 매출 (SEC 벌크 + 제출 서류)

on:
  workflow_dispatch:
  # 한 시간마다. 벌크 확인은 요청 한 번이고, 나머지는 제출 서류를 따라간다.
  # **다 따라잡으면 몇 초에 끝난다** — 색인 세 장을 받아 '새 서류 없음'을 확인하고
  # 곧장 나온다. 그래서 자주 도는 값이 싸다. 처음 한 바퀴(7,678건)만 서너 번
  # 크게 돌면 되고, 그 뒤로는 새로 접수된 서류 몇십 건이 전부다.
  schedule:
    - cron: '20 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_seg_sec.py'
      - 'scrape_seg_edgar.py'
      - '.github/workflows/segments.yml'

permissions:
  contents: write

concurrency:
  group: segments-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  segments:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧩 SEC 벌크에서 부문별 매출
        timeout-minutes: 15
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
        run: |
          python scrape_seg_sec.py | tee seg.log
          {
            echo '### 사업부별 매출 (SEC 벌크)'
            echo '```'
            cat seg.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 벌크가 아직 안 실은 최근 분기를 제출 서류에서 직접 받는다.
      # 서류 하나에 요청 두 번 · 300KB(gzip) 라, 한 번에 700건이면 8분쯤이다.
      - name: 📄 제출 서류에서 최근 분기 부문 매출
        continue-on-error: true
        timeout-minutes: 25
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
        run: |
          python scrape_seg_edgar.py | tee edgar.log
          {
            echo '### 사업부별 매출 (제출 서류)'
            echo '```'
            tail -30 edgar.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 페이지 다시 만들기
        run: python build.py > /dev/null

      # 되커밋 방식은 다른 둘과 같다 — 만들어진 파일은 방금 받은 우리 것이
      # 최신이므로 부딪히면 우리 것을 택하고, 합친 코드로 페이지를 다시 만든다.
      # rebase 는 쓰지 않는다(충돌 상태로 멈춰 재시도가 전부 실패한다).
      - name: 저장소에 반영
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f seg.log edgar.log
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "사업부별 매출 갱신 $(date -u +%F' '%H:%M) [skip ci]"

          for i in 1 2 3 4 5; do
            git merge --abort 2>/dev/null || true
            # 늦게 도착한 쓰기를 거둬 간다. 단계가 시간을 넘겨 죽을 때 파이프 뒤의
            # 파이썬이 고아로 살아남아 data/ 를 계속 쓰는 일이 있다 — 커밋 뒤에
            # desc.json 이 또 바뀌어 있으면 merge 가 "would be overwritten" 으로
            # 서고, 그 실행이 받은 수집분 전체가 버려진다(실제로 홍콩 부문 첫
            # 수집분을 통째로 잃었다). 반복문 들머리마다 쓸어 담으면 안전하다.
            git add data/ index.html 2>/dev/null || true
            git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
            git fetch origin main || { sleep $((2**i)); continue; }

            if ! git merge --no-edit origin/main; then
              stuck=$(git diff --name-only --diff-filter=U)
              if [ -z "$stuck" ]; then
                # 충돌 없이 merge 가 실패했다(잠금 파일 따위). 다음 바퀴에서 다시.
                echo "merge 실패(충돌 아님), 재시도"; sleep $((2**i)); continue
              fi
              others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' || true)
              if [ -n "$others" ]; then
                echo "코드가 부딪혔다. 손으로 봐야 한다:"; echo "$others"; exit 1
              fi
              # shellcheck disable=SC2086
              git checkout --ours -- $stuck
              git add $stuck
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "충돌을 못 풀었다:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git commit --no-edit
            fi

            python build.py > /dev/null
            git add index.html
            git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"

            git push origin HEAD:main && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
