# AI 빈칸 메우기 — 1Q18 부터 사업부·지역·수주가 빈 분기를 공시 원문에서 읽는다(ai_fill.py).
# **네 갈래가 동시에** 돌고(회사를 열쇠 해시로 나눔) 갈래마다 제 파일(data/ai_fill_s{0..3}.json)의 주인이다 — 커밋이 안 부딪힌다.
# 끝나면 곧장 다음 실행을 건다(이어달리기). 구독 한도에 걸린 갈래는 25분 쉰다. 크론은 안전망.
# 키: GitHub Secrets 의 CLAUDE_CODE_OAUTH_TOKEN. 없으면 아무것도 안 한다.
name: AI 빈칸 메우기

on:
  workflow_dispatch:
    inputs:
      only:
        description: '몇 종목만 (예: us:KO jp:6501) — 비우면 전부'
        required: false
        default: ''
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: aifill-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AI_MODEL: sonnet
      AIFILL_SHARD: '${{ matrix.shard }}/4'
      AIFILL_SECS: '2700'
      AIFILL_WORKERS: '6'
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Claude Code CLI
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version
      - name: 🤖 AI 빈칸 메우기
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -o pipefail
          python ai_fill.py ${{ github.event.inputs.only }} | { grep -v '^  [a-z_]*\.json\|^  !' || true; } | tee fill.log
          { echo "### 갈래 ${{ matrix.shard }}"; echo '```'; tail -40 fill.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 저장소에 반영
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f fill.log
          F=data/ai_fill_s${{ matrix.shard }}.json
          [ -f "$F" ] || { echo "파일이 없다."; exit 0; }
          git add "$F"
          git diff --cached --quiet && { echo "달라진 게 없다."; exit 0; }
          git commit -m "AI 빈칸 메우기 갈래 ${{ matrix.shard }} $(date -u +%F' '%H:%M) [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $((2**i)); continue; }
            git merge --no-edit -X ours origin/main || { git merge --abort; sleep $((2**i)); continue; }
            git push origin HEAD:main && exit 0
            sleep $((2**i + RANDOM % 5))
          done
          echo "푸시를 끝내 못 했다"; exit 1

  relay:
    needs: fill
    if: always() && github.ref_name == 'main' && github.event.inputs.only == ''
    runs-on: ubuntu-latest
    steps:
      - name: 다음 실행을 건다(이어달리기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ai_fill.yml --repo "${{ github.repository }}" --ref main || true
