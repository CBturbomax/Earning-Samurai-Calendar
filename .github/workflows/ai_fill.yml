# AI 빈칸 메우기 — 1Q18 부터 사업부·지역·수주가 빈 분기를 공시 원문에서 읽는다(ai_fill.py).
# **네 갈래가 동시에** 돌고(회사를 열쇠 해시로 나눔) 갈래마다 제 파일(data/ai_fill_s{0..3}.json)의 주인이다 — 커밋이 안 부딪힌다.
# 30분 크론으로 돈다(이어달리기는 11/10 껐다). 구독 한도에 걸린 갈래는 25분 쉰다. **기본은 전부 Codex — Claude 계정은 손으로 claude=1 일 때만.**
# 키: GitHub Secrets 의 CLAUDE_CODE_OAUTH_TOKEN · CLAUDE_CODE_OAUTH_TOKEN_2 · CODEX_AUTH_JSON(있는 것만 쓴다).
# 한도에 한 번 걸리면 그 갈래는 곧장 멈춘다(AIFILL_RETRY=1). 추가 결제는 각 계정 설정에서 꺼 둘 것.
name: AI 빈칸 메우기

on:
  # 정시 실행은 Codex 갈래만 돈다(11/02) — Claude 계정은 회원님이 쓰는 한도·추가 결제 걱정이 있어 손으로 부를 때만.
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      claude:
        description: '1 이면 0·1 갈래를 Claude 계정으로(손으로 부를 때만 — 기본은 전부 Codex)'
        required: false
        default: ''
      codex_only:
        description: '(옛 입력 — 이제 기본이 Codex 만이라 안 쓴다)'
        required: false
        default: ''
      only:
        description: '몇 종목만 (예: us:KO jp:6501) — 비우면 전부'
        required: false
        default: ''
      max:
        description: '갈래당 최대 호출 수(시험은 작게)'
        required: false
        default: '900'      # 11/05: 토큰 300만이면 공시 600건 넘게 읽는다 · 11/04 밤: 이어달리기가 이 기본값(40)으로 걸려 실행마다 3분 만에 끝났다
      recent:
        description: '최근 며칠 안의 빈칸만(0 = 1Q18 부터 전부)'
        required: false
        default: '730'

permissions:
  contents: write
  actions: write

concurrency:
  group: aifill-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'   # 11/02 다시 켬: Claude 두 계정 + Codex, 한도 한 번이면 멈춤. relay(이어달리기)는 첫 시험 확인 뒤에 켠다
    timeout-minutes: 58
    strategy:
      fail-fast: false
      # 갈래마다 다른 구독을 쓴다(한도를 나눠 쓴다). 그 갈래 열쇠가 비었으면 남은 것 중 첫째로.
      #   claude1 = CLAUDE_CODE_OAUTH_TOKEN · claude2 = CLAUDE_CODE_OAUTH_TOKEN_2 · codex = CODEX_AUTH_JSON(~/.codex/auth.json 내용)
      matrix:
        include:
          # tok = 이번 실행 토큰 상한. claude2(회원님이 지금 채팅하는 계정)는 작게 — 채팅까지 막히면 안 된다
          # 11/05 밤: 동시 6×4=24 로 Codex 가 403 으로 전부 거절 — 갈래마다 3(합 12, 정상이던 수)으로. 0·1 갈래(회사 절반)가 Claude 토큰 6만~15만이라 1분 만에 끝나 사실상 안 돌았다 — Codex 로 같은 크기
          # 11/10: 네 갈래 전부 Codex(갈래마다 2줄, 합 8). alt 는 손으로 claude=1 을 줬을 때만 쓰는 Claude 계정이고 그때 토큰 상한은 ctok.
          - {shard: 0, want: codex, alt: claude1, tok: '3000000', ctok: '150000', w: '2'}
          - {shard: 1, want: codex, alt: claude2, tok: '3000000', ctok: '60000', w: '2'}
          - {shard: 2, want: codex, tok: '3000000', w: '2'}
          - {shard: 3, want: codex, tok: '3000000', w: '2'}
    env:
      TOK1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TOK2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      AIFILL_RETRY: '1'
      AIFILL_TOKENS: ${{ matrix.tok }}
      AI_MODEL: haiku          # 가장 가벼운 모델 — 합계 검산이 틀린 답을 거른다
      AIFILL_MAX: "${{ github.event.inputs.max || '900' }}"        # 갈래당 한 번에 120건까지(토큰 상한 tok 이 먼저 막는다)
      AIFILL_DOC: '20000'
      AIFILL_RECENT: "${{ github.event.inputs.recent || '730' }}"
      CODEX_EFFORT: low
      AIFILL_SHARD: '${{ matrix.shard }}/4'
      AIFILL_SECS: '2700'
      AIFILL_WORKERS: "${{ matrix.w || '1' }}"   # Codex 갈래는 두 줄
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 암호 걸린 결산단신 PDF(고마쓰·TDK)는 우리 해석기가 못 연다 — poppler pdftotext 로 읽는다(11/04)
      - name: pdftotext
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) || true
      - name: 엔진 고르기
        run: |
          has() { case $1 in claude1) [ -n "$TOK1" ];; claude2) [ -n "$TOK2" ];; codex) [ -n "$CODEX_AUTH_JSON" ];; esac; }
          pick=""
          # **Claude 계정은 손으로 claude=1 을 줄 때만 쓴다(11/10).** 예전에는 codex_only 입력을 아무도 안 읽어, 이어달리기·정시 실행이
          # 6분마다 Claude 두 계정을 썼다(1회 21만 토큰). 지금은 기본이 전부 Codex 이고, Codex 열쇠가 없으면 그 갈래는 쉰다.
          if [ "${{ github.event.inputs.claude }}" = "1" ] && [ -n "${{ matrix.alt }}" ] && has "${{ matrix.alt }}"; then pick="${{ matrix.alt }}";
          elif has codex; then pick=codex; fi
          echo "엔진: ${pick:-없음}"
          case $pick in
            claude1) echo "CLAUDE_CODE_OAUTH_TOKEN=$TOK1" >> "$GITHUB_ENV"; echo "AI_ENGINE=claude" >> "$GITHUB_ENV"; echo "CLAUDE_TOK=${{ matrix.ctok }}" >> "$GITHUB_ENV";;
            claude2) echo "CLAUDE_CODE_OAUTH_TOKEN=$TOK2" >> "$GITHUB_ENV"; echo "AI_ENGINE=claude" >> "$GITHUB_ENV"; echo "CLAUDE_TOK=${{ matrix.ctok }}" >> "$GITHUB_ENV";;
            codex)   mkdir -p ~/.codex && printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json && chmod 600 ~/.codex/auth.json
                     echo "AI_ENGINE=codex" >> "$GITHUB_ENV";;
          esac
          [ -n "$pick" ] && echo "AI_READY=1" >> "$GITHUB_ENV" || true
      - name: Claude Code CLI
        if: env.AI_ENGINE == 'claude'
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version
      - name: Codex CLI
        if: env.AI_ENGINE == 'codex'
        run: npm install -g @openai/codex >/dev/null 2>&1 && codex --version
      - name: 🤖 AI 빈칸 메우기
        if: env.AI_READY == '1'
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -o pipefail
          [ -n "${CLAUDE_TOK:-}" ] && export AIFILL_TOKENS="$CLAUDE_TOK" AIFILL_WORKERS=1   # Claude 계정으로 돌 때는 작은 상한·한 줄
          python ai_fill.py ${{ github.event.inputs.only }} | { grep -v '^  [a-z_]*\.json\|번역 받기' || true; } | tee fill.log
          { echo "### 갈래 ${{ matrix.shard }}"; echo '```'; tail -40 fill.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 저장소에 반영
        if: env.AI_READY == '1'
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f fill.log
          F=data/ai_fill_s${{ matrix.shard }}.json
          [ -f "$F" ] || { echo "파일이 없다."; exit 0; }
          bash .github/scripts/save_owned.sh "AI 빈칸 메우기 갈래 ${{ matrix.shard }} $(date -u +%F' '%H:%M) [skip ci]" "$F"

  relay:
    needs: fill
    # 끝나면 곧장 다음 실행(Codex 갈래만) — 30분 크론을 기다리지 않는다. 한도에 걸린 갈래는 다음 실행에서 25분 쉰다.
    # 11/10 껐다: 한도에 걸려 쉬는 중에도 6분마다 다음 실행을 걸어 헛돌았다. 30분 크론이면 충분하다(막는 것은 Codex 한도다).
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: 다음 실행을 건다(이어달리기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh workflow run ai_fill.yml --repo "${{ github.repository }}" --ref main -f codex_only=1 || true
