# 일본 지역별 매출 · 수주(受注高·受注残高) — 결산단신의 태그 없는 표(scrape_geo_jp.py + geojp.py).
# **이 워크플로가 data/geo_jp.json 의 주인이다** — 다른 워크플로는 읽기만 한다.
#
# 최근 TDnet 결산단신(발표 당일)을 먼저 보고, 남은 시간에 옛 결산단신(JPX 보관소, 5~6년치)을
# 시총 큰 순으로 거슬러 받는다. 처음 한두 날은 거슬러 받기가 일이고, 다 받으면 최근 것만 보므로
# 몇 분이면 끝난다. 받아둔 zip 은 이름으로 건너뛴다.

name: 일본 지역별 매출·수주

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_geo_jp.py'
      - 'geojp.py'
      - '.github/workflows/geo_jp.yml'

permissions:
  contents: write
  actions: write      # 다음 실행 예약(이어달리기)

concurrency:
  group: geojp-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  geo:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 40
    env:
      GEO_SECS: '1500'
    steps:
      - name: 시작 시각
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🗾 지역별 매출·수주 받기
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          python scrape_geo_jp.py | tee geo.log
          {
            echo '### 일본 지역별 매출·수주'
            echo '```'
            tail -20 geo.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 페이지 다시 만들기
        run: python build.py > /dev/null

      # 되커밋 방식은 segments.yml 과 같다 — 생성물이 부딪히면 우리 것을 택하고
      # 합친 코드로 페이지를 다시 만든다. rebase 는 쓰지 않는다.
      # merge 하지 않는다 — 제 파일만 최신 main(얕게) 위에 얹어 민다(11/04, save_owned.sh)
      - name: 저장소에 반영
        id: publish
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/save_owned.sh "일본 지역·수주 갱신 $(date -u +%F' '%H:%M) [skip ci]" \
            data/geo_jp.json
          python build.py > /dev/null || true
          bash .github/scripts/save_owned.sh "페이지 다시 만들기 [skip ci]" index.html version.txt data/seg_holes.json \
            || echo "페이지 푸시는 다음 루프에 맡긴다"

      - name: 다음 실행 예약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 600 - ($(date +%s) - ${T0:-0}) ))
          [ "$left" -gt 0 ] && sleep "$left"
          gh workflow run geo_jp.yml --ref main -R "$GITHUB_REPOSITORY" || echo "예약 실패 — 크론에 맡긴다"
