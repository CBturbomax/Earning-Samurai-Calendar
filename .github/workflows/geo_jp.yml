# 일본 지역별 매출 · 수주(受注高·受注残高) — 결산단신의 태그 없는 표(scrape_geo_jp.py + geojp.py).
# **이 워크플로가 data/geo_jp.json 의 주인이다** — 다른 워크플로는 읽기만 한다.
#
# 최근 TDnet 결산단신(발표 당일)을 먼저 보고, 남은 시간에 옛 결산단신(JPX 보관소, 5~6년치)을
# 시총 큰 순으로 거슬러 받는다. 처음 한두 날은 거슬러 받기가 일이고, 다 받으면 최근 것만 보므로
# 몇 분이면 끝난다. 받아둔 zip 은 이름으로 건너뛴다.

name: 일본 지역별 매출·수주

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_geo_jp.py'
      - 'geojp.py'
      - '.github/workflows/geo_jp.yml'

permissions:
  contents: write

concurrency:
  group: geojp-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  geo:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 40
    env:
      GEO_SECS: '1500'
    steps:
      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🗾 지역별 매출·수주 받기
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          python scrape_geo_jp.py | tee geo.log
          {
            echo '### 일본 지역별 매출·수주'
            echo '```'
            tail -20 geo.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 페이지 다시 만들기
        run: python build.py > /dev/null

      # 되커밋 방식은 segments.yml 과 같다 — 생성물이 부딪히면 우리 것을 택하고
      # 합친 코드로 페이지를 다시 만든다. rebase 는 쓰지 않는다.
      - name: 저장소에 반영
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f geo.log
          git add data/ index.html version.txt
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "일본 지역·수주 갱신 $(date -u +%F' '%H:%M) [skip ci]"

          for i in 1 2 3 4 5; do
            git merge --abort 2>/dev/null || true
            git add data/ index.html version.txt 2>/dev/null || true
            git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
            git fetch origin main || { sleep $((2**i)); continue; }

            if ! git merge --no-edit origin/main; then
              stuck=$(git diff --name-only --diff-filter=U)
              if [ -z "$stuck" ]; then
                echo "merge 실패(충돌 아님), 재시도"; sleep $((2**i)); continue
              fi
              others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' -e '^version\.txt$' || true)
              if [ -n "$others" ]; then
                echo "코드가 부딪혔다. 손으로 봐야 한다:"; echo "$others"; exit 1
              fi
              # shellcheck disable=SC2086
              git checkout --ours -- $stuck
              git add $stuck
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "충돌을 못 풀었다:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git commit --no-edit
            fi

            python build.py > /dev/null
            git add index.html version.txt
            git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"

            git push origin HEAD:main && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
