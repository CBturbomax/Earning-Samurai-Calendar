# 일본 부문 연간 이력 (EDINET DB). **이 워크플로가 data/segments_jp_hist.json 의
# 주인이다** — 다른 워크플로는 읽기만 한다.
#
# 무료 키가 100건/일이라 하루 한 번 90종목씩(시총 큰 순), 전 종목(~1,300)을
# 두 주쯤에 채운다. 다 따라잡으면 반년 지난 종목만 다시 받으므로 몇 초에 끝난다.
# 키(EDINETDB_KEY 시크릿)가 없으면 아무것도 하지 않는다.

name: 부문 연간 이력 (EDINET DB)

on:
  workflow_dispatch:
  schedule:
    - cron: '40 20 * * *'          # 매일 한 번 (05:40 JST)
  push:
    branches: [main]
    paths:
      - 'scrape_seg_jp_edinetdb.py'
      - '.github/workflows/segments_hist.yml'

permissions:
  contents: write

concurrency:
  group: seghist-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  hist:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 15
    env:
      EDINETDB_KEY: ${{ secrets.EDINETDB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🗾 연간 부문 이력 받기
        if: env.EDINETDB_KEY != ''
        timeout-minutes: 10
        run: |
          python scrape_seg_jp_edinetdb.py | tee hist.log
          {
            echo '### 부문 연간 이력 (EDINET DB)'
            echo '```'
            tail -30 hist.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 페이지 다시 만들기
        run: python build.py > /dev/null

      # 되커밋 방식은 segments.yml 과 같다 — 생성물이 부딪히면 우리 것을 택하고
      # 합친 코드로 페이지를 다시 만든다. rebase 는 쓰지 않는다.
      - name: 저장소에 반영
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f hist.log
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "부문 연간 이력 갱신 $(date -u +%F' '%H:%M) [skip ci]"

          for i in 1 2 3 4 5; do
            git merge --abort 2>/dev/null || true
            git add data/ index.html 2>/dev/null || true
            git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
            git fetch origin main || { sleep $((2**i)); continue; }

            if ! git merge --no-edit origin/main; then
              stuck=$(git diff --name-only --diff-filter=U)
              if [ -z "$stuck" ]; then
                echo "merge 실패(충돌 아님), 재시도"; sleep $((2**i)); continue
              fi
              others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' || true)
              if [ -n "$others" ]; then
                echo "코드가 부딪혔다. 손으로 봐야 한다:"; echo "$others"; exit 1
              fi
              # shellcheck disable=SC2086
              git checkout --ours -- $stuck
              git add $stuck
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "충돌을 못 풀었다:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git commit --no-edit
            fi

            python build.py > /dev/null
            git add index.html
            git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"

            git push origin HEAD:main && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
