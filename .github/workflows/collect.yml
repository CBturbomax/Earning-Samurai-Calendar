# 실적발표 일정을 GitHub이 대신 받아온다.
#
# 세 시장 소스는 브라우저에서 열리는 평범한 공개 페이지지만, 받아오려면 어딘가에서
# 인터넷에 나가야 한다. 그 '어딘가'를 GitHub 러너로 삼으면 아무 컴퓨터도 켜둘 필요가 없다.
# 받은 결과(data/*.json)와 다시 만든 index.html 을 저장소에 되커밋한다.
#
# 한 시장이 막혀도 나머지는 계속 간다(continue-on-error). 실패한 시장은 그냥
# '미수집'으로 남고, 다음 실행 때 못 받은 날만 이어서 받는다.
#
# 첫 실행은 GitHub API 커밋으로 깨운다 — git push 로 올린 워크플로 파일은
# GitHub 이 자동 실행을 걸어주지 않는 경우가 있다.

name: 실적발표 일정 수집

on:
  # 손으로 돌리기 — Actions 탭에서 Run workflow 버튼
  workflow_dispatch:
    inputs:
      from:
        description: '시작일 (YYYY-MM-DD, 비우면 2주 전)'
        required: false
      to:
        description: '종료일 (YYYY-MM-DD, 비우면 60일 뒤)'
        required: false
  # 한 시간마다. 페이지를 언제 열어도 최신이어야 하므로 하루 한 번으로는 부족하다.
  # 이미 받아둔 날은 건너뛰므로 대부분의 실행은 몇 분이면 끝난다.
  schedule:
    - cron: '0 * * * *'
  # 수집 코드를 고쳐 올리면 바로 한 번 돌려본다.
  # data/ 와 index.html 은 제외 — 이 워크플로가 만든 커밋이 자기를 또 부르면 안 된다.
  push:
    paths:
      - 'scrape*.py'
      - 'build.py'
      - 'markets.py'
      - 'companies*.py'
      - 'translit.py'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

# 앞선 실행이 아직 돌고 있으면 기다린다. 같은 파일에 동시에 쓰지 않도록.
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 스크래퍼가 연속 3일 실패하면 스스로 접으므로 이 한도까지 갈 일은 없다.
    # 그래도 무한정 도는 일이 없도록 뚜껑은 덮어둔다.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 수집 범위 정하기
        id: range
        run: |
          FROM="${{ inputs.from }}"
          TO="${{ inputs.to }}"
          [ -z "$FROM" ] && FROM=$(date -u -d '14 days ago' +%F)
          [ -z "$TO" ]   && TO=$(date -u -d '60 days'      +%F)
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO"     >> "$GITHUB_OUTPUT"
          echo "수집 범위: $FROM ~ $TO"

      # 이미 받아둔 날은 건너뛰므로, 매일 돌려도 새로 늘어난 날만 받는다.
      - name: 🇺🇸 미국 (나스닥)
        continue-on-error: true
        timeout-minutes: 25
        run: python scrape_us.py "${{ steps.range.outputs.from }}" "${{ steps.range.outputs.to }}"

      # 닛케이는 데이터센터 IP 를 막는다. 집에서 돌리면 되지만 여기서는 첫 요청부터
      # 껍데기가 온다. 오래 붙들지 않게 한 번 실패하면 바로 접는다.
      # (이미 받아둔 일본 자료는 그대로 살아 있고, 새 날짜만 못 채운다.)
      - name: 🇯🇵 일본 (닛케이)
        continue-on-error: true
        timeout-minutes: 20
        env:
          EARNINGS_GIVE_UP: '1'
        run: python scrape.py "${{ steps.range.outputs.from }}" "${{ steps.range.outputs.to }}"

      # 홍콩은 '이미 나온 공시'라 과거만 의미가 있다. 넉넉히 뒤로 훑는다.
      - name: 🇭🇰 홍콩 (HKEXnews 공시)
        continue-on-error: true
        timeout-minutes: 20
        run: python scrape_hk.py "$(date -u -d '120 days ago' +%F)" "$(date -u +%F)"

      # 일본·홍콩 시가총액. 원본 소스가 안 줘서 따로 받는다.
      # 이게 있어야 '큰 회사만 보기'가 세 시장 모두에 걸린다.
      - name: 💰 일본·홍콩 시가총액
        continue-on-error: true
        timeout-minutes: 20
        run: python scrape_caps.py

      # build.py 가 시장별 건수를 그대로 찍어준다. 그걸 실행 요약에 붙인다.
      - name: 페이지 다시 만들기
        run: |
          python build.py | tee build.log
          {
            echo '### 수집 결과'
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 저장소에 반영
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build.log
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          # [skip ci] — 이 커밋이 워크플로를 다시 부르지 않도록
          git commit -m "일정 갱신 $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
