# 실적발표 일정을 GitHub이 대신 받아온다.
#
# 세 시장 소스는 브라우저에서 열리는 평범한 공개 페이지지만, 받아오려면 어딘가에서
# 인터넷에 나가야 한다. 그 '어딘가'를 GitHub 러너로 삼으면 아무 컴퓨터도 켜둘 필요가 없다.
# 받은 결과(data/*.json)와 다시 만든 index.html 을 저장소에 되커밋한다.
#
# 한 시장이 막혀도 나머지는 계속 간다(continue-on-error). 실패한 시장은 그냥
# '미수집'으로 남고, 다음 실행 때 못 받은 날만 이어서 받는다.
#
# 첫 실행은 GitHub API 커밋으로 깨운다 — git push 로 올린 워크플로 파일은
# GitHub 이 자동 실행을 걸어주지 않는 경우가 있다.

name: 실적발표 일정 수집

on:
  # 손으로 돌리기 — Actions 탭에서 Run workflow 버튼
  workflow_dispatch:
    inputs:
      from:
        description: '시작일 (YYYY-MM-DD, 비우면 2주 전)'
        required: false
      to:
        description: '종료일 (YYYY-MM-DD, 비우면 60일 뒤)'
        required: false
  # 20분마다. 이미 받아둔 날은 건너뛰므로 대부분의 실행은 몇 분이면 끝나고,
  # 그 사이는 노는 시간이다 — 공개 저장소라 Actions 시간이 무제한 무료이므로
  # 한 시간을 다 기다릴 이유가 없다. 새 발표일이 잡히거나 시가총액이 바뀌면
  # 최대 20분 안에 반영된다.
  schedule:
    - cron: '*/20 * * * *'
  # 수집 코드를 고쳐 올리면 바로 한 번 돌려본다.
  # data/ 와 index.html 은 제외 — 이 워크플로가 만든 커밋이 자기를 또 부르면 안 된다.
  #
  # main 에서만 돈다. 기능 브랜치에서도 돌게 두었더니 두 브랜치가 각자 자료를 받아
  # 서로 다른 data/ 를 커밋했고, 그게 매번 충돌로 돌아왔다. 사이트에 나가는 건
  # main 하나뿐이니 받는 것도 하나면 된다.
  push:
    branches: [main]
    paths:
      - 'scrape*.py'
      - 'build.py'
      - 'markets.py'
      - 'companies*.py'
      - 'translit.py'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

# 앞선 실행이 아직 돌고 있으면 기다린다. 같은 파일에 동시에 쓰지 않도록.
#
# numbers.yml(실적 수치, 20분마다)과는 **그룹을 나눈다.** 처음에 한 그룹으로 묶었더니
# 20분짜리가 30분짜리 뒤에 줄을 서고, 그 줄에 다음 것이 또 오면 기다리던 놈이
# 취소됐다 — 실적 수치 갱신이 한 번도 끝까지 못 갔다(실제로 그랬다).
# 대신 **건드리는 파일을 갈라놨다.** 여기는 일정과 시가총액, 저기는 실적 수치다.
# 겹치는 건 만들어진 index.html 뿐이고, 그건 합친 뒤 다시 만들면 된다.
concurrency:
  group: collect-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 스크래퍼가 연속 3일 실패하면 스스로 접으므로 이 한도까지 갈 일은 없다.
    # 그래도 무한정 도는 일이 없도록 뚜껑은 덮어둔다.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 수집 범위 정하기
        id: range
        run: |
          FROM="${{ inputs.from }}"
          TO="${{ inputs.to }}"
          [ -z "$FROM" ] && FROM=$(date -u -d '14 days ago' +%F)
          [ -z "$TO" ]   && TO=$(date -u -d '60 days'      +%F)
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO"     >> "$GITHUB_OUTPUT"
          echo "수집 범위: $FROM ~ $TO"

      # 이미 받아둔 날은 건너뛰므로, 매일 돌려도 새로 늘어난 날만 받는다.
      - name: 🇺🇸 미국 (나스닥)
        continue-on-error: true
        timeout-minutes: 25
        run: python scrape_us.py "${{ steps.range.outputs.from }}" "${{ steps.range.outputs.to }}"

      # 닛케이는 데이터센터 IP 를 막는다. 집에서 돌리면 되지만 여기서는 첫 요청부터
      # 껍데기가 온다. 오래 붙들지 않게 한 번 실패하면 바로 접는다.
      # (이미 받아둔 일본 자료는 그대로 살아 있고, 새 날짜만 못 채운다.)
      - name: 🇯🇵 일본 (닛케이)
        continue-on-error: true
        timeout-minutes: 20
        env:
          EARNINGS_GIVE_UP: '1'
        run: python scrape.py "${{ steps.range.outputs.from }}" "${{ steps.range.outputs.to }}"

      # TDnet 발표 완료분은 fresh.yml(10분)로 옮겼다 — 발표 속보는 한 시간도 늦다.

      # 닛케이가 못 주는 '앞으로의 예정'을 JPX(일본거래소) 공식 엑셀로 받는다.
      # 결산기말이 같은 달인 회사끼리 한 파일, 주 단위 컴파일 + 당일 갱신분.
      # 파일 세 장에 300KB 라 매 실행 통째로 다시 받아도 싸다.
      - name: 🇯🇵 일본 발표 예정 (JPX 공식)
        continue-on-error: true
        timeout-minutes: 5
        run: python scrape_jp_sched.py

      # 홍콩은 '이미 나온 공시'라 과거만 의미가 있다.
      #
      # 120일만 훑던 시절에 **팝마트(09992)가 통째로 없었다.** 3월 하순에 낸
      # 연간 실적이 창 밖으로 밀려났고, 다음 반기 실적은 8월 하순이라 아직
      # 안 나왔다. 그래서 그 사이 넉 달 내내 화면에 존재하지 않았다.
      # 홍콩은 분기가 아니라 반기·연간만 내는 회사가 많아 120일로는 **한 회사도
      # 빠짐없이 한 번씩 나오는 것을 보장하지 못한다.** 1년+로 잡아야 한다.
      #
      # 이미 받아둔 날은 캐시로 건너뛰므로, 늘리는 값은 처음 한 번만 치른다.
      - name: 🇭🇰 홍콩 (HKEXnews 공시)
        continue-on-error: true
        timeout-minutes: 30
        run: python scrape_hk.py "$(date -u -d '400 days ago' +%F)" "$(date -u +%F)"

      # 일본·홍콩 시가총액. 원본 소스가 안 줘서 따로 받는다.
      # 이게 있어야 '큰 회사만 보기'가 세 시장 모두에 걸린다.
      - name: 💰 일본·홍콩 시가총액
        continue-on-error: true
        timeout-minutes: 20
        run: python scrape_caps.py

      # 실적 '수치'(매출·영업이익·부문별)는 여기서 받지 않는다. numbers.yml 이 20분마다
      # 따로 받는다 — 두 워크플로가 같은 파일을 건드리지 않게 갈라놓은 것이다.
      # 여기: data/earnings*.json · data/caps.json
      # 저기: data/financials*.json · data/segments.json

      # build.py 가 시장별 건수를 그대로 찍어준다. 그걸 실행 요약에 붙인다.
      - name: 페이지 다시 만들기
        run: |
          python build.py | tee build.log
          {
            echo '### 수집 결과'
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 되커밋. 여기서 한 번 크게 데었다.
      #
      # 예전에는 `git pull --rebase` 였다. 그런데 부딪히는 파일이 늘 data/ 와
      # index.html — 즉 **우리가 방금 만든 파일들**이다. 리베이스는 충돌 상태로
      # 멈추고, 재시도 반복문이 그 위에서 또 pull 을 불러 "unmerged files" 로
      # 네 번 다 실패했다. 20분간 받은 자료를 통째로 버렸다.
      #
      # 만들어진 파일에는 '누가 옳은가'를 따질 게 없다. 방금 받은 우리 것이 최신이다.
      # 그래서 합치다 부딪히면 우리 것을 택하고, 코드는 상대 것을 받아들인 뒤
      # **합친 코드로 페이지를 다시 만든다**. 코드가 부딪히면 그건 사람이 볼 일이라
      # 조용히 덮지 않고 실패시킨다.
      - name: 저장소에 반영
        env:
          BR: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build.log
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          # [skip ci] — 이 커밋이 워크플로를 다시 부르지 않도록
          git commit -m "일정 갱신 $(date -u +%F) [skip ci]"

          for i in 1 2 3 4 5; do
            git merge --abort 2>/dev/null || true
            # 늦게 도착한 쓰기를 거둬 간다. 단계가 시간을 넘겨 죽을 때 파이프 뒤의
            # 파이썬이 고아로 살아남아 data/ 를 계속 쓰는 일이 있다 — 커밋 뒤에
            # desc.json 이 또 바뀌어 있으면 merge 가 "would be overwritten" 으로
            # 서고, 그 실행이 받은 수집분 전체가 버려진다(실제로 홍콩 부문 첫
            # 수집분을 통째로 잃었다). 반복문 들머리마다 쓸어 담으면 안전하다.
            git add data/ index.html 2>/dev/null || true
            git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
            git fetch origin "$BR" || { sleep $((2**i)); continue; }

            if ! git merge --no-edit "origin/$BR"; then
              stuck=$(git diff --name-only --diff-filter=U)
              if [ -z "$stuck" ]; then
                # 충돌 없이 merge 가 실패했다(잠금 파일 따위). 다음 바퀴에서 다시.
                echo "merge 실패(충돌 아님), 재시도"; sleep $((2**i)); continue
              fi
              others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' || true)
              if [ -n "$others" ]; then
                echo "코드가 부딪혔다. 손으로 봐야 한다:"; echo "$others"; exit 1
              fi
              # shellcheck disable=SC2086
              git checkout --ours -- $stuck
              git add $stuck
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "충돌을 못 풀었다:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git commit --no-edit
            fi

            # 상대가 build.py 나 표기를 고쳤을 수 있다. 합친 코드 + 합친 자료로 다시.
            python build.py > /dev/null
            git add index.html
            git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"

            git push origin "HEAD:$BR" && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
