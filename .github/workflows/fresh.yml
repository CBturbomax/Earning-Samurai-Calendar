# 발표 속보 — 3분 주기 상주 루프.
#
# GitHub 크론은 최소 5분이고 실제로는 몇 분씩 밀린다. 그래서 크론에 기대지 않고
# **한 실행이 5시간 동안 3분마다 도는 반복문**으로 바꿨다. 30분 크론은 루프가
# 죽었을 때 다시 세우는 안전망일 뿐이다 — concurrency 가 한 번에 하나만 돌게
# 막고, 도는 동안 대기줄의 크론 실행이 자리를 이어받아 끊김 없이 이어진다.
#
# 한 바퀴: 오늘 TDnet 목록·결산단신(수치·부문·가이던스·설명) + 미국 8-K —
# 전부 캐시가 있어 새 발표가 없으면 몇 초에 끝나고, 바뀐 게 있을 때만
# 페이지를 다시 만들어 푸시한다.
#
# **여기가 이 파일들의 주인이다** (numbers.yml·collect.yml 에서 옮겨 왔다):
#   data/earnings_jp_past.json · data/financials_jp.json · data/segments_jp.json
#   data/briefs_jp.json · data/briefs_us.json
# 다른 워크플로는 읽기만 한다. 두 워크플로가 같은 파일에 쓰면 한쪽 수집분이
# 머지에서 사라진다 — 이 저장소가 한 번 겪은 일이다.

name: 발표 속보 (3분 루프)

on:
  workflow_dispatch:
  # 안전망 — 루프가 죽어 있으면 30분 안에 되살아난다.
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh.yml'

permissions:
  contents: write

concurrency:
  group: fresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    # 6시간 한도 안쪽. 여기서 잘려도 매 바퀴 푸시했으므로 3분치만 잃는다.
    timeout-minutes: 318
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3분 루프
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_changes() {
            git add data/ index.html
            git diff --cached --quiet && return 0
            python build.py > /dev/null
            git add index.html
            git commit -m "발표 속보 $(date -u +%H:%M) [skip ci]"
            for i in 1 2 3 4; do
              git merge --abort 2>/dev/null || true
              git add data/ index.html 2>/dev/null || true
              git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
              git fetch origin main || { sleep $((2**i)); continue; }
              if ! git merge --no-edit origin/main; then
                stuck=$(git diff --name-only --diff-filter=U)
                [ -z "$stuck" ] && { sleep $((2**i)); continue; }
                others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' || true)
                [ -n "$others" ] && { echo "코드 충돌:"; echo "$others"; return 1; }
                # shellcheck disable=SC2086
                git checkout --ours -- $stuck && git add $stuck
                git diff --name-only --diff-filter=U | grep -q . && return 1
                git commit --no-edit
              fi
              python build.py > /dev/null
              git add index.html
              git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"
              git push origin HEAD:main && return 0
              sleep $((2**i))
            done
            echo "푸시 실패 — 다음 바퀴에서 다시"
            return 0
          }

          # 5시간 좀 못 되게 돈다. 매 바퀴 3분을 맞추고, 바퀴가 길면 쉬지 않는다.
          END=$(( $(date +%s) + 300*60 - 15*60 ))
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1)); t0=$(date +%s)
            # 오늘·어제만 훑는다 — 매 바퀴 열흘치 목록을 두드리는 건 실례다.
            timeout 60  python scrape_jp_tdnet.py || true
            JP_BACK_DAYS=2 timeout 150 python scrape_fin_jp.py || true
            # 미국 8-K 와 일본 보관창 백필(부문·가이던스·설명 되훑기)은 열 바퀴
            # (30분)에 한 번 — 새 발표는 위의 오늘치가 이미 잡는다.
            # 45일 = TDnet 보관창 전체. 판(SEG_JP_VER 등)을 올리면 이 창 안의
            # 공시가 저절로 다시 뜯힌다 — 따라잡은 뒤에는 목록만 훑고 금방 끝난다.
            if [ $((n % 10)) -eq 1 ]; then
              PR_PER_RUN=60 timeout 90 python scrape_pr_us.py || true
              JP_BACK_DAYS=45 timeout 240 python scrape_fin_jp.py || true
            fi
            push_changes || exit 1
            el=$(( $(date +%s) - t0 ))
            [ "$el" -lt 180 ] && sleep $(( 180 - el ))
            echo "── 바퀴 $n 끝 (${el}초)"
          done
          echo "5시간 채움 — 대기 중인 다음 실행이 이어받는다"
