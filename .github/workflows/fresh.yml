# 발표 속보 — 3분 주기 상주 루프.
#
# GitHub 크론은 최소 5분이고 실제로는 몇 분씩 밀린다. 그래서 크론에 기대지 않고
# **한 실행이 5시간 동안 3분마다 도는 반복문**으로 바꿨다. 30분 크론은 루프가
# 죽었을 때 다시 세우는 안전망일 뿐이다 — concurrency 가 한 번에 하나만 돌게
# 막고, 도는 동안 대기줄의 크론 실행이 자리를 이어받아 끊김 없이 이어진다.
#
# 한 바퀴: 오늘 TDnet 목록·결산단신(수치·부문·가이던스·설명) + 미국 8-K —
# 전부 캐시가 있어 새 발표가 없으면 몇 초에 끝나고, 바뀐 게 있을 때만
# 페이지를 다시 만들어 푸시한다.
#
# **여기가 이 파일들의 주인이다** (numbers.yml·collect.yml 에서 옮겨 왔다):
#   data/earnings_jp_past.json · data/monthly_jp.json
#   data/financials_jp.json · data/segments_jp.json
#   data/briefs_jp.json · data/briefs_us.json · data/live_us.json
# 다른 워크플로는 읽기만 한다. 두 워크플로가 같은 파일에 쓰면 한쪽 수집분이
# 머지에서 사라진다 — 이 저장소가 한 번 겪은 일이다.

name: 발표 속보 (3분 루프)

on:
  workflow_dispatch:
  # 안전망 — 루프가 죽어 있으면 30분 안에 되살아난다.
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh.yml'

permissions:
  contents: write
  actions: write      # 다음 실행을 스스로 예약한다(아래 '이어달리기')

concurrency:
  group: fresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    # 6시간 한도 안쪽. 여기서 잘려도 매 바퀴 푸시했으므로 3분치만 잃는다.
    timeout-minutes: 318
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # **이어달리기 — 다음 실행을 먼저 줄 세워 둔다.** 30분 크론을 안전망으로
      # 믿었는데 GitHub 크론은 몇 시간씩 밀리거나 건너뛴다. 10/28 에 08:03 실행이
      # 12:48 쯤 끝난 뒤 다음 실행이 15:16 에야 섰다 — **두 시간 반 동안 속보가
      # 통째로 멈췄고** 그 사이 나온 실적(브링커 EAT)이 안 들어왔다. 회원님이
      # "3시간이 지났는데 왜 반영이 안 되냐"고 짚으신 자리다.
      # 들머리에서 workflow_dispatch 로 다음 실행을 걸어 두면 concurrency 대기줄에
      # 서 있다가 이 실행이 끝나는 즉시 이어받는다(GITHUB_TOKEN 으로 거는
      # workflow_dispatch 는 새 실행을 만든다 — 막히는 것은 push 등 다른 이벤트다).
      # 대기줄에는 하나만 서므로 몇 번 걸어도 겹치지 않는다.
      - name: 다음 실행 예약
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fresh.yml --ref main -R "$GITHUB_REPOSITORY" || echo "예약 실패 — 크론 안전망에 맡긴다"

      - name: 3분 루프
        run: |
          # **`bash -e` 를 끈다.** GitHub 은 run 블록을 `bash -e` 로 돌리는데,
          # 이 루프에는 `실패해도 되는` 명령이 많다(fetch·merge·is-ancestor).
          # `cmd && return 0` 꼴이 거짓일 때 -e 가 스크립트를 통째로 죽여
          # **루프가 한 시간 넘게 커밋을 못 냈다.** 오류는 손으로 받는다.
          set +e
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_changes() {
            git add data/ index.html version.txt
            if ! git diff --cached --quiet; then
              python build.py > /dev/null
              git add index.html version.txt
              git commit -m "발표 속보 $(date -u +%H:%M) [skip ci]"
            fi
            # **바뀐 게 없어도 앞서 있으면 민다.** sync_code 가 담아 둔 커밋이
            # 여기서 안 나가면 영영 안 나간다.
            git fetch -q origin main 2>/dev/null
            if git merge-base --is-ancestor HEAD origin/main; then return 0; fi
            for i in 1 2 3 4; do
              git merge --abort 2>/dev/null || true
              git add data/ index.html version.txt 2>/dev/null || true
              git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
              git fetch origin main || { sleep $((2**i)); continue; }
              if ! git merge --no-edit origin/main; then
                stuck=$(git diff --name-only --diff-filter=U)
                [ -z "$stuck" ] && { sleep $((2**i)); continue; }
                others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' -e '^version\.txt$' || true)
                # 코드가 부딪혀도 루프를 죽이지 않는다 — 되돌리고 다음 바퀴에서 다시.
                # 예전에는 여기서 exit 1 이었고, 빌드 산출물 version.txt 가 이 목록에
                # 빠져 있어 사람이 커밋할 때마다 다섯 시간짜리 루프가 죽었다(10/28).
                [ -n "$others" ] && { echo "코드 충돌 — 다음 바퀴에서 다시:"; echo "$others"; git merge --abort 2>/dev/null; return 0; }
                # shellcheck disable=SC2086
                git checkout --ours -- $stuck && git add $stuck
                git diff --name-only --diff-filter=U | grep -q . && return 1
                git commit --no-edit
              fi
              python build.py > /dev/null
              git add index.html version.txt
              git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"
              git push origin HEAD:main && return 0
              sleep $((2**i))
            done
            echo "푸시 실패 — 다음 바퀴에서 다시"
            return 0
          }

          # **코드를 매 바퀴 따라잡는다.** 예전에는 머지가 push_changes 안에만
          # 있었는데 그 함수는 바뀐 게 없으면 곧장 돌아간다 — 그래서 **발표가 없는
          # 날에는 새 코드를 영영 안 받았다.** 일본 공휴일(9/21 경로의 날)에
          # 월매출 가려내는 규칙을 고쳐 올렸더니, 다섯 시간짜리 이 실행이 옛
          # 코드로 계속 돌아 한 시간이 지나도록 그대로였다. 조용한 날일수록
          # 고친 것이 안 먹는 셈이라 정확히 거꾸로다.
          sync_code() {
            # **작업트리가 지저분하다고 건너뛰면 안 된다.** 처음에 그렇게 했더니
            # 시간을 넘겨 죽은 단계의 파이썬이 고아로 남아 data/ 를 계속 쓰는
            # 바람에 트리가 영영 깨끗해지지 않았고, 루프가 살아서 커밋은 하면서도
            # **새 코드를 한 시간 넘게 안 받았다**. 그래서 먼저 담고 머지한다.
            # 남는 커밋은 push_changes 가 밀어낸다(바뀐 게 없어도 앞서 있으면 민다).
            git add data/ index.html version.txt 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "받은 것 먼저 담기 [skip ci]"
            git fetch -q origin main || return 0
            git merge-base --is-ancestor origin/main HEAD && return 0
            if git merge --no-edit origin/main; then return 0; fi
            stuck=$(git diff --name-only --diff-filter=U)
            others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' -e '^version\.txt$' || true)
            if [ -z "$stuck" ] || [ -n "$others" ]; then
              # 코드가 부딪혔거나 충돌이 아닌 실패다. 되돌리고 다음 바퀴에서 다시 —
              # 여기서 죽으면 속보가 통째로 멈춘다.
              git merge --abort 2>/dev/null || true
              echo "코드 따라잡기 보류: ${others:-merge 실패}"
              return 0
            fi
            # 만들어진 파일이다. 방금 받은 우리 것이 최신이다(push_changes 와 같은 규칙).
            # shellcheck disable=SC2086
            git checkout --ours -- $stuck && git add $stuck
            git commit --no-edit
          }

          # 5시간 좀 못 되게 돈다. 매 바퀴 3분을 맞추고, 바퀴가 길면 쉬지 않는다.
          END=$(( $(date +%s) + 300*60 - 15*60 ))
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1)); t0=$(date +%s)
            sync_code
            # 오늘·어제만 훑는다 — 매 바퀴 열흘치 목록을 두드리는 건 실례다.
            # 평소에는 이틀치라 몇 초다. 가려내는 규칙 판(MON_RULE_VER)을 올리면
            # 보관창 45일을 통째로 되훑으므로 그때만 길다 — 60초로는 중간에 잘려
            # 여러 바퀴에 나눠 끝났다. 날마다 써두므로 잘려도 잃지는 않지만,
            # 고친 규칙이 화면에 닿는 것은 한 바퀴로 끝나는 편이 낫다.
            timeout 150 python scrape_jp_tdnet.py || true
            # 미국 발표 속보 — 오늘·어제 발표 종목의 8-K 접수(실제 시각)와 실제 EPS.
            # 회원님: "실적 나온 지 3시간이 지났는데 왜 반영이 안 되냐"(EAT).
            # 예전에는 8-K 를 30분에 한 번, EPS 는 하루 한 번 봤다.
            timeout 110 python scrape_live_us.py || true
            # 방금 8-K 가 잡힌 종목의 보도자료(회사가 한 말)도 매 바퀴 조금씩.
            PR_PER_RUN=15 timeout 60 python scrape_pr_us.py || true
            JP_BACK_DAYS=2 timeout 150 python scrape_fin_jp.py || true
            # 실시간 서버(Railway)가 보도자료 부문 표를 AI 로 읽은 것 — 빌드가 부문 막대에 잇는다.
            if [ -s realtime/URL ]; then
              curl -sf -m 20 "$(cat realtime/URL)/api/segs" -o /tmp/segs_ai.json \
                && python -c "import json;json.load(open('/tmp/segs_ai.json'))" \
                && cp /tmp/segs_ai.json data/segments_ai.json || true
            fi
            # 월매출 **숫자**(첨부 PDF)는 monthly.yml 로 옮겼다 — 여기 끼우면
            # 한 바퀴가 길어지고, 무엇보다 이 루프의 로그에 묻혀 안 보인다.
            # 미국 8-K 와 일본 보관창 백필(부문·가이던스·설명 되훑기)은 열 바퀴
            # (30분)에 한 번 — 새 발표는 위의 오늘치가 이미 잡는다.
            # 45일 = TDnet 보관창 전체. 판(SEG_JP_VER 등)을 올리면 이 창 안의
            # 공시가 저절로 다시 뜯힌다 — 따라잡은 뒤에는 목록만 훑고 금방 끝난다.
            if [ $((n % 10)) -eq 1 ]; then
              JP_BACK_DAYS=45 timeout 240 python scrape_fin_jp.py || true
            fi
            push_changes || exit 1
            el=$(( $(date +%s) - t0 ))
            if [ "$el" -lt 180 ]; then sleep $(( 180 - el )); fi
            echo "── 바퀴 $n 끝 (${el}초) $(date -u +%H:%M:%S)"
          done
          echo "5시간 채움 — 대기 중인 다음 실행이 이어받는다"
