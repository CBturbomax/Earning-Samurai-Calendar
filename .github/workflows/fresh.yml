# 발표 속보 — 오늘 나온 실적을 10분 안에 싣는다.
#
# 왜 따로 뗐나: 일본 결산단신 수집이 30분짜리 numbers.yml 안에 있으면, 그 일감
# 자체가 29분이라 다음 실행이 줄을 서고 사실상 30~60분에 한 번 돌았다. 아식스가
# 15시에 발표해도 한 시간 뒤에나 실렸다. 코멘트는 속도가 생명이다 — 짧은 일감
# (9분 상한)으로 떼어내면 10분 크론이 자기 자신에게 막히지 않는다.
#
# GitHub 크론은 몇 분씩 지연되지만 짧은 일감은 대개 10~15분 간격으로 돈다.
#
# **여기가 이 파일들의 주인이다** (numbers.yml·collect.yml 에서 옮겨 왔다):
#   data/earnings_jp_past.json   발표 완료 행 (TDnet 목록)
#   data/financials_jp.json      일본 수치·가이던스 (TDnet zip)
#   data/segments_jp.json        일본 부문 (같은 zip)
#   data/briefs_jp.json          일본 '회사가 한 말' 원문 (같은 zip)
#   data/briefs_us.json          미국 8-K 보도자료 발췌
# 다른 워크플로는 이 파일들을 읽기만 한다. 두 워크플로가 같은 파일에 쓰면
# 한쪽 수집분이 머지에서 사라진다 — 이 저장소가 한 번 겪은 일이다.

name: 발표 속보 (10분)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh.yml'

permissions:
  contents: write

concurrency:
  group: fresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    # 10분 크론에 줄을 세우지 않도록 9분에 자른다. 세 수집기 모두 중간 저장을
    # 하므로 잘려도 받은 만큼은 남고 다음 실행이 이어받는다.
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 오늘 발표 행 — 예정을 실제 공시(시각 포함)로 바꾼다. 받아둔 날은
      # 캐시로 건너뛰므로 평소에는 오늘·어제 목록만 다시 본다.
      - name: 🇯🇵 발표 완료 행 (TDnet 목록)
        continue-on-error: true
        timeout-minutes: 2
        run: python scrape_jp_tdnet.py

      # 오늘 결산단신 zip — 수치·부문·가이던스·설명 원문을 한 번에 뽑는다.
      # 이미 본 공시는 접수번호로 건너뛰므로 새 발표만 받는다.
      - name: 🇯🇵 일본 결산단신 (TDnet 공시)
        continue-on-error: true
        timeout-minutes: 3
        run: python scrape_fin_jp.py

      # 미국 8-K 보도자료 — 방금 발표한 회사부터. 접수번호 캐시로 새것만 받는다.
      - name: 🗣 미국 실적 보도자료 발췌 (8-K EX-99)
        continue-on-error: true
        timeout-minutes: 1
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
          PR_PER_RUN: '60'
        run: python scrape_pr_us.py

      - name: 페이지 다시 만들기
        run: python build.py > /dev/null

      # 되커밋 — 다른 워크플로와 같은 안전 절차다.
      - name: 저장소에 반영
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "발표 속보 $(date -u +%H:%M) [skip ci]"

          for i in 1 2 3 4 5; do
            git merge --abort 2>/dev/null || true
            # 늦게 도착한 쓰기를 거둬 간다 — 시간 초과로 죽은 단계의 고아
            # 프로세스가 커밋 뒤에도 data/ 를 쓰는 일이 있다.
            git add data/ index.html 2>/dev/null || true
            git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
            git fetch origin main || { sleep $((2**i)); continue; }

            if ! git merge --no-edit origin/main; then
              stuck=$(git diff --name-only --diff-filter=U)
              if [ -z "$stuck" ]; then
                echo "merge 실패(충돌 아님), 재시도"; sleep $((2**i)); continue
              fi
              others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' || true)
              if [ -n "$others" ]; then
                echo "코드가 부딪혔다. 손으로 봐야 한다:"; echo "$others"; exit 1
              fi
              # shellcheck disable=SC2086
              git checkout --ours -- $stuck
              git add $stuck
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "충돌을 못 풀었다:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git commit --no-edit
            fi

            python build.py > /dev/null
            git add index.html
            git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"

            git push origin HEAD:main && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
