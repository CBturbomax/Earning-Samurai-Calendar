# 상세창 연간 표(직전년도 · 당해 · 차기 · 차차기 매출·영업이익·순이익 + PER·PBR·PSR).
#
# 1만여 종목(소형주까지) × 종목당 3~6 요청(stockanalysis 둘 · Business Insider 한두 개 ·
# 나스닥 하나)이라 numbers.yml 의 한 단계(5분)로는 하루에 몇백 종목밖에 못 받았다.
# 그래서 제 워크플로로 떼어 25분씩 나란히(WORKERS) 받고, 끝나면 다음 실행을 건다.
# 쓰는 파일은 data/forecast.json 하나뿐 — 페이지는 다른 루프가 머지할 때 다시 만든다.

name: 연간 컨센서스

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: fcst-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fcst:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 32
    steps:
      - name: 시작 시각
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 연간 컨센서스 (stockanalysis + Business Insider + 나스닥)
        continue-on-error: true
        timeout-minutes: 27
        env:
          FCST_SECS: '1440'
          FCST_PER_RUN: '99999'
          FCST_WORKERS: '6'
        run: python scrape_fcst.py

      - name: 저장소에 반영
        shell: bash
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          if git diff --cached --quiet; then echo "달라진 게 없다."; exit 0; fi
          git commit -m "연간 컨센서스 $(date -u +%F' '%H:%M) [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $((2**i)); continue; }
            # forecast.json 은 이 워크플로만 쓴다 — 부딪히면 우리 것.
            if ! git merge --no-edit -X ours origin/main; then
              git merge --abort 2>/dev/null; sleep $((2**i)); continue
            fi
            git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1

      - name: 다음 실행 예약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 300 - ($(date +%s) - ${T0:-0}) ))
          [ "$left" -gt 0 ] && sleep "$left"
          gh workflow run fcst.yml --ref main -R "$GITHUB_REPOSITORY" || echo "예약 실패 — 크론에 맡긴다"
