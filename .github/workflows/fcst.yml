# 상세창 연간 표(직전년도 · 당해 · 차기 · 차차기 매출·영업이익·순이익 + PER·PBR·PSR).
#
# 1만여 종목(소형주까지) × 종목당 3~6 요청(stockanalysis 둘 · Business Insider 한두 개 ·
# 나스닥 하나)이라 numbers.yml 의 한 단계(5분)로는 하루에 몇백 종목밖에 못 받았다.
# 그래서 제 워크플로로 떼어 25분씩 나란히(WORKERS) 받고, 끝나면 다음 실행을 건다.
# 쓰는 파일은 data/forecast.json 하나뿐 — 페이지는 다른 루프가 머지할 때 다시 만든다.

name: 연간 컨센서스

on:
  workflow_dispatch:
    inputs:
      secs:
        description: '수집 시간(초) — 시험할 때 짧게'
        default: '1260'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: fcst-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fcst:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 32
    steps:
      - name: 시작 시각
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 연간 컨센서스 (stockanalysis + Business Insider + 나스닥)
        continue-on-error: true
        timeout-minutes: 24
        env:
          FCST_SECS: ${{ inputs.secs || '1260' }}
          FCST_PER_RUN: '99999'
          FCST_WORKERS: '6'
        run: python scrape_fcst.py

      # 받은 파일을 옆에 빼 두고, 최신 main 위에 그 파일 하나만 얹어 민다 —
      # merge 를 안 하므로 부딪힐 일이 없다(이 파일의 주인은 이 워크플로뿐이다).
      # 첫 실행에서 merge 단계가 8분 멈춰 32분 제한에 걸려 24분치 수집을 통째로
      # 잃었다. 원인은 25분 사이 main 에 쌓인 커밋(매번 수 MB 의 index.html)을
      # 통째로 받느라 fetch 가 몇 분씩 걸린 것 — 끝만 받는다(--depth=1).
      - name: 저장소에 반영
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la data/forecast.json
          cp data/forecast.json "$RUNNER_TEMP/forecast.json"
          note() { echo "::warning::$*"; }
          for i in 1 2 3 4 5 6; do
            t=$(date +%s)
            out=$(timeout 150 git fetch --depth=1 origin main 2>&1); rc=$?
            note "fetch#$i rc=$rc $(( $(date +%s)-t ))s ${out: -200}"
            [ $rc -eq 0 ] || { sleep 3; continue; }
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/forecast.json" data/forecast.json
            git add data/forecast.json
            if git diff --cached --quiet; then note "달라진 게 없다"; exit 0; fi
            git commit -qm "연간 컨센서스 $(date -u +%F' '%H:%M) [skip ci]"
            t=$(date +%s)
            out=$(timeout 120 git push origin HEAD:main 2>&1); rc=$?
            note "push#$i rc=$rc $(( $(date +%s)-t ))s ${out: -300}"
            [ $rc -eq 0 ] && exit 0
            sleep 3
          done
          exit 1

      - name: 다음 실행 예약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 300 - ($(date +%s) - ${T0:-0}) ))
          [ "$left" -gt 0 ] && sleep "$left"
          gh workflow run fcst.yml --ref main -R "$GITHUB_REPOSITORY" || echo "예약 실패 — 크론에 맡긴다"
