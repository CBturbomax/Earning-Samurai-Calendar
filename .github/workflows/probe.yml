# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      EDINETDB_KEY: ${{ secrets.EDINETDB_KEY }}
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 33차 — HSBC 만 남았다. 태그 이름(RevenueAndOperatingIncome)도 넣고
      # 이름공간도 안 따지게 했는데 여전히 0건이다. 인스턴스에서 그 항목이
      # 걸린 문맥을 하나씩 뜯어 (축 이름 / 기간 / parse_seg 판정 / qtrs_of)를
      # 나란히 찍는다. 어느 관문에서 죽는지 눈으로 본다.
      - name: 🏦 HSBC 부문 매출 관문별 추적 (33차)
        timeout-minutes: 10
        run: |
          python - <<'EOF'
          import io, re
          from collections import Counter
          import xml.etree.ElementTree as ET
          import scrape_seg_sec as ss
          from scrape_seg_edgar import get, instance_url, local, strip_member, qtrs_of, parse_instance
          from scrape_seg_fpi import xbrl_filings
          cikmap = ss.cik_map()
          cik = ss.cik_of(cikmap, "HSBC")
          print("HSBC CIK", cik)
          for acc, filed, form in xbrl_filings(cik)[:2]:
              url = instance_url(cik, acc)
              print(f"\n== {filed} {form} -> {(url or '없음').split('/')[-1]}")
              if not url:
                  continue
              blob = get(url, timeout=150)
              if not blob:
                  print("   못 받음"); continue
              # 문맥 전부 읽기(자식을 먼저 비우지 않는다)
              ctx = {}
              for ev, el in ET.iterparse(io.BytesIO(blob), events=("end",)):
                  if local(el.tag) == "context":
                      cid, dims, st, en = el.get("id"), [], "", ""
                      for m in el.iter():
                          lm = local(m.tag)
                          if lm == "explicitMember":
                              a = ss.norm_axis(m.get("dimension") or "")
                              v = strip_member((m.text or "").strip())
                              if a and v:
                                  dims.append(f"{a}={v}")
                          elif lm == "startDate":
                              st = (m.text or "").strip()
                          elif lm == "endDate":
                              en = (m.text or "").strip()
                      if cid:
                          ctx[cid] = (dims, st, en)
                      el.clear()
                  elif el.get("contextRef"):
                      el.clear()
              shown = 0
              seen_axes = Counter()
              for ev, el in ET.iterparse(io.BytesIO(blob), events=("end",)):
                  cr = el.get("contextRef")
                  nm = local(el.tag)
                  if cr and nm in ss.REV_RANK and cr in ctx:
                      dims, st, en = ctx[cr]
                      q = qtrs_of(st, en) if (st and en) else None
                      got = ss.parse_seg(";".join(dims) + ";") if dims else None
                      for d in dims:
                          seen_axes[d.split("=")[0]] += 1
                      if shown < 14:
                          print(f"   {nm[:34]:36s} {st}~{en} qtrs={q} parse_seg={got} "
                                f"값={(el.text or '').strip()[:14]}")
                          shown += 1
                  el.clear()
              print("   매출 항목이 걸린 축 빈도:", dict(seen_axes.most_common(8)))
              rows = parse_instance(blob)
              print(f"   parse_instance -> {len(rows)}행", rows[:3])
          EOF
