# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 53차 — 회원님이 "마이크론이고 뭐고 실적발표 아닌데" 라고 짚으셨다.
      # scrape_us.py 는 **한 번 받은 날을 다시 안 받는다**(캐시). 나스닥이 처음
      # 주는 날짜는 회사가 확정하지 않은 **추정일**이라, 뒤에 바뀌어도 우리
      # 화면은 처음 값으로 굳는다. 짐작하지 말고 지금 나스닥에 대고 대조한다.
      - name: 🇺🇸 이번 주 미국 일정이 지금도 맞나 (53차)
        timeout-minutes: 10
        run: |
          python - <<'EOF'
          import json, time, urllib.request, gzip
          from datetime import date, timedelta

          BASE = "https://api.nasdaq.com/api/calendar/earnings?date="
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")

          def get(day):
              req = urllib.request.Request(BASE + day, headers={
                  "User-Agent": UA, "Accept": "application/json",
                  "Accept-Language": "en-US,en;q=0.9"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          ours = json.load(open("data/earnings_us.json", encoding="utf-8"))["rows"]
          by = {}
          for r in ours:
              by.setdefault(r["date"], {})[r["code"]] = r

          d0 = date.today()
          days = [(d0 + timedelta(days=i)).isoformat() for i in range(-1, 12)]
          allnew, allold = {}, {}
          for day in days:
              try:
                  j = get(day)
              except Exception as e:
                  print(f"{day} 받기 실패 {str(e)[:40]}"); continue
              st = (j.get("status") or {})
              rows = ((j.get("data") or {}).get("rows")) or []
              now = {r["symbol"]: r for r in rows}
              old = by.get(day, {})
              allnew[day] = set(now); allold[day] = set(old)
              add = sorted(set(now) - set(old))
              gone = sorted(set(old) - set(now))
              print(f"{day} 나스닥 {len(now):>3}건 · 우리 {len(old):>3}건 "
                    f"· 나스닥에만 {len(add)} · 우리에만 {len(gone)}"
                    f" (rCode={st.get('rCode')})")
              if add:
                  print(f"    나스닥에만: {' '.join(add[:14])}")
              if gone:
                  print(f"    우리에만  : {' '.join(gone[:14])}")
              time.sleep(0.6)

          print()
          print("── 마이크론(MU)이 나스닥에서 어느 날에 있나 ──")
          for day in days:
              if "MU" in allnew.get(day, ()):
                  print(f"   나스닥: {day}")
          for day in days:
              if "MU" in allold.get(day, ()):
                  print(f"   우리  : {day}")
          EOF
