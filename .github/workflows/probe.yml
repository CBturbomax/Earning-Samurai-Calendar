# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 14차 — 13차에서 EDINET 열람 화면(week0010.aspx)이 열쇠 없이 200,
      # 내려받기 창고(disclosure2dl)가 401 이 아니라 '그 blob 없음' 404 였다.
      # 화면 HTML 을 뜯어 실존 문서번호·내려받기 링크 꼴을 알아낸다.
      - name: 🇯🇵 EDINET 열람 화면 해부 (14차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0",
                "Accept": "*/*", "Accept-Language": "ja,en;q=0.8"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8", "replace")
          t = get("https://disclosure2.edinet-fsa.go.jp/week0010.aspx")
          print("길이", len(t))
          # 폼과 입력들
          for m in re.finditer(r'<form[^>]*>', t)[:3] if False else []:
              pass
          forms = re.findall(r'<form[^>]{0,200}', t)[:3]
          print("form:", forms)
          names = sorted(set(re.findall(r'<(?:input|select)[^>]*name="([^"]+)"', t)))[:30]
          print("입력:", names)
          # 링크·문서번호·내려받기 흔적
          links = sorted(set(re.findall(r'(?:href|action)="([^"]{5,120})"', t)))
          print("링크", len(links), "개 중 aspx/dl:")
          for l in links:
              if "aspx" in l.lower() or "dl" in l.lower():
                  print("  ", l[:110])
          docids = sorted(set(re.findall(r'S100[0-9A-Z]{4}', t)))[:10]
          print("문서번호:", docids)
          js = sorted(set(re.findall(r'"(WZEK[^"]{0,80})"', t)))[:6]
          print("WZEK:", js)
          # 자바스크립트 열기 함수의 인자 꼴
          opens = re.findall(r'WindowOpen[^;]{0,140}', t)[:4]
          print("WindowOpen:", opens)
          EOF

      # 10차 — 미국 실적 보도자료(8-K EX-99). 브리핑 칸의 '회사가 한 말' 원문이
      # EDGAR 에서 뽑히는지, 인용문·가이던스 문단이 실제로 걸리는지 본다.
      - name: 🇺🇸 8-K 보도자료 발췌 확인 (10차)
        timeout-minutes: 6
        run: python scrape_pr_us.py --probe NVDA AAPL WMT DE

      # 9차 — 8차에서 JPX 가 CI 에 열려 있고 셋 다 xlsx(zip)인 것을 확인했다.
      # 이번에는 실제 파서(scrape_jp_sched.py --probe)를 돌려 열 매핑·날짜 범위·
      # 어휘(kind/fy/업종)가 닛케이 것과 맞는지 본다.
      - name: 🇯🇵 JPX 예정일 파서 확인 (9차)
        timeout-minutes: 6
        run: python scrape_jp_sched.py --probe

      # 8차 — 일본 앞으로의 일정. 닛케이가 CI IP 를 막아 8/17 이후가 구멍이다.
      # JPX(일본거래소)가 決算発表予定日 엑셀을 공식으로 낸다 — CI 에서 닿는지,
      # 파일이 xlsx(zip, 표준 라이브러리로 읽힘)인지 xls(옛 바이너리)인지 본다.
      - name: 🇯🇵 JPX 결산발표 예정일 엑셀 (8차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "ja,en;q=0.8"}

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          BASE = "https://www.jpx.co.jp"
          page_url = BASE + "/listing/event-schedules/financial-announcement/index.html"
          try:
              body = get(page_url).decode("utf-8", "replace")
          except Exception as e:
              print("페이지 실패:", e); raise SystemExit
          print(f"페이지 {len(body):,}B")
          links = re.findall(r'href="([^"]+\.(?:xlsx?|csv|pdf))"', body)
          print("파일 링크:")
          for l in links[:20]:
              print("  ", l)
          # 엑셀부터 집어 내려받아 머리를 본다
          xls = [l for l in links if re.search(r"\.xlsx?$", l)]
          for l in xls[:3]:
              url = l if l.startswith("http") else BASE + l
              try:
                  data = get(url)
              except Exception as e:
                  print(f"\n{url} 실패: {e}"); continue
              magic = data[:4]
              kind = ("xlsx(zip)" if magic[:2] == b"PK"
                      else "xls(옛 바이너리)" if magic == b"\xd0\xcf\x11\xe0"
                      else repr(magic))
              print(f"\n{url}\n  {len(data):,}B · {kind}")
              if magic[:2] == b"PK":
                  import io, zipfile
                  z = zipfile.ZipFile(io.BytesIO(data))
                  names = z.namelist()
                  print("  zip 안:", names[:8])
                  # 첫 시트 원문 앞부분 — 열 구성 확인
                  sheet = [n for n in names if n.startswith("xl/worksheets/")]
                  if sheet:
                      xml = z.read(sheet[0]).decode("utf-8", "replace")
                      print("  시트 XML 머리 1200자:")
                      print("  " + xml[:1200].replace("\n", " "))
                  shared = [n for n in names if n.endswith("sharedStrings.xml")]
                  if shared:
                      s = z.read(shared[0]).decode("utf-8", "replace")
                      texts = re.findall(r"<t[^>]*>([^<]{1,40})</t>", s)
                      print("  공유 문자열 앞 40개:", texts[:40])
          EOF
