# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 19차 — 우회로. EDINET 키가 며칠째 막혀(로그인 뒤 키 화면이 「現在使用できない」)
      # 다른 길을 찾는다. irbank.net 이 EDINET 공시를 이미 파싱해 **지역·사업
      # 부문별 매출 추이**를 서버렌더 HTML 표로 낸다(무료·키 없음·전 종목). 예전
      # 실적수치 probe 에서 IR뱅크가 403 이었는데 그건 다른 경로였을 수 있다 —
      # 이 정확한 세그먼트 URL 을 제대로 된 브라우저 헤더로 두드려 (1) 열리는지
      # (2) 표에 몇 개년치가 있는지 (3) 분기/반기/연간 어느 단위인지 (4) 파서가
      # 뽑을 수 있는 꼴인지 본다. E 코드는 EDINET 코드(아식스 E02378).
      - name: 🇯🇵 irbank 세그먼트 매출 (19차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import re, time, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) "
                              "Chrome/124.0.0.0 Safari/537.36",
                "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                "Accept-Language": "ja,en-US;q=0.8,en;q=0.5",
                "Referer": "https://irbank.net/"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace"), r.geturl()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:200], url
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}", url

          def strip(t):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t)).strip()

          # E 코드 몇 종목 — 아식스·도요타·소니로 일반성 확인
          for ecode, name in (("E02378", "아식스"), ("E02144", "도요타"),
                              ("E01777", "소니")):
              for path in (f"/{ecode}/segment", f"/{ecode}/segment2"):
                  url = "https://irbank.net" + path
                  st, body, final = get(url)
                  size = len(body) if isinstance(body, str) else 0
                  print(f"\n== {name} {url}  status={st}  {size:,}자  최종 …{final[-40:]}")
                  if st != 200 or size < 500:
                      print("   본문:", body[:180] if isinstance(body, str) else body)
                      continue
                  # 표(table)들을 뜯어 머리행(기간)과 왼쪽 라벨(부문)을 본다
                  tables = re.findall(r"<table[^>]*>.*?</table>", body, re.S | re.I)
                  print(f"   표 {len(tables)}개")
                  for ti, tb in enumerate(tables[:3]):
                      rows = re.findall(r"<tr[^>]*>(.*?)</tr>", tb, re.S | re.I)
                      if len(rows) < 2:
                          continue
                      print(f"   [표{ti}] 행 {len(rows)}")
                      for ri, rw in enumerate(rows[:9]):
                          cells = re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", rw, re.S | re.I)
                          vals = [strip(c)[:14] for c in cells]
                          print(f"      r{ri}: {vals[:12]}")
                  # 기간 표기(연도·분기)가 몇 개 있는지 — 이력 길이 가늠
                  yrs = sorted(set(re.findall(r"(20[12]\d)[/年.]", body)))
                  qs = re.findall(r"(第[1-4１-４]四半期|中間|通期|Q[1-4])", body)
                  print(f"   연도 표기: {yrs}  · 분기/반기 어휘 {len(qs)}개")
                  break     # segment 가 열리면 segment2 는 생략
              time.sleep(1.0)

          # JSON·CSV 뒷문이 있는지도 떠본다 — 있으면 파싱이 훨씬 싸다
          for suf in ("/E02378/segment.json", "/api/segment/E02378",
                      "/E02378/segment.csv"):
              st, body, _ = get("https://irbank.net" + suf)
              print(f"\n-- 뒷문 {suf}  status={st}  "
                    f"{len(body) if isinstance(body,str) else 0}자  "
                    f"{(body[:80] if isinstance(body,str) else body)}")
          EOF

      # 17차 열쇠 — EDINET_API_KEY 시크릿이 올라오면 그때부터 도는 단.
      # (키가 없으면 통째로 건너뛴다.) 우회로가 잡히면 이 길은 안 써도 된다.
      - name: 🇯🇵 EDINET v2 자물쇠 (키 있을 때만)
        if: env.EDINET_API_KEY != ''
        timeout-minutes: 8
        run: |
          python - <<'EOF'
          import io, json, os, re, urllib.request, zipfile
          KEY = os.environ["EDINET_API_KEY"]
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()
          picked = None
          for day in ("2026-03-27", "2023-08-10", "2021-08-06"):
              try:
                  j = json.loads(get("https://api.edinet-fsa.go.jp/api/v2/documents.json"
                                     f"?date={day}&type=2&Subscription-Key={KEY}"))
              except Exception as e:
                  print(day, "실패:", getattr(e, "code", type(e).__name__))
                  continue
              docs = j.get("results") or []
              rep = [d for d in docs if d.get("docTypeCode") in ("120", "140", "160")
                     and d.get("xbrlFlag") == "1"]
              print(day, "전체", len(docs), "· 보고서(120/140/160)", len(rep))
              if rep and not picked:
                  picked = rep[0]
          if not picked:
              print("보고서를 한 건도 못 받았다 — 키나 API 상태를 본다")
              raise SystemExit
          z = get("https://api.edinet-fsa.go.jp/api/v2/documents/"
                  f"{picked['docID']}?type=1&Subscription-Key={KEY}")
          print("zip", f"{len(z):,}B", picked["docID"], (picked.get("filerName") or "")[:18])
          zf = zipfile.ZipFile(io.BytesIO(z))
          for n in zf.namelist():
              if "PublicDoc" in n and n.endswith((".xbrl", ".htm")):
                  x = zf.read(n).decode("utf-8", "replace")
                  mem = sorted(set(re.findall(r"([A-Za-z0-9]{2,40}SegmentMember)", x)))
                  if mem:
                      print(n.split("/")[-1][:44], "부문 멤버:", mem[:14])
                      break
          EOF
