# 실적 '수치' 소스를 확인한다. 지금까지는 일정만 다뤘다.
#
# 알아볼 것:
#   1) 발표 완료 여부 — 예정만 있으면 지났는지 알 수 없다
#   2) 매출·영업이익 시계열 — 1Q19 부터 분기별로 쭉
#   3) 부문별 매출(가레나/쇼피/머니 같은) 이 구조화돼 오는가
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SEC EDGAR — 미국 공식 재무제표 (XBRL)
        continue-on-error: true
        run: |
          UA='EarningSamurai/1.0 (cbpark@wisdomasset.co.kr)'
          echo '--- 회사 목록(티커→CIK) ---'
          curl -sS --max-time 30 -H "User-Agent: $UA" -o t.json \
            'https://www.sec.gov/files/company_tickers.json' -w 'HTTP %{http_code} / %{size_download}바이트\n'
          head -c 200 t.json; echo
          echo '--- SEA(CIK 1703399) 분기 매출 시계열 ---'
          curl -sS --max-time 30 -H "User-Agent: $UA" -o c.json \
            'https://data.sec.gov/api/xbrl/companyconcept/CIK0001703399/us-gaap/Revenues.json' \
            -w 'HTTP %{http_code} / %{size_download}바이트\n'
          python3 - <<'PY'
          import json
          try: d=json.load(open('c.json'))
          except Exception as e: print('읽기 실패', e); raise SystemExit
          u=d.get('units',{}).get('USD',[])
          q=[x for x in u if x.get('fp','').startswith('Q') or x.get('form')=='10-Q']
          print(f"항목 {len(u)}건 / 분기 {len(q)}건")
          for x in u[-6:]:
              print(f"  {x.get('fy')} {x.get('fp')} {x.get('start')}~{x.get('end')} {x.get('val'):>15,} {x.get('form')}")
          PY
          echo '--- 애플 전체 팩트(어떤 항목이 오는지) ---'
          curl -sS --max-time 40 -H "User-Agent: $UA" -o a.json \
            'https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json' \
            -w 'HTTP %{http_code} / %{size_download}바이트\n'
          python3 -c "
          import json; d=json.load(open('a.json'))
          g=d.get('facts',{}).get('us-gaap',{})
          want=['Revenues','RevenueFromContractWithCustomerExcludingAssessedTax','OperatingIncomeLoss','GrossProfit','NetIncomeLoss','EarningsPerShareDiluted']
          print('  주요 항목 존재:', {w: (w in g) for w in want})
          print('  전체 항목 수:', len(g))"

      - name: 나스닥 — 발표 완료·서프라이즈
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          for u in \
            'https://api.nasdaq.com/api/company/SE/earnings-surprise' \
            'https://api.nasdaq.com/api/quote/SE/eps' \
            'https://api.nasdaq.com/api/company/SE/financials?frequency=2' ; do
            echo "--- $u"
            curl -sS --max-time 25 -H "User-Agent: $UA" -H 'Accept: application/json' \
              -o n.json "$u" -w 'HTTP %{http_code} / %{size_download}바이트\n' || true
            head -c 450 n.json; echo
          done
