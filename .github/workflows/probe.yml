# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 481건을 훑고 0건을 얻었다. 진짜 파서를 태워 어디서 떨어지는지 본다.
      - name: 🇯🇵 결산단신에서 부문이 뽑히나
        timeout-minutes: 8
        env:
          JP_BACK_DAYS: '8'
        run: python scrape_fin_jp.py --seg 9432 6758 7203 8035
