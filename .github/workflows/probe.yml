# 새 소스나 고친 수집기를 전체에 풀기 전에 몇 종목만 떠본다.
#
# 지금 볼 것: **결산 분기 복원**.
# 회사는 10-Q 를 세 번 내고 마지막 분기는 10-K 안에 연간 값으로만 싣는다. 기간
# 길이로만 거르면 회사마다 한 분기가 매년 통째로 빠진다 — 애플은 3Q, 코카콜라는
# 4Q 가 없었다. 누적값에서 빼서 되살리도록 고쳤으니 정말 메워지는지 본다.
#
# 코스트코는 4분기가 16주라 라벨이 겹쳤고, 오라클은 스물넷 중 여덟만 남았으며,
# 존슨컨트롤스는 매출 태그 자체가 틀렸다. 그 넷을 같이 본다.
name: 소스 접근 확인
on:
  workflow_dispatch:
    inputs:
      syms:
        description: '떠볼 종목 (빈칸이면 AAPL MSFT KO COST ORCL JCI)'
        required: false
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 오늘 발표한 일본 회사가 소스에 실렸는지 본다. 안 실렸으면 우리가
      # 아무리 자주 두드려도 안 나온다 — 그건 주기 문제가 아니다.
      - name: 📉 오늘 발표분이 소스에 실렸는가 (stockanalysis)
        continue-on-error: true
        run: python scrape_fin_intl.py --probe ${{ inputs.syms }}
