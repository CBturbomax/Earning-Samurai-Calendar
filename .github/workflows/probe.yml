# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 15차 — 제품별 축과 이력, 두 갈래.
      # (a) 아식스 결산단신 주석 장(scnp)에 수익분해(품목별) XBRL 태그가 있나 —
      #     있으면 제품축을 TDnet 에서 매 시즌 자동 수집할 수 있다.
      # (b) EDINET blob 창고의 정적 파일(코드 목록)과 GXState POST 흉내 —
      #     문서번호를 열쇠 없이 얻는 길.
      - name: 🇯🇵 제품축 + EDINET 문서번호 (15차)
        timeout-minutes: 8
        run: |
          python - <<'EOF'
          import io, re, zipfile
          import scrape_fin_jp as fj
          rows = fj.announcements("2026-08-14")
          hit = [r for r in rows if r["code"] == "7936"]
          if hit:
              blob = fj.get("https://www.release.tdnet.info/inbs/" + hit[0]["zip"], binary=True)
              z = zipfile.ZipFile(io.BytesIO(blob))
              for n in z.namelist():
                  if "Attachment" not in n or not n.lower().endswith(".htm"):
                      continue
                  txt = z.read(n).decode("utf-8", "replace")
                  tags = set(re.findall(r'name="([\w:-]*(?:Disaggregat|Revenue|Goods|Product)[\w:-]*)"', txt, re.I))
                  ctxs = set(re.findall(r'contextRef="([^"]*(?:Product|Goods|Category|Running|Onitsuka|Sports)[^"]*)"', txt, re.I))
                  if tags or ctxs:
                      print("==", n.rsplit("/",1)[-1])
                      for t in sorted(tags)[:12]: print("  tag", t)
                      for c in sorted(ctxs)[:12]: print("  ctx", c)
              # 주석 장 원문에 '収益' 표가 있는지 (태그가 없으면 HTML 표)
              npf = [n for n in z.namelist() if "scnp" in n or "qcnp" in n]
              if npf:
                  t = re.sub(r"\s+"," ", fj.TAGS.sub(" ", z.read(npf[0]).decode("utf-8","replace")))
                  i = t.find("収益")
                  print("주석 장 '収益' 언저리:", t[max(0,i-40):i+400] if i>=0 else "없음")
          EOF

          python - <<'EOF'
          import re, urllib.request, urllib.parse, io, zipfile
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0",
                "Accept": "*/*", "Accept-Language": "ja,en;q=0.8"}
          def peek(url, data=None, head=0):
              req = urllib.request.Request(url, data=data, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read()
                      print(f"{r.status} {len(b):,}B  {url}")
                      return b
              except Exception as e:
                  print(f"ERR {e}  {url}")
                  return b""
          print("== (b1) blob 창고 정적 파일 ==")
          for u in ("https://disclosure2dl.edinet-fsa.go.jp/searchdocument/codelist/Edinetcode.zip",
                    "https://disclosure2dl.edinet-fsa.go.jp/searchdocument/codelist/Fundcode.zip"):
              b = peek(u)
              if b[:2] == b"PK":
                  z = zipfile.ZipFile(io.BytesIO(b))
                  print("   zip:", z.namelist()[:4])
                  csv = z.read(z.namelist()[0]).decode("cp932", "replace")
                  hitrows = [l for l in csv.splitlines() if "7936" in l][:3]
                  print("   7936 줄:", hitrows)
          print("== (b2) GXState POST 흉내 ==")
          base = "https://disclosure2.edinet-fsa.go.jp/week0010.aspx"
          t = peek(base).decode("utf-8", "replace")
          m = re.search(r'name="GXState"\s+value="([^"]*)"', t) or re.search(r"GXState[^=]*=\s*'([^']*)'", t)
          print("  GXState 있음:", bool(m), "길이", len(m.group(1)) if m else 0)
          if m:
              form = {
                  "MAINFORM": "MAINFORM",
                  "W0018vD_KEYWORD": "アシックス",
                  "W0018vD_KIKAN": "0",
                  "W0018vCHKSYORUI1": "1",
                  "W0018BTNBTN_SEARCH": "검색",
                  "GXState": m.group(1),
              }
              data = urllib.parse.urlencode(form).encode()
              b = peek(base, data=data)
              if b:
                  tt = b.decode("utf-8", "replace")
                  ids = sorted(set(re.findall(r"S100[0-9A-Z]{4}", tt)))[:8]
                  print("  POST 응답 문서번호:", ids)
                  links = sorted(set(re.findall(r'(WZEK[^"\']{0,60})', tt)))[:6]
                  print("  WZEK:", links)
          EOF

      # 10차 — 미국 실적 보도자료(8-K EX-99). 브리핑 칸의 '회사가 한 말' 원문이
      # EDGAR 에서 뽑히는지, 인용문·가이던스 문단이 실제로 걸리는지 본다.
      - name: 🇺🇸 8-K 보도자료 발췌 확인 (10차)
        timeout-minutes: 6
        run: python scrape_pr_us.py --probe NVDA AAPL WMT DE

      # 9차 — 8차에서 JPX 가 CI 에 열려 있고 셋 다 xlsx(zip)인 것을 확인했다.
      # 이번에는 실제 파서(scrape_jp_sched.py --probe)를 돌려 열 매핑·날짜 범위·
      # 어휘(kind/fy/업종)가 닛케이 것과 맞는지 본다.
      - name: 🇯🇵 JPX 예정일 파서 확인 (9차)
        timeout-minutes: 6
        run: python scrape_jp_sched.py --probe

      # 8차 — 일본 앞으로의 일정. 닛케이가 CI IP 를 막아 8/17 이후가 구멍이다.
      # JPX(일본거래소)가 決算発表予定日 엑셀을 공식으로 낸다 — CI 에서 닿는지,
      # 파일이 xlsx(zip, 표준 라이브러리로 읽힘)인지 xls(옛 바이너리)인지 본다.
      - name: 🇯🇵 JPX 결산발표 예정일 엑셀 (8차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "ja,en;q=0.8"}

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          BASE = "https://www.jpx.co.jp"
          page_url = BASE + "/listing/event-schedules/financial-announcement/index.html"
          try:
              body = get(page_url).decode("utf-8", "replace")
          except Exception as e:
              print("페이지 실패:", e); raise SystemExit
          print(f"페이지 {len(body):,}B")
          links = re.findall(r'href="([^"]+\.(?:xlsx?|csv|pdf))"', body)
          print("파일 링크:")
          for l in links[:20]:
              print("  ", l)
          # 엑셀부터 집어 내려받아 머리를 본다
          xls = [l for l in links if re.search(r"\.xlsx?$", l)]
          for l in xls[:3]:
              url = l if l.startswith("http") else BASE + l
              try:
                  data = get(url)
              except Exception as e:
                  print(f"\n{url} 실패: {e}"); continue
              magic = data[:4]
              kind = ("xlsx(zip)" if magic[:2] == b"PK"
                      else "xls(옛 바이너리)" if magic == b"\xd0\xcf\x11\xe0"
                      else repr(magic))
              print(f"\n{url}\n  {len(data):,}B · {kind}")
              if magic[:2] == b"PK":
                  import io, zipfile
                  z = zipfile.ZipFile(io.BytesIO(data))
                  names = z.namelist()
                  print("  zip 안:", names[:8])
                  # 첫 시트 원문 앞부분 — 열 구성 확인
                  sheet = [n for n in names if n.startswith("xl/worksheets/")]
                  if sheet:
                      xml = z.read(sheet[0]).decode("utf-8", "replace")
                      print("  시트 XML 머리 1200자:")
                      print("  " + xml[:1200].replace("\n", " "))
                  shared = [n for n in names if n.endswith("sharedStrings.xml")]
                  if shared:
                      s = z.read(shared[0]).decode("utf-8", "replace")
                      texts = re.findall(r"<t[^>]*>([^<]{1,40})</t>", s)
                      print("  공유 문자열 앞 40개:", texts[:40])
          EOF
