# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3차 — 번들에서 발굴한 RPT_HKF10_ORG_BUSSINESS(주영구성, 오타까지 저쪽 것)를
      # 실제로 두드려 스키마를 본다. 텐센트·팝마트·샤오미 셋.
      - name: 🇭🇰 홍콩 부문 매출 소스 떠보기 (3차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import json, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                "Accept": "*/*", "Referer": "https://emweb.eastmoney.com/"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")

          for code in ("00700", "09992", "01810"):
              url = ("https://datacenter.eastmoney.com/securities/api/data/v1/get"
                     "?reportName=RPT_HKF10_ORG_BUSSINESS&columns=ALL"
                     f"&filter=(SECURITY_CODE%3D%22{code}%22)"
                     "&pageSize=60&sortTypes=-1&sortColumns=REPORT_DATE")
              body = get(url)
              print(f"\n===== {code}  {len(body):,}B")
              try:
                  d = json.loads(body)
                  data = ((d.get("result") or {}).get("data")) or []
                  print("  행", len(data), "· count", (d.get("result") or {}).get("count"))
                  if data:
                      print("  열:", sorted(data[0].keys()))
                      for row in data[:8]:
                          print("   ", json.dumps(row, ensure_ascii=False)[:250])
              except ValueError:
                  print(body[:400])
          EOF
