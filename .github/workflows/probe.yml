# 새 소스를 붙이기 전에 응답을 눈으로 본다. **저장소에 아무것도 안 쓴다.**
#
# 지금 볼 것: **부문별 매출을 공식 자료로 받을 수 있는가.**
# stockanalysis 는 1,350종목을 두드려 223종목(17%)만 준다. 소스에 없는 것이다.
# SEC 의 companyfacts API 는 부문 축(dimension)을 떨어뜨리지만, 분기마다 내는
# Financial Statement Data Sets 의 num.txt 에는 그 축이 살아 있다고 알려져 있다.
# 사실이면 zip 하나로 미국 전 종목의 부문별 매출이 들어온다.
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧩 SEC 벌크에 부문 축이 있는가
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python - <<'EOF'
          import io, urllib.request, zipfile
          UA = "Earning Samurai Calendar (cbpark@wisdomasset.co.kr)"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      return r.status, r.read()
              except Exception as e:
                  return getattr(e, "code", 0), str(e).encode()

          hit = None
          for q in ("2026q2", "2026q1", "2025q4", "2025q3"):
              url = f"https://www.sec.gov/files/dera/data/financial-statement-data-sets/{q}.zip"
              st, body = get(url)
              print(f"{q}: {st} · {len(body):,} 바이트", flush=True)
              if st == 200 and len(body) > 1_000_000:
                  hit = (q, body)
                  break
              print("   ", body[:160])

          if not hit:
              print("\n벌크 자료를 못 받았다. 주소나 접근을 다시 봐야 한다.")
              raise SystemExit

          q, body = hit
          z = zipfile.ZipFile(io.BytesIO(body))
          print(f"\n=== {q} 안에 든 파일:", z.namelist())

          with z.open("num.txt") as f:
              cols = f.readline().decode("utf-8", "replace").rstrip("\r\n").split("\t")
              print("num.txt 열:", cols)
              if "segments" not in cols:
                  print("!! segments 칸이 없다. 다른 길을 찾아야 한다.")
                  raise SystemExit
              si, ti, vi, ai = (cols.index(c) for c in ("segments", "tag", "value", "adsh"))
              di = cols.index("ddate"); qi = cols.index("qtrs")
              shown = 0
              tags = {}
              for raw in f:
                  p = raw.decode("utf-8", "replace").rstrip("\r\n").split("\t")
                  if len(p) <= si or not p[si]:
                      continue
                  if "Revenue" not in p[ti] and "Sales" not in p[ti]:
                      continue
                  tags[p[ti]] = tags.get(p[ti], 0) + 1
                  if shown < 15:
                      print(f"  {p[ai]} q{p[qi]} {p[di]} {p[ti][:40]:42s}"
                            f" seg={p[si][:64]:66s} {p[vi][:16]}")
                      shown += 1
              print("\n부문 축이 달린 매출 태그 상위:")
              for t, n in sorted(tags.items(), key=lambda kv: -kv[1])[:12]:
                  print(f"  {n:7,}  {t}")
          EOF
