# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 12차 — 둘을 떠본다.
      # (a) 아식스 세그먼트 장에서 '일본' 지역 행이 왜 안 뽑히나 — 문맥 이름 전수
      # (b) EDINET(일본판 EDGAR)이 열쇠 없이 열리나 — 과거 분기·반기 보고서의
      #     세그먼트 XBRL 로 부문 이력(2022~)을 채울 수 있는지
      - name: 🇯🇵 아식스 일본행 + EDINET 문 (12차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import io, re, zipfile
          import scrape_fin_jp as fj

          rows = fj.announcements("2026-08-14")
          hit = [r for r in rows if r["code"] == "7936"]
          if hit:
              blob = fj.get("https://www.release.tdnet.info/inbs/" + hit[0]["zip"], binary=True)
              z = zipfile.ZipFile(io.BytesIO(blob))
              sg = [n for n in z.namelist() if "scsg" in n or "qcsg" in n]
              print("세그먼트 장:", sg)
              if sg:
                  txt = z.read(sg[0]).decode("utf-8", "replace")
                  # 문맥 정의 전수 — Japan 이 어디 있나
                  ids = set(re.findall(r'contextRef="([^"]+)"', txt))
                  segish = sorted({i for i in ids if re.search(r"Segment|Japan|Domestic", i, re.I)})
                  print("문맥", len(ids), "· 부문/일본 후보:")
                  for c in segish[:40]:
                      print("  ", c)
          EOF

          python - <<'EOF'
          import json, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0"}
          def peek(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      b = r.read()
                      print(f"{r.status} {len(b):,}B  {url}")
                      return b
              except Exception as e:
                  print(f"ERR {e}  {url}")
          # v1(구) / v2(열쇠 요구?) 문서 목록
          peek("https://api.edinet-fsa.go.jp/api/v1/documents.json?date=2023-08-10&type=2")
          b = peek("https://api.edinet-fsa.go.jp/api/v2/documents.json?date=2023-08-10&type=2")
          if b:
              d = json.loads(b.decode("utf-8", "replace"))
              res = d.get("results") or []
              print("  v2 결과", len(res), "· 메타:", json.dumps(d.get("metadata", {}), ensure_ascii=False)[:200])
              q = [r for r in res if (r.get("docTypeCode") in ("140", "160")) ][:3]
              for r in q:
                  print("  ", r.get("docID"), r.get("secCode"), r.get("filerName"), r.get("docDescription"))
              if q:
                  did = q[0]["docID"]
                  # 열쇠 없이 XBRL zip 이 내려오나 (type=1 제출본문서)
                  peek(f"https://api.edinet-fsa.go.jp/api/v2/documents/{did}?type=1")
          EOF
      # 10차 — 미국 실적 보도자료(8-K EX-99). 브리핑 칸의 '회사가 한 말' 원문이
      # EDGAR 에서 뽑히는지, 인용문·가이던스 문단이 실제로 걸리는지 본다.
      - name: 🇺🇸 8-K 보도자료 발췌 확인 (10차)
        timeout-minutes: 6
        run: python scrape_pr_us.py --probe NVDA AAPL WMT DE

      # 9차 — 8차에서 JPX 가 CI 에 열려 있고 셋 다 xlsx(zip)인 것을 확인했다.
      # 이번에는 실제 파서(scrape_jp_sched.py --probe)를 돌려 열 매핑·날짜 범위·
      # 어휘(kind/fy/업종)가 닛케이 것과 맞는지 본다.
      - name: 🇯🇵 JPX 예정일 파서 확인 (9차)
        timeout-minutes: 6
        run: python scrape_jp_sched.py --probe

      # 8차 — 일본 앞으로의 일정. 닛케이가 CI IP 를 막아 8/17 이후가 구멍이다.
      # JPX(일본거래소)가 決算発表予定日 엑셀을 공식으로 낸다 — CI 에서 닿는지,
      # 파일이 xlsx(zip, 표준 라이브러리로 읽힘)인지 xls(옛 바이너리)인지 본다.
      - name: 🇯🇵 JPX 결산발표 예정일 엑셀 (8차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "ja,en;q=0.8"}

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          BASE = "https://www.jpx.co.jp"
          page_url = BASE + "/listing/event-schedules/financial-announcement/index.html"
          try:
              body = get(page_url).decode("utf-8", "replace")
          except Exception as e:
              print("페이지 실패:", e); raise SystemExit
          print(f"페이지 {len(body):,}B")
          links = re.findall(r'href="([^"]+\.(?:xlsx?|csv|pdf))"', body)
          print("파일 링크:")
          for l in links[:20]:
              print("  ", l)
          # 엑셀부터 집어 내려받아 머리를 본다
          xls = [l for l in links if re.search(r"\.xlsx?$", l)]
          for l in xls[:3]:
              url = l if l.startswith("http") else BASE + l
              try:
                  data = get(url)
              except Exception as e:
                  print(f"\n{url} 실패: {e}"); continue
              magic = data[:4]
              kind = ("xlsx(zip)" if magic[:2] == b"PK"
                      else "xls(옛 바이너리)" if magic == b"\xd0\xcf\x11\xe0"
                      else repr(magic))
              print(f"\n{url}\n  {len(data):,}B · {kind}")
              if magic[:2] == b"PK":
                  import io, zipfile
                  z = zipfile.ZipFile(io.BytesIO(data))
                  names = z.namelist()
                  print("  zip 안:", names[:8])
                  # 첫 시트 원문 앞부분 — 열 구성 확인
                  sheet = [n for n in names if n.startswith("xl/worksheets/")]
                  if sheet:
                      xml = z.read(sheet[0]).decode("utf-8", "replace")
                      print("  시트 XML 머리 1200자:")
                      print("  " + xml[:1200].replace("\n", " "))
                  shared = [n for n in names if n.endswith("sharedStrings.xml")]
                  if shared:
                      s = z.read(shared[0]).decode("utf-8", "replace")
                      texts = re.findall(r"<t[^>]*>([^<]{1,40})</t>", s)
                      print("  공유 문자열 앞 40개:", texts[:40])
          EOF
