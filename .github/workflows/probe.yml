# 새 소스를 붙이기 전에 응답 생김새를 눈으로 본다.
#
# 여기서 확인되기 전에는 collect.yml 에 넣지 않는다. 모양을 짐작해서 짜 두면
# 조용히 0건이 되고, 그게 제일 나쁘다(캘린더가 "발표 없음"이라고 거짓말한다).
#
# 지금 보는 것: 일본·홍콩 실적 시계열 (야후 fundamentals-timeseries)
#   - 1Q19 까지 거슬러 오는가
#   - 홍콩이 반기(6M)로 오는가
#   - 통화가 뭐로 오는가
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🇯🇵🇭🇰 야후 재무 시계열
        continue-on-error: true
        run: python scrape_fin_intl.py --probe

      - name: 🇺🇸 SEC — 외국 기업(IFRS)·은행·태그 갈아탄 회사
        continue-on-error: true
        run: |
          python - <<'PY'
          import scrape_fin as sf
          # 앞 셋은 미국 기준(us-gaap), 뒤 여섯은 국제 기준(IFRS)으로 내는 회사들.
          # 전에는 us-gaap 만 물어서 도요타·소니·HSBC 가 통째로 비었다.
          # KO·XOM·V·AMT 는 분기가 두세 개밖에 안 나왔던 것들이다.
          budget = [50]     # companyfacts 호출 한도
          who = [("NVDA", 1045810), ("AAPL", 320193), ("SE", 1703399),
                 ("KO", 21344), ("XOM", 34088), ("V", 1403161), ("AMT", 1053507),
                 ("TM 도요타", 1094517), ("SONY 소니", 313838),
                 ("HSBC", 1089113), ("SHEL 셸", 1306965),
                 ("NVO 노보노디스크", 353278), ("UBS", 1610520)]
          for name, cik in who:
              try:
                  s = sf.series(cik, budget)
              except Exception as e:
                  print(f"{name}: 실패 {e}"); continue
              if not s:
                  print(f"{name}: 없음"); continue
              p = s["points"]
              print(f"{name}: {s['freq']} {s['cur']} {len(p)}개  "
                    f"{p[0]['label']} ~ {p[-1]['label']}  최근 {p[-1]['rev']:,.0f}")
          print(f"항목 이름을 직접 찾아본 종목 {50 - budget[0]}개")
          PY
