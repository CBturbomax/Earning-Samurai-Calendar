# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EDINETDB_KEY: ${{ secrets.EDINETDB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 27차 — 일본 대형주(도요타·소니·키엔스·도쿄일렉트론)의 부문이 통째로 빈다.
      # 공시는 이미 뜯었는데(수치는 나옴) read_segments 가 0을 돌려준다. 넷 다
      # 〔IFRS〕라 회계기준 차이가 의심된다 — 아식스(日本基準)는 잘 나온다.
      # zip 안을 열어 (1) 첨부 파일 이름 (2) ix 사실 수 (3) 부문 문맥·항목 이름을
      # 찍어 우리 파서가 어디서 놓치는지 본다. 짐작으로 고치지 않는다.
      - name: 🇯🇵 IFRS 대형주 부문 첨부 해부 (27차)
        timeout-minutes: 9
        run: |
          python - <<'EOF'
          import io, re, zipfile
          from datetime import date, timedelta
          import scrape_fin_jp as fj
          WANT = {"7203": "도요타", "6758": "소니", "6861": "키엔스", "8035": "도쿄일렉트론"}
          seen = {}
          for back in range(30):
              if len(seen) == len(WANT):
                  break
              day = (date.today() - timedelta(days=back)).isoformat()
              try:
                  rows = fj.announcements(day)
              except Exception as e:
                  continue
              for r in rows:
                  if r["code"] in WANT and r["code"] not in seen:
                      seen[r["code"]] = (day, r)
          print("찾은 공시:", {k: v[0] for k, v in seen.items()})
          for code, (day, r) in seen.items():
              print(f"\n===== {code} {WANT[code]} · {day} · {r['title'][:46]}")
              blob = fj.get("https://www.release.tdnet.info/inbs/" + r["zip"], binary=True)
              if not blob:
                  print("   zip 못 받음"); continue
              z = zipfile.ZipFile(io.BytesIO(blob))
              names = z.namelist()
              print("   파일:", [n.split('/')[-1][:44] for n in names][:10])
              got = fj.read_segments(blob)
              print(f"   read_segments -> {len(got)}기간")
              for n in names:
                  if not n.lower().endswith(("ixbrl.htm", ".xbrl")):
                      continue
                  txt = z.read(n).decode("utf-8", "replace")
                  facts = fj.IX_FACT.findall(txt)
                  segctx, items, members = set(), {}, set()
                  for attrs, _ in facts:
                      a = dict(fj.IX_ATTR.findall(attrs))
                      cid = a.get("contextRef") or ""
                      nm = (a.get("name") or "").rsplit(":", 1)[-1]
                      if re.search(r"Segment|Reportable|セグメント", cid, re.I):
                          segctx.add(cid)
                          items[nm] = items.get(nm, 0) + 1
                          m = fj.seg_member(cid)
                          if m:
                              members.add(fj.seg_name(m)[:22])
                  mark = " ★부문있음" if segctx else ""
                  print(f"   {n.split('/')[-1][:52]:54s} ix {len(facts):>4} · 부문문맥 {len(segctx):>3}{mark}")
                  if segctx:
                      for cid in sorted(segctx)[:4]:
                          print("        문맥:", cid[:96])
                      for nm, c in sorted(items.items(), key=lambda kv: -kv[1])[:8]:
                          star = "*" if nm in fj.SEG_REV_RANK else " "
                          print(f"        {star}항목 {nm[:52]:54s} {c}건")
                      print("        부문:", sorted(members)[:8])
                  elif "セグメント" in txt:
                      i = txt.find("セグメント")
                      print("        (글자만 있고 태그 없음)",
                            fj.TAGS.sub(" ", txt[i:i+120]).replace("\n", " ")[:110])
          EOF
