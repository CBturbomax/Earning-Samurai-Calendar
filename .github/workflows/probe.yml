# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 73차 — 「표없음」으로 버려지는 89건 안을 본다.
      # 읽은 210건 중 89건(42%)이 표를 못 찾고 버려진다. 무엇이 들어 있는지
      # 봐야 규칙을 어디로 넓힐지 안다. 여섯 건만 뜯어 칸을 그대로 찍는다.
      - name: 🔍 표없음 공시 속 (73차)
        timeout-minutes: 12
        run: |
          python - <<'EOF'
          import json, time, urllib.request
          import pdftext

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          n = json.load(open("data/monthly_nums_jp.json", encoding="utf-8"))
          mon = json.load(open("data/monthly_jp.json", encoding="utf-8"))
          who = {}
          for r in (mon.get("rows") or []):
              if isinstance(r, dict):
                  who[r.get("doc") or r.get("url") or ""] = (
                      r.get("code", ""), r.get("title", ""))
          bad = [u for u, why in n["skip"].items() if why == "표없음"]
          print(f"표없음 {len(bad)}건 중 여섯 건을 뜯는다")
          for u in bad[:6]:
              code, title = who.get(u, ("?", "?"))
              try:
                  raw = urllib.request.urlopen(
                      urllib.request.Request(u, headers=UA), timeout=30).read()
              except Exception as e:
                  print("!!", u, type(e).__name__, getattr(e, "code", ""))
                  continue
              time.sleep(0.8)
              print("\n" + "=" * 72)
              print(f"{code} · {title[:60]}")
              print(f"{u} · {len(raw)//1024}KB · 암호 {pdftext.is_encrypted(raw)}")
              try:
                  rows = pdftext.extract_cells(raw, max_pages=3)
              except Exception as e:
                  print("  글자 못 꺼냄:", type(e).__name__, str(e)[:70])
                  continue
              print(f"  줄 {len(rows)}")
              for cells in rows[:34]:
                  print("   | " + " | ".join(f"{x:.0f}:{v[:22]}" for x, v in cells[:9]))
          EOF
