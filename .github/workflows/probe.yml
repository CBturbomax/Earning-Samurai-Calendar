# 소스를 떠보는 자리. 결과만 probe-out 가지에 남기고 아무것도 커밋하지 않는다. **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 🔎 일본 결산단신 PDF 의 세그먼트 쪽(11/12)
        continue-on-error: true
        run: |
          for i in 1 2 3; do command -v pdftotext && break; sudo apt-get update -qq || true; sudo apt-get install -y -qq poppler-utils || sleep 20; done
          python tools/ai/probe_jppdf.py 2587:140120180509430976.pdf 2587:140120180806492117.pdf 6750:140120240926589498.pdf > /tmp/probe.txt 2>&1
      - name: 결과를 probe-out 가지에
        if: always()
        run: |
          cd /tmp && rm -rf po && mkdir po && cd po && git init -q
          cp /tmp/probe.txt . ; git add . && git -c user.name=bot -c user.email=b@b commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
