# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 43차 — 42차에서 해독기가 실제로 글자를 뱉었다(9007 에서 既存店·全店·
      # 前年比). 두 가지가 남았다.
      #   (A) 절반이 **0줄**이다. 쪽도 찾고 ToUnicode 폰트도 찾았는데 내용이
      #       비어 나온다 — /Contents 를 못 읽는 것으로 보인다. 쪽마다 머리를
      #       찍어 어떤 꼴인지 본다.
      #   (B) 줄이 뒤섞인다(7865 가 한 줄로 뭉쳤다). `cm`(좌표 변환)을 안 보고
      #       Tm 의 y 만 써서, 변환이 걸린 쪽에서 서로 다른 줄이 같은 y 로 온다.
      # 그리고 **월차Web(kabubiz)** — 상장 313사의 월매출을 모아 둔 곳이다.
      # 여기가 열리면 PDF 를 안 뜯고도 숫자를 받는다. 구조를 본다.
      - name: 🗾 월매출 — 내용 스트림 진단 + 월차Web 구조 (43차)
        timeout-minutes: 13
        run: |
          python - <<'EOF'
          import re, time, urllib.request, urllib.error, gzip
          import pdftext

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")

          def get(url, timeout=40):
              h = {"User-Agent": UA, "Accept": "*/*",
                   "Accept-Language": "ja,en;q=0.8", "Accept-Encoding": "gzip"}
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers=h), timeout=timeout) as r:
                      raw = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      return r.status, raw
              except urllib.error.HTTPError as e:
                  return e.code, b""
              except Exception as e:
                  return str(e)[:60], b""

          print("=" * 70)
          print("(A) 0줄로 나온 PDF 의 쪽 머리를 본다")
          print("=" * 70)
          for code, url in [
              ("3038", "https://www.release.tdnet.info/inbs/140120260917537924.pdf"),
              ("7370", "https://www.release.tdnet.info/inbs/140120260918538566.pdf"),
              ("5580", "https://www.release.tdnet.info/inbs/140120260916537473.pdf"),
              ("7685", "https://www.release.tdnet.info/inbs/140120260917537893.pdf"),
          ]:
              st, data = get(url)
              if st != 200:
                  print(f"{code}: {st}"); continue
              objs = pdftext._expand_objstm(pdftext._objects(data))
              pages = [(n, h) for n, (h, _) in objs.items()
                       if b"/Type" in h and b"/Page" in h and b"/Pages" not in h]
              print(f"{code}: 쪽 {len(pages)}")
              for n, h in pages[:2]:
                  print(f"   쪽 obj {n} 머리: {h[:260]!r}")
                  cm = pdftext.CONTENTS_RE.search(h)
                  print(f"   /Contents 맞았나: {bool(cm)} {cm.groups() if cm else ''}")
                  if cm:
                      refs = ([int(cm.group(1))] if cm.group(1)
                              else [int(x) for x in pdftext.REF_RE.findall(cm.group(2) or b"")])
                      for r in refs[:3]:
                          got = objs.get(r)
                          print(f"     내용 obj {r}: 있나={got is not None} "
                                f"머리={got[0][:120]!r} 길이={len(got[1]) if got and got[1] else 0}"
                                if got else f"     내용 obj {r}: 없다")
              print()

          print("=" * 70)
          print("(B) 월차Web — 상장 313사 월매출 모음")
          print("=" * 70)
          st, data = get("https://kabubiz.com/getuji/")
          print(f"  목록: {st} · {len(data)//1024}KB")
          if st == 200:
              t = data.decode("utf-8", "ignore")
              links = sorted(set(re.findall(r'href="(/getuji/[^"#?]*)"', t)))
              print(f"  /getuji/ 링크 {len(links)}종 — 앞 25개:")
              for l in links[:25]:
                  print(f"     {l}")
              for m in ("月次", "既存店", "前年", "売上"):
                  print(f"  '{m}' 나옴: {m in t}")
              j = t.find("既存店")
              if j > 0:
                  print("  본문 주변:", re.sub(r"\s+", " ", t[j - 200:j + 300]))
          for u in ("https://kabubiz.com/getuji/code/9843/",
                    "https://kabubiz.com/getuji/9843",
                    "https://kabubiz.com/getuji/company/9843/",
                    "https://kabubiz.com/getuji/ranking/"):
              st, d = get(u, timeout=20)
              print(f"  {u} -> {st} {len(d)//1024}KB")
              time.sleep(0.5)
          EOF
