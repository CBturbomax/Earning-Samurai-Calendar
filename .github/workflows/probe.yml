# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5차 — 주영구성(主营构成) 표의 report 이름 최종 수색. 지연 청크는 webpack
      # 해시 맵으로 조립되어 문자열 그렙에 안 걸린다. 맵을 재조립해 전 청크를 훑는다.
      - name: 🇭🇰 홍콩 부문 매출 소스 떠보기 (5차)
        timeout-minutes: 10
        run: |
          python - <<'EOF'
          import json, re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                "Accept": "*/*", "Referer": "https://emweb.eastmoney.com/"}

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", "replace")

          base = "https://emweb.eastmoney.com/PC_HKF10/pages/home/"
          home = get(base + "index.html?code=00700&type=web&color=w")
          names = set()
          chunk_urls = set()
          for u in re.findall(r'src="([^"]+\.js[^"]*)"', home):
              if u.startswith("//"): full = "https:" + u
              elif u.startswith("/"): full = "https://emweb.eastmoney.com" + u
              elif not u.startswith("http"): full = base + u
              else: full = u
              try:
                  js = get(full)
              except Exception:
                  continue
              names |= set(re.findall(r"RPT_[A-Z0-9_]{4,60}", js))
              # webpack 청크 맵: {13:"a1b2c3d4",...} + "static/js/" 접두
              for m in re.finditer(r'"static/js/"\s*\+\s*(?:\(\{[^}]*\}\[\w\]\|\|\w\)|\w+)\s*\+\s*"\."\s*\+\s*\{([^}]+)\}', js):
                  pairs = re.findall(r'(\d+):"([a-f0-9]{6,24})"', m.group(1))
                  root = full.rsplit("/static/js/", 1)[0] if "/static/js/" in full \
                         else "https://emweb.eastmoney.com/PC_HKF10"
                  for cid, h in pairs:
                      chunk_urls.add(f"{root}/static/js/{cid}.{h}.js")
              # 못 맞춘 꼴 대비 — 맵 덩어리를 그대로 찍어 사람이 본다
              for m in re.finditer(r'\{(?:\d+:"[a-f0-9]{6,24}",?){3,}\}', js):
                  print("맵 후보:", m.group(0)[:180])
          print("주 번들에서 이름", len(names), "· 청크 URL", len(chunk_urls))
          for u in sorted(chunk_urls)[:60]:
              try:
                  js = get(u)
              except Exception:
                  continue
              got = set(re.findall(r"RPT_[A-Z0-9_]{4,60}", js))
              fresh = got - names
              if fresh:
                  print(" ", u.rsplit("/",1)[-1], "->", sorted(fresh))
              names |= got
          print("\n전체 이름:")
          for n in sorted(names): print(" ", n)

          # 냄새 나는 것 즉시 시험 (SECUCODE 필터로)
          for rn in sorted(names):
              if not any(w in rn for w in ("MAINOP", "BUSINESS", "BUSSINESS_INCOME",
                                           "INDUSTRY_INCOME", "OPERATE_INCOME", "MAIN_OP")):
                  continue
              try:
                  body = get("https://datacenter.eastmoney.com/securities/api/data/v1/get"
                             f"?reportName={rn}&columns=ALL"
                             "&filter=(SECUCODE%3D%2200700.HK%22)&pageSize=8")
                  d = json.loads(body)
                  data = ((d.get("result") or {}).get("data")) or []
                  print(f"\n== {rn} 행{len(data)}")
                  for row in data[:4]:
                      print("   ", json.dumps(row, ensure_ascii=False)[:240])
              except Exception as e:
                  print(f"\n== {rn} 실패 {e}")
          EOF
