# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # stockanalysis 의 부문 페이지가 quote 주소(일본·홍콩)로도 열리는지.
      # /stocks/ 주소로는 404였다 — 그건 미국 전용 주소였을 뿐일 수 있다.
      - name: 🌏 일본·홍콩 부문 페이지가 열리나
        timeout-minutes: 6
        run: python scrape_fin_seg.py --probe hk:00700 hk:09992 hk:01810 jp:7203 jp:6758 jp:9984
