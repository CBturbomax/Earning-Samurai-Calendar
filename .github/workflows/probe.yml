# 소스를 떠보는 자리. 결과만 probe-out 가지에 남기고 아무것도 커밋하지 않는다. **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 🔎 실시간 서버 로그 — 텔레그램 그림이 왜 바뀌었나(11/11)
        continue-on-error: true
        run: |
          { echo "== health"; curl -sS -m 30 "https://earning-samurai-calendar-production.up.railway.app/health" | head -c 1500; echo; echo "== log"; curl -sS -m 60 "https://earning-samurai-calendar-production.up.railway.app/api/log" | head -c 60000; } > /tmp/probe.txt 2>&1
      - name: 결과를 probe-out 가지에
        if: always()
        run: |
          cd /tmp && rm -rf po && mkdir po && cd po && git init -q
          cp /tmp/probe.txt . ; git add . && git -c user.name=bot -c user.email=b@b commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
