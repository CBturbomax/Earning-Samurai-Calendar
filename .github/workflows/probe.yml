# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔎 일본 지역별 매출·수주 (결산단신 zip + 보충자료 PDF)
        continue-on-error: true
        timeout-minutes: 20
        run: mkdir -p /tmp/po && python tools/ai/probe_jp_zips.py > /tmp/probe.txt 2>&1

      - name: 결과를 probe-out 가지에
        if: always()
        run: |
          mkdir -p /tmp/po && cd /tmp/po && rm -rf .git && git init -q
          cp /tmp/probe.txt . ; git add . && git -c user.name=bot -c user.email=b@b commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
