# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 77차 — 화면에 오르는 57종목 중 39종목에 수치가 없다. 그게 하필
      # 제일 큰 회사들이다(이온 23조·ABC마트·J프론트·오다큐·워크맨…).
      # 큰 것부터 여덟 곳의 표를 그대로 찍어 어떤 꼴인지 본다.
      - name: 🏢 큰 회사들의 표 생김새 (77차)
        timeout-minutes: 12
        run: |
          python - <<'EOF'
          import json, time, urllib.request
          import pdftext, montable

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          mon = json.load(open("data/monthly_jp.json", encoding="utf-8"))
          byc = {}
          for r in mon["rows"]:
              byc.setdefault(r["code"], []).append(r)
          for code in ("8267", "2670", "3086", "9007", "7564", "3923",
                       "4680", "2782"):
              rs = byc.get(code) or []
              if not rs:
                  print(f"\n{code} 공시 없음")
                  continue
              r = rs[-1]
              try:
                  raw = urllib.request.urlopen(
                      urllib.request.Request(r["doc"], headers=UA),
                      timeout=30).read()
              except Exception as e:
                  print(f"\n{code} !! {type(e).__name__}", getattr(e, "code", ""))
                  continue
              time.sleep(0.6)
              print("\n" + "=" * 74)
              got = montable.read(raw, r["date"], title=r.get("title", ""))
              print(f"{code} {r['name'][:12]} · {r['title'][:44]}")
              print(f"  {len(raw)//1024}KB · 암호 {pdftext.is_encrypted(raw)}"
                    f" · 읽은 달 {len((got or {}).get('rows') or [])}")
              try:
                  cells = pdftext.extract_cells(raw, 2)
              except Exception as e:
                  print("  글자 못 꺼냄:", type(e).__name__, str(e)[:60])
                  continue
              print(f"  칸 {len(cells)}줄")
              for c in cells[:22]:
                  print("   | " + " | ".join(f"{x:.0f}:{v[:16]}" for x, v in c[:10]))
          EOF
