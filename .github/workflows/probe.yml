# 새 소스나 고친 수집기를 전체에 풀기 전에 떠본다. **저장소에 아무것도 안 쓴다.**
#
# 지금 볼 것: **일본 실적을 발표 당일에 받을 수 있는가.**
# stockanalysis 는 며칠 뒤에 싣는다(소니 12일, 도요타 8일, 오늘 발표분 0건).
# 미국은 SEC 에서 직접 받으니 일본도 TDnet 에서 직접 받아야 한다.
#
# 훑어본 결과: TDnet 200 · 야후재팬 200 · 닛케이 결산 200 · JPX 200,
#            EDINET 401(열쇠 필요) · 가부탄 405 · 민카부 403 · IR뱅크 403.
name: 소스 접근 확인
on:
  workflow_dispatch:
    inputs:
      syms:
        description: '떠볼 종목이나 일수'
        required: false
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # **SEC 벌크 재무데이터에 부문 축이 살아 있는가.**
      # companyfacts API 는 부문(dimension)을 떨어뜨리고 연결 합계만 준다. 그런데
      # SEC 가 분기마다 내는 Financial Statement Data Sets 에는 num.txt 의
      # `segments` 칸에 축이 그대로 실린다고 알려져 있다. 사실이면 미국 전 종목의
      # 부문별 매출을 공식 자료로 받을 수 있다 — stockanalysis 는 17%밖에 안 준다.
      - name: 🧩 SEC 벌크에 부문 축이 있는가
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python - <<'EOF'
          import io, json, re, urllib.request, zipfile
          UA = "Earning Samurai Calendar (cbpark@wisdomasset.co.kr)"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, r.read()
              except Exception as e:
                  return getattr(e, "code", 0), str(e).encode()

          for q in ("2026q2", "2026q1", "2025q4"):
              url = f"https://www.sec.gov/files/dera/data/financial-statement-data-sets/{q}.zip"
              st, body = get(url)
              print(f"\n===== {q}: {st} · {len(body):,} 바이트")
              if st != 200 or len(body) < 100000:
                  print("   ", body[:200])
                  continue
              try:
                  z = zipfile.ZipFile(io.BytesIO(body))
              except zipfile.BadZipFile:
                  print("    zip 이 아니다"); continue
              print("    안에 든 파일:", z.namelist())
              # num.txt 머리글과 부문 축이 실린 줄을 본다
              with z.open("num.txt") as f:
                  head = f.readline().decode("utf-8", "replace").rstrip("\r\n")
                  cols = head.split("\t")
                  print("    num.txt 열:", cols)
                  si = cols.index("segments") if "segments" in cols else -1
                  ti = cols.index("tag"); vi = cols.index("value"); ai = cols.index("adsh")
                  print("    segments 칸:", "있음" if si >= 0 else "없음")
                  if si < 0:
                      break
                  seen = 0
                  for raw in f:
                      p = raw.decode("utf-8", "replace").rstrip("\r\n").split("\t")
                      if len(p) <= max(si, ti, vi) or not p[si]:
                          continue
                      if "Revenue" not in p[ti]:
                          continue
                      print(f"      {p[ai]} {p[ti][:44]:46s} seg={p[si][:60]:62s} {p[vi][:14]}")
                      seen += 1
                      if seen >= 12:
                          break
              break
          EOF

      # 회사가 무엇을 파는지 한 줄로 적어 주려면 소스가 있어야 한다.
      # 나스닥 회사 소개 · 닛케이 결산 페이지의 【…】 요약 · stockanalysis 를 떠본다.
      - name: 🏷️ 사업 설명 소스 떠보기
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import json, re, urllib.request, urllib.error
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          def get(url, hdr=None):
              h = {"User-Agent": UA, "Accept": "*/*"}
              h.update(hdr or {})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=25) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return 0, str(e)

          print("=== 나스닥 회사 소개 (미국)")
          for sym in ("AAPL", "PLTR", "RKLB"):
              st, body = get(f"https://api.nasdaq.com/api/company/{sym}/company-profile")
              desc = ""
              if st == 200:
                  try:
                      d = json.loads(body).get("data") or {}
                      desc = ((d.get("CompanyDescription") or {}).get("value") or "")
                  except ValueError:
                      pass
              print(f"  {sym}: {st} · {len(desc)}자")
              if desc:
                  print("     ", desc[:200].replace("\n", " "))

          print("\n=== 닛케이 결산 페이지 (일본)")
          for code in ("1379", "7203", "6758"):
              st, body = get(f"https://www.nikkei.com/nkd/company/kessan/?scode={code}")
              m = re.search(r"【([^】]{2,40})】([^\"<]{0,120})", body)
              print(f"  {code}: {st} · {'찾음' if m else '못 찾음'}")
              if m:
                  print("     【" + m.group(1) + "】" + m.group(2)[:100])

          print("\n=== stockanalysis (홍콩)")
          for ex, code in (("hkg", "0700"), ("hkg", "0005")):
              st, body = get(f"https://stockanalysis.com/quote/{ex}/{code}/company/")
              m = re.search(r'name="description" content="([^"]{40,300})"', body)
              print(f"  {ex}:{code}: {st} · {'찾음' if m else '못 찾음'}")
              if m:
                  print("     ", m.group(1)[:180])
          EOF
      # 금융사는 NetSales 를 안 쓴다. 어떤 이름을 쓰는지 공시에서 직접 뽑는다.
      # 8766 도쿄해상 · 8253 크레디세존 · 7157 라이프넷생명 · 9214 · 6291 등
      - name: 🇯🇵 금융사가 쓰는 항목 이름 뽑기
        continue-on-error: true
        timeout-minutes: 8
        env:
          JP_BACK_DAYS: '4'
        run: python scrape_fin_jp.py --names 8766 8253 7157 9214 6291 2667 3416 4222
