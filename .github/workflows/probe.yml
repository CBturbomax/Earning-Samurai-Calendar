# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 75차 — TJ 조각 내기로 스기HD(7649)가 5달 -> 0 이 됐다. 왜인지 본다.
      # 74차는 전체로는 나아졌다(공시 14->15 · 달 83->107). 하나가 조용히
      # 사라지는 것은 그냥 넘기지 않는다 — 옛 판·새 판의 칸을 나란히 찍는다.
      - name: 🔬 스기HD 가 왜 사라졌나 (75차)
        timeout-minutes: 10
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:pdftext.py > /tmp/old_pdftext.py
          python - <<'EOF'
          import importlib.util, json, sys, urllib.request
          import montable, pdftext

          spec = importlib.util.spec_from_file_location("old_pdftext",
                                                        "/tmp/old_pdftext.py")
          old = importlib.util.module_from_spec(spec)
          sys.modules["old_pdftext"] = old
          spec.loader.exec_module(old)

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          mon = json.load(open("data/monthly_jp.json", encoding="utf-8"))
          rows = [r for r in mon["rows"] if r.get("code") == "7649"]
          print("7649 공시", len(rows), "건")
          for r in rows[:1]:
              raw = urllib.request.urlopen(
                  urllib.request.Request(r["doc"], headers=UA), timeout=30).read()
              print(r["title"][:70], "·", len(raw) // 1024, "KB")
              for tag, mod in (("옛", old), ("새", pdftext)):
                  montable.pdftext = mod
                  got = montable.read(raw, r["date"], title=r.get("title", ""))
                  print(f"\n===== {tag} 판 · 읽은 달 "
                        f"{len((got or {}).get('rows') or [])} "
                        f"· 이름표 {(got or {}).get('amount_label','')!r}"
                        f"/{(got or {}).get('yoy_label','')!r}")
                  for x in ((got or {}).get("rows") or [])[:6]:
                      print("   ", x)
                  cells = mod.extract_cells(raw, 3)
                  print(f"  -- 칸 {len(cells)}줄 --")
                  for c in cells[:26]:
                      print("   | " + " | ".join(f"{x:.0f}:{v[:18]}"
                                                 for x, v in c[:10]))
          EOF
