# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      EDINETDB_KEY: ${{ secrets.EDINETDB_KEY }}
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 29차 — FPI 수집기가 캐나다·유럽 은행 5곳은 잡았는데(TD·BMO·CIBC·TTE)
      # ARM·HSBC·아메르스포츠는 빈손이다. 서류는 받았는지, 받았는데 부문 행이
      # 0인지, 축 이름이 우리 잣대(axis_rank)에 안 걸리는지 원문으로 가른다.
      - name: 🌏 FPI 실패 종목 해부 (29차)
        timeout-minutes: 10
        run: python scrape_seg_fpi.py --probe AS ARM HSBC AZN

      # 29-B — 위에서 '축 이름이 문제'로 나오면 무엇을 넓혀야 하는지 알아야 한다.
      # 실패 종목의 인스턴스에서 **문맥 축 이름을 전수**로 뽑아 빈도순으로 찍는다.
      - name: 🌏 실패 종목의 축 이름 전수 (29-B)
        timeout-minutes: 8
        run: |
          python - <<'EOF'
          import io, re
          from collections import Counter
          import xml.etree.ElementTree as ET
          import scrape_seg_sec as ss
          from scrape_seg_edgar import get, instance_url, local, strip_member
          from scrape_seg_fpi import xbrl_filings, DOCS_PER_CO
          cikmap = ss.cik_map()
          for sym in ("AS", "ARM", "HSBC"):
              cik = ss.cik_of(cikmap, sym)
              print(f"\n== {sym} CIK {cik}")
              for acc, filed, form in xbrl_filings(cik)[:2]:
                  url = instance_url(cik, acc)
                  if not url:
                      print(f"   {filed} {form}: 인스턴스 없음"); continue
                  blob = get(url, timeout=120)
                  if not blob:
                      print(f"   {filed} {form}: 못 받음"); continue
                  axes, tags = Counter(), Counter()
                  for ev, el in ET.iterparse(io.BytesIO(blob), events=("end",)):
                      n = local(el.tag)
                      if n == "explicitMember":
                          axes[ss.norm_axis(el.get("dimension") or "")] += 1
                      elif el.get("contextRef"):
                          t = n
                          if re.search(r"Revenue|Sales|Income", t):
                              tags[t] += 1
                      el.clear()
                  print(f"   {filed} {form} {len(blob)/1e6:.1f}MB")
                  print("      축:", [(a, c, ss.axis_rank(a)) for a, c in axes.most_common(8)])
                  print("      매출류 항목:", [(t, c, t in ss.REV_RANK) for t, c in tags.most_common(8)])
          EOF
