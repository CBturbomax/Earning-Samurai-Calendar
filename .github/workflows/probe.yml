# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 65차 — 표 꼴 셋을 더 읽게 고쳤다. 얼마나 늘었고, 엉뚱한 것이 안 들어왔나.
      # 전수로 훑어 종목마다 값을 늘어놓고 눈으로 본다.
      - name: 🏬 표 꼴 셋을 더한 뒤 (65차)
        timeout-minutes: 14
        env:
          WEB_PER_RUN: '260'
          WEB_SECS: '560'
          WEB_DEEP: '14'
        run: |
          set -o pipefail
          python monweb.py
          python scrape_mon_web.py
          python - <<'EOF' 2>&1 | tail -180
          import json
          d = json.load(open("data/monthly_web_jp.json"))
          codes = d["codes"]
          C = (json.load(open("data/caps.json")).get("caps")
               or json.load(open("data/caps.json")))
          have = {r["code"] for r in json.load(
              open("data/monthly_jp.json"))["rows"]}

          def cap(c):
              v = C.get("jp:" + c)
              return (v.get("cap") if isinstance(v, dict) else v) or 0

          print(f"\n종목 {d['companies']} · 달 {d['months']} · 본 기사 "
                f"{len(d['done'])} · 쪽 {d['deep']}"
                f"{' (끝까지)' if d.get('deep_done') else ''}")
          print(f"우리 목록에 없던 회사 {sum(1 for c in codes if c not in have)}")
          for c, v in sorted(codes.items(), key=lambda kv: -cap(kv[0])):
              ms = sorted(v["months"])
              print(f"\n{c} {v['name'][:24]} [{v['brand']}] {cap(c):.2f}조원 "
                    f"{'새' if c not in have else '겹침'}")
              print("   " + " ".join(
                  f"{m[2:]}:{v['months'][m].get('same','-')}/"
                  f"{v['months'][m].get('all','-')}" for m in ms[-13:]))
          EOF
