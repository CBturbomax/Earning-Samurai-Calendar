# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 89차 — **수집기를 그대로 돌려 본다.** 「2025年度」 를 4월 시작으로
      # 넘겨짚던 것을 고친 뒤(온워드 3月 이 한 해 앞으로 밀렸다) 무엇이
      # 담기는지 끝까지 본다. probe 는 아무것도 커밋하지 않는다.
      - name: 🔎 수집기를 그대로 (89차)
        timeout-minutes: 16
        env:
          IR_SECS: '600'
          IR_PAUSE: '1.0'
        run: |
          python scrape_mon_ir.py
          python - <<'EOF'
          import json
          from pathlib import Path
          d = json.loads(Path("data/monthly_ir_jp.json").read_text(encoding="utf-8"))
          print()
          print("== 89차: %d사 · %d달 ==" % (d["companies"], d["months"]))
          for code, rec in sorted(d["codes"].items(),
                                  key=lambda kv: -len(kv[1]["months"])):
              ks = sorted(rec["months"])
              print("%-5s %-14s %2d달 %s ~ %s" % (code, rec["name"], len(ks),
                                                 ks[0], ks[-1]))
              print("      " + " · ".join(
                  "%s %s" % (k[2:], "/".join(
                      "%g" % rec["months"][k][x]
                      for x in ("same", "all") if x in rec["months"][k]))
                  for k in ks))
          print()
          print("찾아 둔 月次 주소")
          for code, st in sorted(d["sites"].items()):
              print("  %-5s %s" % (code, st["page"]))
          EOF
