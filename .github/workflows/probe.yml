# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 41차 — **월매출의 숫자를 어디서 받나.** 지금 가진 것은 '언제 무엇을
      # 냈나'와 원문 링크뿐이고 알맹이(실제 매출·전년비)가 없다. 두 길을 같이 본다.
      #
      #   (가) TDnet 첨부 PDF 를 우리가 직접 해독한다(pdftext.py). 예전에
      #        "CID 인코딩이라 표준 라이브러리로는 못 읽는다"고 접었는데, 그건
      #        **압축을 안 풀고 괄호 문자열만 긁어 본 것**이었다. Flate 를 풀고
      #        폰트의 /ToUnicode 표를 읽으면 되는지 실제 공시 열 건에 부딪혀 본다.
      #   (나) TDnet 에 아예 안 내는 회사(니토리·스시로)를 메울 집계 사이트.
      - name: 🗾 월매출 숫자 — PDF 해독 + 외부 소스 (41차)
        timeout-minutes: 13
        run: |
          python - <<'EOF'
          import re, time, urllib.request, urllib.error, gzip
          import pdftext

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")

          def get(url, timeout=40):
              h = {"User-Agent": UA, "Accept": "*/*",
                   "Accept-Language": "ja,en;q=0.8", "Accept-Encoding": "gzip"}
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      return r.status, raw
              except urllib.error.HTTPError as e:
                  return e.code, b""
              except Exception as e:
                  return str(e)[:60], b""

          print("=" * 72)
          print("(가) TDnet 첨부 PDF 를 직접 해독할 수 있나")
          print("=" * 72)
          PDFS = [
              ("6238", "https://www.release.tdnet.info/inbs/140120260918538410.pdf"),
              ("7865", "https://www.release.tdnet.info/inbs/140120260918538582.pdf"),
              ("3038", "https://www.release.tdnet.info/inbs/140120260917537924.pdf"),
              ("7370", "https://www.release.tdnet.info/inbs/140120260918538566.pdf"),
              ("8715", "https://www.release.tdnet.info/inbs/140120260917537741.pdf"),
              ("9007", "https://www.release.tdnet.info/inbs/140120260917538088.pdf"),
              ("3461", "https://www.release.tdnet.info/inbs/140120260917538196.pdf"),
              ("7685", "https://www.release.tdnet.info/inbs/140120260917537893.pdf"),
              ("5580", "https://www.release.tdnet.info/inbs/140120260916537473.pdf"),
              ("7043", "https://www.release.tdnet.info/inbs/140120260916537033.pdf"),
          ]
          ok = 0
          for code, url in PDFS:
              st, data = get(url)
              if st != 200 or not data:
                  print(f"  {code}: 받기 실패 {st}")
                  continue
              t0 = time.time()
              try:
                  lines = pdftext.extract_lines(data)
              except Exception as e:
                  print(f"  {code}: 해독 중 터짐 {type(e).__name__} {e}")
                  continue
              txt = "\n".join(lines)
              jp = sum(1 for ch in txt
                       if "\u3040" <= ch <= "\u30ff" or "\u4e00" <= ch <= "\u9fff")
              nums = len(re.findall(r"\d[\d,]*\.?\d*", txt))
              good = jp > 30 and nums > 10
              ok += good
              print(f"  {code}: {len(data)//1024}KB · 줄 {len(lines)} · 일본글자 {jp} · "
                    f"숫자 {nums} · {time.time()-t0:.2f}초 · {'읽힌다' if good else '못 읽음'}")
              for ln in lines[:14]:
                  print(f"      | {ln[:110]}")
              print()
          print(f"==> 열 건 중 {ok} 건이 읽혔다")

          print()
          print("=" * 72)
          print("(나) TDnet 에 안 내는 회사용 — 월매출 집계 사이트")
          print("=" * 72)
          CAND = [
              ("irbank 월차",     "https://irbank.net/9843/gs"),
              ("irbank 코드",     "https://irbank.net/E03144/gs"),
              ("kabutan",         "https://kabutan.jp/stock/?code=9843"),
              ("minkabu",         "https://minkabu.jp/stock/9843"),
              ("kabuyoho",        "https://kabuyoho.ifis.co.jp/index.php?action=tp1&sa=report_top&bcode=9843"),
              ("buffett-code",    "https://www.buffett-code.com/company/9843/"),
              ("getsuji",         "https://www.getsuji.com/"),
              ("shikiho",         "https://shikiho.toyokeizai.net/stocks/9843"),
              ("니토리 IR",        "https://www.nitorihd.co.jp/ir/monthly/"),
              ("스시로 IR",        "https://www.food-and-life.co.jp/ir/monthly/"),
              ("ullet",           "https://www.ullet.com/9843.html"),
              ("株予報",           "https://kabuyoho.jp/sp/reportTop?bcode=9843"),
              ("stockanalysis",   "https://stockanalysis.com/quote/tyo/9843/"),
              ("yahoo finance jp","https://finance.yahoo.co.jp/quote/9843.T"),
          ]
          for name, url in CAND:
              st, data = get(url, timeout=25)
              hit = ""
              if isinstance(st, int) and st == 200 and data:
                  t = data.decode("utf-8", "ignore")
                  marks = [m for m in ("月次", "既存店", "売上高", "前年同月", "月別")
                           if m in t]
                  hit = f" · {len(data)//1024}KB · 표식 {marks}"
              print(f"  {name:16s} {st}{hit}")
              time.sleep(0.6)
          EOF
