# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 48차 — 문장으로 집는 길은 접었다(46차 14/66 이고 그중 몇은 표를 문장으로
      # 잘못 읽은 것이었다 — 556A「売上高5月6月7月8月前年同月比125.4%」). 자료는
      # 전부 **표**라 좌표로 열을 맞춰야 한다. montable.py 가 달 이름표 줄을 찾고
      # 아래 줄의 값을 x 가 가장 가까운 이름표에 붙인다. 붙일 곳이 없으면 버린다.
      #
      # 여기서 재는 것은 **몇 종목이 몇 달치를 주나**다. 표로 읽으면 한 건으로
      # 여러 달이 한꺼번에 들어오므로 차트가 바로 선다.
      - name: 🗾 월매출 — 표로 읽어 달별 수치 — 실제 글자폭 반영 (48차)
        timeout-minutes: 13
        run: |
          python - <<'EOF'
          import json, re, time, urllib.request, urllib.error, gzip
          from datetime import date, timedelta
          import pdftext, montable

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")

          def get(url, timeout=40):
              h = {"User-Agent": UA, "Accept": "*/*", "Accept-Encoding": "gzip"}
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers=h), timeout=timeout) as r:
                      raw = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      return r.status, raw
              except urllib.error.HTTPError as e:
                  return e.code, b""
              except Exception as e:
                  return str(e)[:50], b""

          rows = json.load(open("data/monthly_jp.json", encoding="utf-8"))["rows"]
          cut = (date.today() - timedelta(days=16)).isoformat()
          recent, seen = [], set()
          for r in sorted(rows, key=lambda r: r["date"], reverse=True):
              if r["date"] < cut or r["code"] in seen or not r.get("doc"):
                  continue
              seen.add(r["code"]); recent.append(r)
              if len(recent) >= 70:
                  break

          okread = enc = fail = 0
          hit = withrev = 0
          months = []
          good, bad = [], []
          for r in recent:
              st, data = get(r["doc"])
              if st != 200 or not data:
                  fail += 1; continue
              if pdftext.is_encrypted(data):
                  enc += 1; continue
              try:
                  txt = pdftext.extract_text(data, 6)
              except Exception:
                  fail += 1; continue
              if len(txt) < 40:
                  fail += 1; continue
              okread += 1
              got = montable.read(data, r["date"])
              if not got:
                  if len(bad) < 10:
                      bad.append(f"{r['code']} {r['title'][:34]}")
                  continue
              hit += 1
              months.append(len(got["rows"]))
              if any("rev" in x for x in got["rows"]):
                  withrev += 1
              if len(good) < 20:
                  sm = [(x["period"], x.get("rev"), x.get("yoy")) for x in got["rows"][-4:]]
                  good.append(f"{r['code']} [{got['amount_label']}|{got['yoy_label']}] {sm}")
              time.sleep(0.15)

          print(f"표본 {len(recent)} · 읽힘 {okread} · 암호 {enc} · 실패 {fail}")
          print(f"표로 읽힌 종목 {hit}/{okread} · 그중 금액까지 {withrev}")
          if months:
              months.sort()
              print(f"종목당 달 수: 가운뎃값 {months[len(months)//2]} · 최소 {months[0]} · 최대 {months[-1]} · 합계 {sum(months)}")
          print("--- 읽힌 것 ---")
          for x in good: print("  ", x)
          print("--- 못 읽은 것 ---")
          for x in bad: print("  ", x)
          EOF
