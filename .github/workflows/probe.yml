# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 79차 — 못 읽은 공시의 **꼴**을 센다. 새 규칙을 짜기 전에 그것이
      # 몇 건짜리 이야기인지 먼저 재 둔다(짐작으로 100줄을 쓰지 않는다).
      #   ㄱ) 달이 세로 — 첫 칸이 달인 줄이 셋 이상 (세리아 2782 꼴)
      #   ㄴ) 달이 가로 — 한 줄에 달 이름표가 셋 이상 (이미 읽는 꼴인데 왜 못 읽나)
      #   ㄷ) 달이 아예 안 보임 — 그림이거나 한 달치만 적힌 공시
      - name: 📐 못 읽은 공시의 꼴을 센다 (79차)
        timeout-minutes: 14
        run: |
          python - <<'EOF'
          import collections, json, re, time, urllib.request
          import pdftext, montable

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          n = json.load(open("data/monthly_nums_jp.json", encoding="utf-8"))
          mon = json.load(open("data/monthly_jp.json", encoding="utf-8"))
          info = {r.get("doc"): r for r in (mon.get("rows") or [])}
          bad = [u for u, why in n["skip"].items() if why == "표없음"]
          print(f"표없음 {len(bad)}건을 전부 훑는다")

          kind = collections.Counter()
          down_ex, cross_ex = [], []
          for u in bad:
              r = info.get(u) or {}
              try:
                  raw = urllib.request.urlopen(
                      urllib.request.Request(u, headers=UA), timeout=30).read()
              except Exception as e:
                  kind["못 받음"] += 1
                  continue
              time.sleep(0.25)
              try:
                  tb = pdftext.extract_cells(raw, 4)
              except Exception:
                  kind["글자 못 꺼냄"] += 1
                  continue
              if not tb:
                  kind["글자 0줄(그림)"] += 1
                  continue
              cross = sum(1 for cells in tb if montable._headers(cells))
              down = 0
              for cells in tb:
                  if not cells:
                      continue
                  x0, t0 = cells[0]
                  m = montable.MONTH_HDR.match(montable._norm(t0))
                  if m and 1 <= int(m.group(2)) <= 12 and any(
                          montable._num(t) is not None for _x, t in cells[1:]):
                      down += 1
              if down >= 3 and not cross:
                  kind["ㄱ 달이 세로"] += 1
                  if len(down_ex) < 3:
                      down_ex.append((r.get("code"), r.get("title", "")[:40], tb))
              elif cross:
                  kind["ㄴ 달이 가로인데 못 읽음"] += 1
                  if len(cross_ex) < 2:
                      cross_ex.append((r.get("code"), r.get("title", "")[:40], tb))
              elif down >= 3:
                  kind["ㄱ+ㄴ 둘 다"] += 1
              else:
                  kind["ㄷ 달이 안 보임"] += 1
          print("\n꼴:", dict(kind.most_common()))

          def dump(tag, ex):
              for code, ti, tb in ex:
                  print(f"\n--- {tag} {code} {ti}")
                  for cells in tb[:18]:
                      print("   | " + " | ".join(f"{x:.0f}:{v[:14]}"
                                                 for x, v in cells[:9]))
          dump("세로", down_ex)
          dump("가로", cross_ex)
          EOF
