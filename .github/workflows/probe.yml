# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 엑슨이 계속 안 잡힌다. 수집기 코드를 그대로 태워 어디서 떨어지는지 본다.
      - name: 🔎 엑슨은 어디서 떨어지나
        timeout-minutes: 8
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
        run: |
          python - <<'EOF'
          import collections, io, zipfile
          import scrape_seg_sec as s

          CIK = {34088: "XOM", 93410: "CVX", 87347: "SLB"}
          facts, pairs = {}, {}
          for q in ("2025q2", "2025q3", "2025q4", "2026q1"):
              blob = s.fetch(s.BULK.format(q=q))
              if not blob:
                  print(q, "못 받음"); continue
              n = s.scan(blob, set(CIK), facts, pairs)
              print(f"{q}: 담은 행 {n:,}")
              del blob

          for cik, sym in CIK.items():
              print(f"\n===== {sym} (CIK {cik})")
              fa, pa = facts.get(cik, {}), pairs.get(cik, {})
              print("  한 축짜리 축:", {a: len(m) for a, m in fa.items()} or "없음")
              print("  두 축 축:", {a: {sub: len(m) for sub, m in subs.items()}
                                    for a, subs in pa.items()} or "없음")
              for axis, members in fa.items():
                  ser = s.series_of(members)
                  print(f"    [solo {axis}] 부문 {len(ser)} -> {list(ser)[:6]}")
                  for m, x in list(ser.items())[:3]:
                      print(f"        {m}: {len(x)}분기 {sorted(x)[-2:]}")
              for axis, subs in pa.items():
                  for sub, members in subs.items():
                      flat = {m: {t: {k: (v[0], v[1]) for k, v in raw.items()}
                                  for t, raw in by_tag.items()}
                              for m, by_tag in members.items()}
                      ser = s.series_of(flat)
                      print(f"    [pair {axis} x {sub}] 원래 부문 {len(members)} "
                            f"-> 남은 부문 {len(ser)} {list(ser)[:6]}")
                      for m, by_tag in list(members.items())[:4]:
                          allk = [(t, sorted(r)[:3], len(r)) for t, r in by_tag.items()]
                          print(f"        {m}: {allk}")
              print("  build_stock ->", (s.build_stock(fa, pa) or {}).get("names", "없음"))
          EOF
