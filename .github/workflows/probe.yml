# 소스가 GitHub 러너에서 실제로 열리는지, 응답이 어떻게 생겼는지 확인한다.
#
# 확인된 것:
#   🇺🇸 나스닥  — 정상. 발표 없는 날도 제대로 0건으로 답한다.
#   🇯🇵 닛케이  — 한 번은 열리지만 연속 요청은 데이터센터 IP 라 막힌다.
#   🇭🇰 HKEX   — 이사회 캘린더 경로가 통째로 404. 통계 목차에도 항목이 없다.
#      AAStocks — 200 이지만 표를 자바스크립트로 그려서 HTML 에 데이터가 없다.
#      HKEXnews — 200, JSON 정상. 다만 '이미 나온 공시' 목록이라 앞일이 아니다.
#
# 지금 찾는 것: 홍콩의 '앞으로의' 실적발표 일정을 주는 곳.

name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 🇭🇰 HKEXnews 공시 분류표 (이사회 개최일 코드 찾기)
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          curl -sS --max-time 25 -L -H "User-Agent: $UA" \
            'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en' -o ts.html \
            -w 'HTTP %{http_code} / %{size_download}바이트\n'
          echo '--- 이사회 관련 분류 코드 ---'
          grep -oiE '<option[^>]*value="[0-9]+"[^>]*>[^<]*(board meeting|results)[^<]*' ts.html | head -20 || echo '(없음)'
          echo '--- 분류 JSON 파일 링크 ---'
          grep -oE '[A-Za-z0-9/_.-]*(tier[12]|category|t2code)[A-Za-z0-9/_.-]*\.(json|js)' ts.html | sort -u | head -10 || echo '(없음)'

      - name: 🇭🇰 앞으로의 일정을 주는 곳 후보
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          shot() {
            code=$(curl -sS --max-time 20 -L -o /tmp/x -w '%{http_code}' \
                   -H "User-Agent: $UA" -H 'Accept-Language: en-US,en;q=0.9' \
                   ${3:+-H "$3"} ${2:+--data "$2"} "$1" 2>/dev/null || echo 000)
            printf '%-5s %8s  %s\n' "$code" "$(wc -c </tmp/x)" "$1"
            [ "$code" = "200" ] && head -c 260 /tmp/x | tr -d '\n' | sed 's/^/        /' && echo
          }
          echo '=== ETNet (홍콩 금융정보) ==='
          shot 'https://www.etnet.com.hk/www/eng/stocks/schedule_result.php'
          shot 'https://www.etnet.com.hk/www/eng/stocks/calendar_result.php'
          echo '=== AAStocks 데이터피드 ==='
          shot 'https://www.aastocks.com/en/resources/datafeed/getcompanyresult.ashx?t=1&page=1'
          shot 'https://www.aastocks.com/en/stocks/market/company-results.aspx?t=2&s=0&o=0&p=1'
          echo '=== Investing.com 실적 캘린더 (POST) ==='
          shot 'https://www.investing.com/earnings-calendar/Service/getCalendarFilteredData' \
               'country%5B%5D=39&currentTab=custom&dateFrom=2026-08-11&dateTo=2026-10-10&limit_from=0' \
               'X-Requested-With: XMLHttpRequest'
          echo '=== HKEX 상장사 공시 요약 페이지 ==='
          shot 'https://www.hkexnews.hk/reports/prelisting/index.htm'
          shot 'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=zh'
