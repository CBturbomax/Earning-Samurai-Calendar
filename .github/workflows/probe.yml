# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 59차 — 58차에서 52종목·288달로 늘었지만 **두 종목(2674·9832)이 사라졌고**
      # 아즈원(7476)의 달이 띄엄띄엄이라(2025-05·09·10·2026-01) 미심쩍다.
      # 늘어난 것만 세고 넘어가면 조용히 틀린 값을 싣는다. 눈으로 본다.
      - name: 🔎 사라진 둘과 미심쩍은 하나 (59차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import json, urllib.request
          import pdftext, montable

          rows = json.load(open("data/monthly_jp.json"))["rows"]
          H = {"User-Agent": "Mozilla/5.0 (compatible; earnings-samurai/1.0)"}
          WANT = ("2674", "9832", "7476")
          for r in rows:
              if r["code"] not in WANT:
                  continue
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(r["doc"], headers=H),
                          timeout=20) as f:
                      pdf = f.read()
              except Exception as e:
                  print(f"{r['code']} 받기실패 {e}")
                  continue
              print(f"\n{'='*72}\n{r['code']} {r['name']} {r['period']} {r['date']}")
              print(f"  {r['title'][:66]}")
              got = montable.read(pdf, r["date"], 12, r["title"])
              print(f"  -> {json.dumps(got, ensure_ascii=False)[:420] if got else None}")
              for row in pdftext.extract_cells(pdf, 3)[:30]:
                  print("   | " + "  ".join(c for _, c in row)[:120])
          EOF

      # 59차 (나) — 새로 읽힌 것 전부를 종목별로 늘어놓는다. 달이 이어지는지,
      # 값이 그럴듯한지 눈으로 본다. 여기서 이상한 것을 못 보면 화면에 실린다.
      - name: 👀 새로 읽힌 것 전부 (59-나)
        timeout-minutes: 13
        run: |
          set -o pipefail
          python - <<'EOF' 2>&1 | tail -300
          import json, time, urllib.request
          import montable

          rows = json.load(open("data/monthly_jp.json"))["rows"]
          old = set(json.load(open("data/monthly_nums_jp.json"))["codes"])
          H = {"User-Agent": "Mozilla/5.0 (compatible; earnings-samurai/1.0)"}
          got = {}
          t0 = time.time()
          for r in rows:
              if time.time() - t0 > 640:
                  print("  …시간이 다 됐다")
                  break
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(r["doc"], headers=H),
                          timeout=20) as f:
                      pdf = f.read()
                  res = montable.read(pdf, r["date"], 12, r["title"])
              except Exception:
                  continue
              if not res:
                  continue
              rec = got.setdefault(r["code"], {"n": r["name"], "m": {}, "t": r["title"]})
              rec["lab"] = res.get("amount_label", "")
              rec["y"] = res.get("yoy_label", "")
              for x in res["rows"]:
                  rec["m"][x["period"]] = (x.get("rev"), x.get("yoy"), x.get("unit", ""))
          print(f"종목 {len(got)} · 달 {sum(len(v['m']) for v in got.values())}")
          for c in sorted(got, key=lambda c: (c in old, c)):
              v = got[c]
              mark = "헌" if c in old else "새"
              ms = sorted(v["m"])
              gap = ""
              if len(ms) > 1:
                  n = [int(x[:4]) * 12 + int(x[5:]) for x in ms]
                  if max(n) - min(n) + 1 != len(n):
                      gap = "  ⚠달이 띄엄띄엄"
              print(f"\n[{mark}] {c} {v['n']} · 금액={v['lab']!r} 전년비={v['y']!r}{gap}")
              print(f"     {v['t'][:60]}")
              print("     " + " ".join(
                  f"{m[2:]}:{('%.4g' % r) if r else '-'}/{('%.1f' % y) if y else '-'}"
                  for m in ms for r, y, _u in [v["m"][m]]))
          EOF
