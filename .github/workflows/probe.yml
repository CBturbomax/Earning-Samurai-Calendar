# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 58차 — 고친 규칙(이름표 물려주기·아랫줄 단위·제목이 전년비인 표·
      # 진짜 글자폭)을 **264건 전부**에 걸어 얼마나 늘었는지, 그리고 **엉뚱한
      # 것이 섞이지 않았는지** 본다. 넣기 전에 눈으로 보는 자리다.
      - name: 🧪 고친 규칙으로 264건 다시 읽기 (58차)
        timeout-minutes: 14
        run: |
          set -o pipefail
          python - <<'EOF' 2>&1 | tail -360
          import collections, json, re, time, urllib.request
          import montable

          rows = json.load(open("data/monthly_jp.json"))["rows"]
          old = json.load(open("data/monthly_nums_jp.json"))
          had = {c for c in old["codes"]}
          H = {"User-Agent": "Mozilla/5.0 (compatible; earnings-samurai/1.0)"}
          BAD = re.compile(r"客数|客単価|店舗数|会員数|稼働|口座|台数|人数|"
                           r"件数|坪|面積|日数|単価")

          got = {}
          fail = collections.Counter()
          shown = 0
          t0 = time.time()
          for n, r in enumerate(rows, 1):
              if time.time() - t0 > 700:
                  print(f"  …시간이 다 됐다({n-1}/{len(rows)})")
                  break
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(r["doc"], headers=H),
                          timeout=20) as f:
                      pdf = f.read()
              except Exception:
                  fail["받기실패"] += 1
                  continue
              try:
                  res = montable.read(pdf, r["date"], 12, r["title"])
              except Exception as e:
                  fail["터짐:" + type(e).__name__] += 1
                  continue
              if not res:
                  fail["못읽음"] += 1
                  continue
              rec = got.setdefault(r["code"], {"name": r["name"], "m": {}})
              for x in res["rows"]:
                  rec["m"][x["period"]] = x
              rec["lab"] = res.get("amount_label", "")
              rec["ylab"] = res.get("yoy_label", "")
              lab = (res.get("amount_label", "") or "") + (res.get("yoy_label", "") or "")
              if BAD.search(lab):
                  print(f"  ‼ 매출이 아닌 것 같다: {r['code']} {r['name']} "
                        f"lab={res.get('amount_label')!r} ylab={res.get('yoy_label')!r}")
              if r["code"] not in had and shown < 22:
                  shown += 1
                  print(f"\n── 새로 읽힘 {r['code']} {r['name']} · {r['title'][:44]}")
                  print(f"   금액이름표={res.get('amount_label')!r} "
                        f"전년비이름표={res.get('yoy_label')!r}")
                  for x in res["rows"][:14]:
                      print(f"     {x['period']}  rev={x.get('rev')}  "
                            f"yoy={x.get('yoy')}  unit={x.get('unit','')}")

          months = sum(len(v["m"]) for v in got.values())
          print("\n" + "=" * 72)
          print(f"  전:  종목 {len(had)} · 달 {old['months']}")
          print(f"  후:  종목 {len(got)} · 달 {months}")
          print(f"  새로 들어온 종목 {len(set(got) - had)}")
          print(f"  없어진 종목 {sorted(had - set(got))}")
          for k, v in fail.most_common():
              print(f"  {k}: {v}")
          EOF
