# 새 소스를 붙이기 전에 응답 생김새를 눈으로 본다.
#
# 여기서 확인되기 전에는 collect.yml 에 넣지 않는다. 모양을 짐작해서 짜 두면
# 조용히 0건이 되고, 그게 제일 나쁘다(캘린더가 "발표 없음"이라고 거짓말한다).
#
# 앞선 확인에서 stockanalysis 만 세 시장 다 200 을 줬다(WSJ·마켓워치 401,
# 인베스팅·IR뱅크 403, 가부탄 405). 이제 그 응답 속을 뜯어본다 —
# **분기를 몇 개나 주는가**가 관건이다. 야후는 4~5개가 한계였다.
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 stockanalysis — 분기를 몇 개나 주나
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": "application/json,*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, (e.read().decode("utf-8", "replace")[:300] if e.fp else "")
              except Exception as e:
                  return 0, str(e)

          def unflatten(arr):
              """SvelteKit __data.json 은 값 대신 배열 색인을 담는다. 되살린다."""
              memo = {}
              def walk(i, depth=0):
                  if not isinstance(i, int) or i < 0 or i >= len(arr) or depth > 40:
                      return i
                  if i in memo:
                      return memo[i]
                  memo[i] = None
                  v = arr[i]
                  if isinstance(v, dict):
                      out = {k: walk(x, depth+1) for k, x in v.items()}
                  elif isinstance(v, list):
                      out = [walk(x, depth+1) for x in v]
                  else:
                      out = v
                  memo[i] = out
                  return out
              return walk(0)

          def probe(label, url):
              code, txt = get(url)
              print(f"\n===== {label}  HTTP {code}  {len(txt):,}바이트")
              if code != 200:
                  print("  ", txt[:200]); return
              try:
                  body = json.loads(txt)
              except Exception as e:
                  print("  JSON 아님:", e); return
              nodes = body.get("nodes") or []
              for n in nodes:
                  if not isinstance(n, dict) or n.get("type") != "data":
                      continue
                  arr = n.get("data")
                  if not isinstance(arr, list):
                      continue
                  tree = unflatten(arr)
                  # 재무 표가 어디 있는지 찾는다: 키 이름을 훑어본다.
                  def find(o, path="", depth=0):
                      if depth > 6: return
                      if isinstance(o, dict):
                          keys = list(o)
                          if any(k in ("revenue","financialData","data","income") for k in keys):
                              print(f"  {path or '.'} 키({len(keys)}): {keys[:14]}")
                          for k in keys[:40]:
                              find(o[k], f"{path}.{k}", depth+1)
                      elif isinstance(o, list) and o and depth <= 3:
                          find(o[0], f"{path}[0]", depth+1)
                  find(tree)
                  # 분기 라벨처럼 보이는 문자열을 센다
                  s = json.dumps(tree, ensure_ascii=False)
                  qs = sorted(set(re.findall(r'"(Q[1-4] \d{4})"', s)))
                  ds = sorted(set(re.findall(r'"(20\d\d-\d\d-\d\d)"', s)))
                  if qs: print(f"  분기 라벨 {len(qs)}개: {qs[:6]} … {qs[-3:]}")
                  if ds: print(f"  날짜 {len(ds)}개: {ds[:4]} … {ds[-3:]}")

          for label, url in [
            ("도요타 7203 분기", "https://stockanalysis.com/quote/tyo/7203/financials/__data.json?p=quarterly"),
            ("텐센트 0700 분기", "https://stockanalysis.com/quote/hkg/0700/financials/__data.json?p=quarterly"),
            ("SEA 분기",        "https://stockanalysis.com/stocks/se/financials/__data.json?p=quarterly"),
          ]:
              probe(label, url)
          PY
