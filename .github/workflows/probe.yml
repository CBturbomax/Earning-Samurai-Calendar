# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 62차 — 새 수집기를 **실제로 돌려 본다**(여기서는 커밋하지 않는다).
      # 몇 종목·몇 달이 들어오나, 브랜드를 잘못 이은 것은 없나 눈으로 본다.
      - name: 🏬 流通ニュース 수집기 시운전 (62차)
        timeout-minutes: 14
        env:
          WEB_PER_RUN: '220'
          WEB_SECS: '540'
          WEB_DEEP: '14'
        run: |
          set -o pipefail
          python monweb.py
          python scrape_mon_web.py
          python - <<'EOF'
          import json
          d = json.load(open("data/monthly_web_jp.json"))
          codes = d["codes"]
          caps = json.load(open("data/caps.json"))
          C = caps.get("caps") or caps
          have = {r["code"] for r in json.load(
              open("data/monthly_jp.json"))["rows"]}

          def cap(c):
              v = C.get("jp:" + c)
              return (v.get("cap") if isinstance(v, dict) else v) or 0

          print(f"\n종목 {d['companies']} · 달 {d['months']} · "
                f"본 기사 {len(d['done'])} · 거슬러 간 쪽 {d['deep']} "
                f"{'(끝까지)' if d.get('deep_done') else ''}")
          rows = sorted(codes.items(), key=lambda kv: -cap(kv[0]))
          print(f"우리 목록에 없던 회사 {sum(1 for c in codes if c not in have)}")
          for c, v in rows:
              ms = sorted(v["months"])
              gap = ""
              if len(ms) > 1:
                  n = [int(x[:4]) * 12 + int(x[5:]) for x in ms]
                  if max(n) - min(n) + 1 != len(n):
                      gap = " ⚠띄엄띄엄"
              print(f"\n{c} {v['name'][:22]} [{v['brand']}] "
                    f"{cap(c):.2f}조원 {'새' if c not in have else '겹침'}{gap}")
              print("   " + " ".join(
                  f"{m[2:]}:{v['months'][m].get('same','-')}/"
                  f"{v['months'][m].get('all','-')}" for m in ms[-14:]))
          EOF
