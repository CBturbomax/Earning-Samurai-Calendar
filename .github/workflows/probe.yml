# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      EDINETDB_KEY: ${{ secrets.EDINETDB_KEY }}
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 31차 — HSBC·AZN 은 부문 행이 0건이다. 29-B 에서 HSBC 의 주력 매출
      # 항목이 `RevenueAndOperatingIncome` 이라 우리 REV_TAGS 에 없는 것이
      # 드러났다. 그렇다면 다른 IFRS 회사도 제 이름을 쓸 것이다 — **부문답게
      # 생긴 축에 걸린 숫자 항목을 REV_TAGS 로 거르지 말고 전부** 찍어, 무엇을
      # 목록에 더해야 하는지 이름으로 확인한다. 짐작으로 태그를 늘리지 않는다.
      - name: 🌏 IFRS 부문 축의 숫자 항목 전수 (31차)
        timeout-minutes: 10
        run: |
          python - <<'EOF'
          import io, re
          from collections import Counter
          import xml.etree.ElementTree as ET
          import scrape_seg_sec as ss
          from scrape_seg_edgar import get, instance_url, local, strip_member
          from scrape_seg_fpi import xbrl_filings
          SEGISH = re.compile(r"Segment|Business|Operating|ProductOrService|Geograph", re.I)
          cikmap = ss.cik_map()
          for sym in ("HSBC", "AZN", "NVS", "SHEL"):
              cik = ss.cik_of(cikmap, sym)
              print(f"\n===== {sym} CIK {cik}")
              for acc, filed, form in xbrl_filings(cik)[:2]:
                  url = instance_url(cik, acc)
                  if not url:
                      print(f"   {filed} {form}: 인스턴스 없음"); continue
                  blob = get(url, timeout=150)
                  if not blob:
                      continue
                  ctx = {}
                  for ev, el in ET.iterparse(io.BytesIO(blob), events=("end",)):
                      if local(el.tag) == "context":
                          cid, dims = el.get("id"), []
                          for m in el.iter():
                              if local(m.tag) == "explicitMember":
                                  a = ss.norm_axis(m.get("dimension") or "")
                                  v = strip_member((m.text or "").strip())
                                  if a and v:
                                      dims.append((a, v))
                          if cid and any(SEGISH.search(a) for a, _ in dims):
                              ctx[cid] = dims
                      el.clear()
                  tags = Counter()
                  members = Counter()
                  for ev, el in ET.iterparse(io.BytesIO(blob), events=("end",)):
                      cr = el.get("contextRef")
                      if cr and cr in ctx:
                          txt = (el.text or "").strip().replace(",", "")
                          if re.fullmatch(r"-?\d+(\.\d+)?", txt or ""):
                              tags[local(el.tag)] += 1
                              for a, v in ctx[cr]:
                                  if SEGISH.search(a):
                                      members[f"{a}={v}"] += 1
                      el.clear()
                  print(f"   {filed} {form} · 부문류 문맥 {len(ctx)}")
                  print("      숫자 항목(상위 12):")
                  for t, c in tags.most_common(12):
                      mark = " ★이미목록" if t in ss.REV_RANK else ""
                      print(f"         {t[:58]:60s} {c:>4}{mark}")
                  print("      멤버(상위 8):", [m for m, _ in members.most_common(8)])
          EOF
