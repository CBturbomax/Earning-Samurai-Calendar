# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 49차 — 밀린 264건을 다 훑었는데 표를 찾은 것이 29건뿐이다(20개사).
      # **왜 못 찾았는지는 짐작하지 말고 본다.** 실패한 공시에서 '月' 이 든 줄을
      # 그대로 찍어, 달 이름표가 어떤 꼴로 오는지 눈으로 고른다. 지금 규칙은
      # 「8月」·「8月度」 처럼 **칸 하나가 통째로 달**일 때만 머리로 보는데,
      # 「2026年8月」 이나 세로로 선 표는 그 규칙에 안 걸린다.
      - name: 🗾 월매출 — 표를 못 찾은 공시의 생김새 (49차)
        timeout-minutes: 13
        run: |
          python - <<'EOF'
          import json, re, time, urllib.request, urllib.error, gzip
          from collections import Counter
          import pdftext, montable

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")

          def get(url, timeout=40):
              h = {"User-Agent": UA, "Accept": "*/*", "Accept-Encoding": "gzip"}
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers=h), timeout=timeout) as r:
                      raw = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      return r.status, raw
              except Exception as e:
                  return str(e)[:40], b""

          nums = json.load(open("data/monthly_nums_jp.json", encoding="utf-8"))
          bad = {u for u, why in (nums.get("skip") or {}).items() if why == "표없음"}
          rows = json.load(open("data/monthly_jp.json", encoding="utf-8"))["rows"]
          pick, seen = [], set()
          for r in sorted(rows, key=lambda r: r["date"], reverse=True):
              if r.get("doc") in bad and r["code"] not in seen:
                  seen.add(r["code"]); pick.append(r)
              if len(pick) >= 26:
                  break
          print(f"표 못 찾은 공시 {len(bad)}건 중 {len(pick)}건을 본다\n")

          MONTHCELL = re.compile(r"^\(?(\d{1,2})月(度|分|期)?\)?$")
          ANYMONTH = re.compile(r"\d{1,2}\s*月")
          why = Counter()
          for r in pick:
              st, data = get(r["doc"])
              if st != 200:
                  why["받기실패"] += 1; continue
              try:
                  table = pdftext.extract_cells(data, 8)
              except Exception:
                  why["터짐"] += 1; continue
              if not table:
                  why["글자0"] += 1
                  print(f"── {r['code']} {r['title'][:36]}\n     글자가 아예 안 나온다")
                  continue
              cand = []
              for cells in table:
                  k = sum(1 for _x, t in cells if MONTHCELL.match(
                      montable._norm(t)))
                  if k:
                      cand.append((k, cells))
              hits3 = [c for c in cand if c[0] >= 3]
              tag = "머리후보있음" if hits3 else ("달칸1~2개" if cand else "달칸없음")
              why[tag] += 1
              print(f"── {r['code']} {r['title'][:34]} · 줄 {len(table)} · {tag}")
              shown = 0
              for cells in table:
                  line = " | ".join(t for _x, t in cells)
                  if ANYMONTH.search(montable._norm(line)) and shown < 4:
                      print(f"     [{len(cells):2d}칸] {line[:130]}")
                      shown += 1
              time.sleep(0.12)
          print()
          print("까닭:", dict(why))
          EOF
