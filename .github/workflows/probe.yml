# 소스가 GitHub 러너에서 실제로 열리는지, 응답이 어떻게 생겼는지 확인한다.
#
# 수집 워크플로가 한 시장에서 몇 시간씩 붙들려 있으면 원인을 알 수가 없다.
# 스크래퍼의 백오프는 '잠깐 막힌 것'을 견디려는 장치인데, 아예 주소가 틀렸거나
# 차단된 상대에게는 그냥 시간만 태운다. 그 둘을 구분하려고 둔다.
#
# 지금 상태: 미국·일본은 확인 완료. 홍콩은 HKEX 이사회 캘린더 경로가 통째로
# 404 라 대체 소스의 구조를 뜯어보는 중이다.

name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 🇭🇰 HKEX 통계 페이지가 실제로 내놓는 목록
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          curl -sS --max-time 25 -L -H "User-Agent: $UA" \
            'https://www.hkex.com.hk/Market-Data/Statistics/Consolidated-Reports?sc_lang=en' -o idx.html \
            -w 'HTTP %{http_code} / %{size_download}바이트\n'
          echo '--- Consolidated-Reports 아래 링크들 ---'
          grep -oE 'href="[^"]*Consolidated-Reports[^"]*"' idx.html | sort -u | head -30
          echo '--- 이사회/실적 관련 낱말 ---'
          grep -oiE '(board[ -]?meeting|results announcement|業績|董事會)[^"<]{0,30}' idx.html | sort -u | head -10 || echo '(없음)'

      - name: 🇭🇰 AAStocks 실적발표 캘린더 구조
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          curl -sS --max-time 25 -L -H "User-Agent: $UA" \
            'https://www.aastocks.com/en/stocks/market/company-results.aspx' -o aa.html \
            -w 'HTTP %{http_code} / %{size_download}바이트\n'
          echo '--- 표 헤더 ---'
          python3 - <<'PY'
          import re, html
          t = open('aa.html', encoding='utf-8', errors='replace').read()
          # 표를 찾아 앞쪽 행 몇 개를 셀 단위로 찍는다
          for ti, tbl in enumerate(re.findall(r'<table.*?</table>', t, re.S)[:6]):
              rows = re.findall(r'<tr.*?</tr>', tbl, re.S)
              if len(rows) < 3:
                  continue
              print(f"[표 {ti}] {len(rows)}행")
              for r in rows[:4]:
                  cells = [html.unescape(re.sub(r'<[^>]+>', ' ', c)).strip()
                           for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)]
                  cells = [c for c in cells if c]
                  if cells:
                      print('   ', ' | '.join(cells)[:200])
              print()
          # 종목코드처럼 보이는 것과 날짜 형식 확인
          print('코드 후보:', re.findall(r'\b\d{5}\b', t)[:12])
          print('날짜 후보:', re.findall(r'\d{4}/\d{2}/\d{2}|\d{2}/\d{2}/\d{4}', t)[:12])
          PY

      - name: 🇭🇰 HKEXnews 이사회 공시 검색 API
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          # t2code 40100 = Date of Board Meeting (공시 분류)
          U='https://www1.hkexnews.hk/search/titleSearchServlet.do?sortDir=0&sortByOptions=DateTime&category=0&market=SEHK&stockId=-1&documentType=-1&fromDate=20260801&toDate=20260831&title=&searchType=1&t1code=40000&t2Gcode=-2&t2code=40100&rowRange=20&lang=EN'
          curl -sS --max-time 25 -L -H "User-Agent: $UA" -H 'Accept: application/json, */*' \
            "$U" -o news.json -w 'HTTP %{http_code} / %{size_download}바이트\n'
          echo '--- 앞 900자 ---'; head -c 900 news.json; echo
