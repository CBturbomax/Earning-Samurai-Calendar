# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 38차 — 37차에서 테스트 7종목 중 7685 만 잡혔다. 나머지 여섯이
      # **TDnet 에 월차를 아예 안 내는 것**인지, 내가 훑은 9영업일 밖이라 그런
      # 것인지 가른다(45일 = TDnet 보존창 전체). 겸사겸사 물음 둘 더:
      #   · 45일 창에서 월차를 내는 회사가 실제로 몇 곳인가(우주 크기)
      #   · 첨부 PDF 에서 표준 라이브러리만으로 숫자를 뽑을 수 있나
      - name: 🗾 월차 우주 크기 + PDF 숫자 (38차)
        timeout-minutes: 12
        run: |
          python - <<'EOF'
          import re, time, zlib, urllib.request, urllib.error
          from collections import Counter, defaultdict
          from datetime import date, timedelta

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          LIST = "https://www.release.tdnet.info/inbs/I_list_{p:03d}_{d}.html"
          ROW = re.compile(
              r'<td class="[^"]*kjTime"[^>]*>(?P<time>[^<]*)</td>\s*'
              r'<td class="[^"]*kjCode"[^>]*>(?P<code>[^<]*)</td>\s*'
              r'<td class="[^"]*kjName"[^>]*>(?P<name>[^<]*)</td>\s*'
              r'<td class="[^"]*kjTitle"[^>]*>(?P<cell>.*?)</td>', re.S)
          HREF = re.compile(r'href="([^"]+)"')
          TAGS = re.compile(r"<[^>]+>")

          def get(url, timeout=40):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": "*/*", "Accept-Language": "ja,en;q=0.8"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.read()
              except urllib.error.HTTPError:
                  return None

          WIDE = re.compile(r"月次|月別|売上速報|既存店|全店|営業[速概]報|月商|月例")
          WATCH = {"3093", "3046", "3563", "4680", "6036", "9843"}

          days = []
          d = date(2026, 9, 18)
          while len(days) < 30:
              if d.weekday() < 5:
                  days.append(d.strftime("%Y%m%d"))
              d -= timedelta(days=1)
          days.reverse()

          monthly = defaultdict(list)      # code -> [(day, time, title)]
          watch_any = defaultdict(list)    # 관심 6종목의 **모든** 공시
          gone = []
          first_pdf = None
          for day in days:
              page, n = 1, 0
              while page <= 40:
                  body = get(LIST.format(p=page, d=day))
                  if body is None:
                      if page == 1:
                          gone.append(day)
                      break
                  rows = list(ROW.finditer(body.decode("utf-8", "replace")))
                  if not rows:
                      break
                  n += len(rows)
                  for m in rows:
                      g = m.groupdict()
                      title = TAGS.sub("", g["cell"]).replace("\u3000", " ").strip()
                      code = g["code"].strip()[:4]
                      if WIDE.search(title):
                          monthly[code].append((day, g["time"].strip(), title[:44]))
                          if first_pdf is None and code == "7685":
                              h = HREF.search(g["cell"])
                              if h:
                                  first_pdf = h.group(1)
                      if code in WATCH:
                          watch_any[code].append((day, title[:52]))
                  page += 1
                  time.sleep(0.35)
          print(f"훑은 날 {len(days)} · TDnet 이 안 주는 날 {len(gone)}: {gone[:6]}")

          n_ev = sum(len(v) for v in monthly.values())
          print(f"\n== 월차 공시 {n_ev}건 · 낸 회사 {len(monthly)}곳")
          rep = {c: v for c, v in monthly.items() if len(v) >= 2}
          print(f"   그중 두 번 이상 낸 회사 {len(rep)}곳 (달마다 내는 회사)")

          print("\n-- 관심 6종목이 45일간 TDnet 에 낸 공시 --")
          for c in sorted(WATCH):
              evs = watch_any.get(c, [])
              print(f"  {c}: 전체 {len(evs)}건 · 월차낌새 {len(monthly.get(c, []))}건")
              for day, t in evs[:6]:
                  print(f"      {day} {t}")

          print("\n-- 월차를 가장 자주 낸 회사 12곳 --")
          for c, v in sorted(monthly.items(), key=lambda kv: -len(kv[1]))[:12]:
              print(f"  {c} {len(v)}건 | {v[-1][2]}")

          # PDF 에서 표준 라이브러리로 글자를 뽑을 수 있나
          if first_pdf:
              url = "https://www.release.tdnet.info/inbs/" + first_pdf
              blob = get(url, timeout=60)
              print(f"\n-- PDF 숫자 뽑기 시험: {url} ({len(blob):,}바이트)")
              streams = re.findall(rb"stream\r?\n(.*?)endstream", blob, re.S)
              print(f"   stream {len(streams)}개")
              text, ok = [], 0
              for st in streams:
                  try:
                      raw = zlib.decompress(st.strip(b"\r\n"))
                  except zlib.error:
                      continue
                  ok += 1
                  text.append(raw)
              print(f"   zlib 로 풀린 stream {ok}개")
              joined = b"".join(text)
              shown = re.findall(rb"\((?:[^()\\]|\\.)*\)", joined)[:30]
              print(f"   괄호 문자열 {len(re.findall(rb'\((?:[^()\\]|\\.)*\)', joined))}개 · 앞 30:")
              for s in shown:
                  print("      ", s[:60])
              print(f"   ToUnicode CMap 있나: {b'ToUnicode' in blob}")
          EOF

      # 37차 — TDnet 목록에 **월차(月次)** 가 어떤 모습으로 오나.
      # 물음 넷:
      #   1) 제목이 어떻게 생겼나 · 몇 건이나 되나
      #   2) 첨부 링크(href)가 목록 줄에 같이 오나 — 지금 파서는 버린다
      #   3) 테스트 7종목이 실제로 잡히나
      #   4) 첨부가 PDF 인가 HTML 인가 (숫자 뽑기 가능성)
      - name: 🗾 TDnet 월차 공시 떠보기 (37차)
        timeout-minutes: 12
        run: |
          python - <<'EOF'
          import re, time, urllib.request, urllib.error
          from collections import Counter
          from datetime import date, timedelta

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          LIST = "https://www.release.tdnet.info/inbs/I_list_{p:03d}_{d}.html"
          # 지금 쓰는 정규식에 href 를 더 잡게 넓힌 것
          ROW = re.compile(
              r'<td class="[^"]*kjTime"[^>]*>(?P<time>[^<]*)</td>\s*'
              r'<td class="[^"]*kjCode"[^>]*>(?P<code>[^<]*)</td>\s*'
              r'<td class="[^"]*kjName"[^>]*>(?P<name>[^<]*)</td>\s*'
              r'<td class="[^"]*kjTitle"[^>]*>(?P<cell>.*?)</td>', re.S)
          HREF = re.compile(r'href="([^"]+)"')
          TAGS = re.compile(r"<[^>]+>")
          SECT = re.compile(r"^[ＰＳＧＥEPSG][－\-]\s*")

          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": "*/*", "Accept-Language": "ja,en;q=0.8"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.read(), r.status, r.headers.get("Content-Type", "")
              except urllib.error.HTTPError as e:
                  return None, e.code, ""

          # 월차로 보이는 제목을 넓게 잡아 본다 — 좁히는 건 실물을 보고 한다
          WIDE = re.compile(r"月次|月別|売上速報|既存店|全店|営業[速概]報|月商")
          TEST = {"7685", "3093", "3046", "3563", "4680", "6036", "9843"}

          days = []
          d = date(2026, 9, 18)
          while len(days) < 9:
              if d.weekday() < 5:
                  days.append(d.strftime("%Y%m%d"))
              d -= timedelta(days=1)

          hits, titles, by_code, hrefs = 0, Counter(), Counter(), []
          total_rows = 0
          for day in days:
              page, nrow = 1, 0
              while page <= 40:
                  body, st, _ = get(LIST.format(p=page, d=day))
                  if body is None:
                      break
                  txt = body.decode("utf-8", "replace")
                  rows = list(ROW.finditer(txt))
                  if not rows:
                      break
                  nrow += len(rows)
                  for m in rows:
                      g = m.groupdict()
                      title = TAGS.sub("", g["cell"]).replace("　", " ").strip()
                      code = g["code"].strip()[:4]
                      if not WIDE.search(title):
                          continue
                      hits += 1
                      titles[title[:46]] += 1
                      by_code[code] += 1
                      h = HREF.search(g["cell"])
                      if len(hrefs) < 8 and h:
                          hrefs.append((code, SECT.sub("", TAGS.sub("", g["name"]).strip()),
                                        g["time"].strip(), title[:50], h.group(1)))
                  page += 1
                  time.sleep(0.4)
              total_rows += nrow
              print(f"{day}: 줄 {nrow}", flush=True)

          print(f"\n== 전체 {total_rows}줄 중 월차 낌새 {hits}건")
          print("\n-- 제목 상위 25 --")
          for t, c in titles.most_common(25):
              print(f"  {c:3d}  {t}")
          print(f"\n-- 월차를 낸 종목 {len(by_code)}개 · 상위 15 --")
          print("  ", dict(by_code.most_common(15)))
          print(f"\n-- 테스트 7종목 중 잡힌 것: {sorted(TEST & set(by_code))}")
          print(f"   못 잡은 것: {sorted(TEST - set(by_code))}")

          print("\n-- 첨부 링크 생김새 --")
          for c, n, t, ti, h in hrefs:
              print(f"  {c} {n[:14]:16s} {t} | {ti}")
              print(f"      href={h}")

          # 첨부 하나를 실제로 받아 본다
          if hrefs:
              h = hrefs[0][4]
              url = h if h.startswith("http") else "https://www.release.tdnet.info/inbs/" + h
              body, st, ct = get(url, timeout=60)
              print(f"\n-- 첨부 받기: {url}")
              print(f"   HTTP {st} · {ct} · {len(body) if body else 0:,}바이트")
              if body:
                  print(f"   머리 16바이트: {body[:16]!r}")
          EOF
