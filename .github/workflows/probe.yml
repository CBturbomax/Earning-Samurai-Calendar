# 새 소스를 붙이기 전에 응답 생김새를 눈으로 본다.
#
# 지금 볼 것: **사업부별 매출(세그먼트)**.
# SEC 의 companyfacts/companyconcept 는 부문 축(dimension)을 떨어뜨리고 연결
# 합계만 준다 — 그래서 거기서는 부문별을 못 뽑는다. stockanalysis 에는
# revenue-by-segment 페이지가 따로 있으니 그 응답을 뜯어본다.
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧩 사업부별 매출 — 수집기가 실제로 뽑아내는가
        continue-on-error: true
        run: python scrape_fin_seg.py --probe
