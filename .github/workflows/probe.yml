# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 7차 — 동화순이 뚫렸다. 主营构成分析 표의 실제 생김새(기간·축·단위)를 뜯어본다.
      - name: 🇭🇰 동화순 주영구성 표 뜯어보기 (7차)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                "Accept": "*/*"}

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", "replace")

          for code in ("HK0700", "HK9992", "HK3093"):
              try:
                  body = get(f"https://basic.10jqka.com.cn/{code}/operate.html")
              except Exception as e:
                  print(f"\n===== {code} 실패 {e}"); continue
              i = body.find('id="income"')
              if i < 0:
                  print(f"\n===== {code}  income 섹션 없음 ({len(body):,}B)"); continue
              chunk = body[i:i+9000]
              # 표를 읽기 좋게 — 태그 사이에 구분자
              txt = re.sub(r"</(td|th|tr)>", " | ", chunk)
              txt = re.sub(r"<[^>]+>", " ", txt)
              txt = re.sub(r"\s+", " ", txt)
              print(f"\n===== {code}  전체 {len(body):,}B · income부터 {len(chunk):,}B")
              print(txt[:3600])
          EOF
