# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧩 SEC 벌크로 부문별 매출 전 종목 받기
        timeout-minutes: 15
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
          SEG_SEC_QUARTERS: '12'
        run: python scrape_seg_sec.py

      - name: 받아온 것 들여다보기
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          d = json.loads(Path("data/segments_sec.json").read_text(encoding="utf-8"))
          st = d["stocks"]
          print(f"종목 {len(st):,}  분기 {d['zips'][0]}~{d['zips'][-1]}")
          per = {}
          for r in st.values():
              per[r["axis"]] = per.get(r["axis"], 0) + 1
          print("축:", per)
          n = sorted(len(r["pts"]) for r in st.values())
          print(f"분기 수  중앙값 {n[len(n)//2]}  최소 {n[0]}  최대 {n[-1]}")

          for sym in ("AAPL","MSFT","AMD","NVDA","RKLB","KO","WM","JCI","COST","ORCL","LMT","PG"):
              r = st.get(sym)
              print(f"\n===== {sym}")
              if not r:
                  print("  부문 자료 없음"); continue
              print(f"  [{r['axis']}] {r['names']}")
              print(f"  분기 {len(r['pts'])}개  {r['pts'][0][0]} ~ {r['pts'][-1][0]}")
              for row in r["pts"][-3:]:
                  print("   ", row[0], [f"{v/1e6:,.0f}M" if v else "-" for v in row[1:]])

          # 총매출과 대보기 — build.py 의 seg_fit 이 몇 종목을 뺄지 미리 본다
          fin = json.loads(Path("data/financials.json").read_text(encoding="utf-8"))["stocks"]
          ok = bad = nofin = 0
          for sym, r in st.items():
              f = fin.get(sym) or {}
              rev = {p["end"]: p["rev"] for p in f.get("points") or [] if p.get("rev")}
              import datetime as dt
              rs = []
              for row in r["pts"]:
                  d0 = dt.date.fromisoformat(row[0])
                  hit = [v for e, v in rev.items()
                         if abs((dt.date.fromisoformat(e) - d0).days) <= 20]
                  if hit:
                      rs.append(sum(v or 0 for v in row[1:]) / hit[0])
              if len(rs) < 4: nofin += 1; continue
              rs.sort(); med = rs[len(rs)//2]
              lo, hi = rs[len(rs)//10], rs[-1-len(rs)//10]
              if med > 1.25 and hi - lo < 1.0: bad += 1
              else: ok += 1
          print(f"\n총매출 대보기: 통과 {ok:,} · 부풀어 뺌 {bad:,} · 대볼 총매출 없음 {nofin:,}")
          EOF

      - name: 페이지 다시 만들어 보기
        run: python build.py | tail -20

      # 일본에도 같은 길이 있는지. 결산단신 **첨부**에 부문별 매출이 태그돼
      # 있는지 원문으로 본다 — 요약에는 확실히 없다.
      - name: 🇯🇵 결산단신 첨부에 부문 정보가 있는가
        continue-on-error: true
        timeout-minutes: 5
        env:
          JP_BACK_DAYS: '8'
        run: python scrape_fin_jp.py --seg 6758 7203 8035 9432
