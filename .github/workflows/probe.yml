# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
#
# **dispatch 전용이다.** EDINET DB 무료 키가 하루 100건이라, push 로도 걸려
# 있으면 파일을 고칠 때마다 예산이 새어 나간다. 손으로 한 번만 돌린다.
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      EDINETDB_KEY: ${{ secrets.EDINETDB_KEY }}
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 36차 — 35차에서 `?period=quarterly` 가 분기를 준다는 것까지 확인했다
      # (아식스 223행 · quarter 칸 · valueBasis=ytd). 이제 **값을 눈으로 본다** —
      # 35차는 220자에서 잘라 찍는 바람에 정작 quarter·revenue 가 안 보였다.
      # 새 수집기의 --probe 를 그대로 쓴다(예산 1건).
      - name: 🗾 아식스 분기 부문 원문 (36차 · 예산 1건)
        timeout-minutes: 8
        run: python scrape_seg_jp_edinetdb.py --probe
