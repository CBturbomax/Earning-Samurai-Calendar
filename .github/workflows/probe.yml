# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 80차 — 세로 표 읽기 + 갈라진 달 머리줄 A/B.
      # 79차에서 못 읽은 공시의 꼴을 봤다: 3093 은 달이 세로, 2678(ASKUL)은
      # 「6」과 「月」이 다른 칸으로 갈라져 머리줄을 못 알아봤다. 둘을 고쳤으니
      # 같은 공시에 옛 판과 나란히 돌려 잃는 것이 없는지 본다.
      - name: ⚖ 세로 표 A/B (80차)
        timeout-minutes: 14
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:montable.py > /tmp/old_montable.py
          python - <<'EOF'
          import importlib.util, json, sys, time, urllib.request
          import montable

          spec = importlib.util.spec_from_file_location("old_montable",
                                                        "/tmp/old_montable.py")
          old = importlib.util.module_from_spec(spec)
          sys.modules["old_montable"] = old
          spec.loader.exec_module(old)

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          n = json.load(open("data/monthly_nums_jp.json", encoding="utf-8"))
          mon = json.load(open("data/monthly_jp.json", encoding="utf-8"))
          info = {r.get("doc"): r for r in (mon.get("rows") or [])}

          bad = [u for u, why in n["skip"].items() if why == "표없음"]
          good = list(n["done"])
          docs = bad[:55] + good[:40]
          print(f"표없음 {len(bad[:55])}건 + 잘 읽히던 {len(good[:40])}건")

          tot = {"old": [0, 0], "new": [0, 0]}
          diffs = []
          for u in docs:
              r = info.get(u) or {}
              try:
                  raw = urllib.request.urlopen(
                      urllib.request.Request(u, headers=UA), timeout=30).read()
              except Exception as e:
                  print("!!", u[-18:], type(e).__name__, getattr(e, "code", ""))
                  continue
              time.sleep(0.35)
              got, first = {}, {}
              for tag, mod in (("old", old), ("new", montable)):
                  try:
                      res = mod.read(raw, r.get("date", "2026-09-01"),
                                     title=r.get("title", ""))
                  except Exception as e:
                      print("  ! 터짐", tag, u[-18:], type(e).__name__,
                            str(e)[:40])
                      res = None
                  rows = (res or {}).get("rows") or []
                  got[tag] = len(rows)
                  first[tag] = rows[0] if rows else None
                  if rows:
                      tot[tag][0] += 1
                      tot[tag][1] += len(rows)
              if got["old"] != got["new"]:
                  diffs.append((r.get("code", "?"), got["old"], got["new"],
                                (r.get("title") or "")[:30], first["new"]))
              elif got["old"] and first["old"] != first["new"]:
                  print(f"  △ 값이 바뀌었다 {r.get('code')} "
                        f"{first['old']} -> {first['new']}")
          print(f"\n옛 판: 읽힌 공시 {tot['old'][0]} · 달 {tot['old'][1]}")
          print(f"새 판: 읽힌 공시 {tot['new'][0]} · 달 {tot['new'][1]}")
          print(f"\n달라진 공시 {len(diffs)}건 (줄어든 것이 먼저)")
          for code, a, b, ti, f in sorted(diffs, key=lambda x: x[2] - x[1]):
              print(f"   {code}  {a} -> {b}   {ti}   {f}")
          EOF
