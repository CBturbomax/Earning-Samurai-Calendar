# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 홍콩 부문별 매출을 주는 소스 찾기. stockanalysis 는 quote 주소로도
      # 404였다(부문 페이지는 SEC 서류로 만드는 것이라 미국뿐). 중화권 리테일
      # 포털들이 F10 '主營構成'(사업 구성)을 싣는다 — 어느 것이 기계로 읽히는지 떠본다.
      - name: 🇭🇰 홍콩 부문 매출 소스 떠보기
        timeout-minutes: 8
        run: |
          python - <<'EOF'
          import json, urllib.request, urllib.error

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                "Accept": "*/*"}

          def hit(name, url, referer=""):
              h = dict(UA)
              if referer:
                  h["Referer"] = referer
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read()
                      print(f"\n===== {name}  {r.status}  {len(body):,}B")
                      txt = body.decode("utf-8", "replace")
                      print(txt[:700].replace("\n", " ")[:700])
              except urllib.error.HTTPError as e:
                  print(f"\n===== {name}  HTTP {e.code}")
              except Exception as e:
                  print(f"\n===== {name}  실패 {e}")

          # 1) 이스트머니 datacenter — HK F10 주영구성. 무인증 JSON 이면 최고다.
          for rn in ("RPT_HKF10_FN_MAINOP", "RPT_HKF10_INCOME_MAINOP",
                     "RPT_HKF10_MAIN_OPERATION"):
              hit(f"eastmoney {rn}",
                  "https://datacenter.eastmoney.com/securities/api/data/v1/get"
                  f"?reportName={rn}&columns=ALL"
                  "&filter=(SECURITY_CODE%3D%2200700%22)&pageSize=20",
                  referer="https://emweb.eastmoney.com/")

          # 2) 텐센트 gu.qq — 수입 구성
          hit("gu.qq srgc", "https://gu.qq.com/hk00700/gp/srgc")
          hit("qq proxy f10", "https://proxy.finance.qq.com/ifzqgtimg/stock/corp/hkincome/getIncomeConst?symbol=hk00700")

          # 3) AAstocks 사업 실적 표
          hit("aastocks", "http://www.aastocks.com/en/stocks/analysis/company-fundamental/business-performance?symbol=00700")

          # 4) etnet 프로필 (Business Mix 표)
          hit("etnet", "https://www.etnet.com.hk/www/eng/stocks/realtime/quote_profile.php?code=700")

          # 5) futu 공개 페이지
          hit("futunn", "https://www.futunn.com/en/stock/00700-HK/company-profile")
          EOF
