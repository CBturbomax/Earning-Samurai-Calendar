# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EDINETDB_KEY: ${{ secrets.EDINETDB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 26차 — 승부처. 25차에서 문서에 period=quarterly(분기) 옵션이 있는 것을
      # 확인했다("annual (default) / quarterly / quarterly_standalone"). 세그먼트
      # 엔드포인트가 이 옵션을 받으면 정부 키 없이 분기 부문 이력 직행이다.
      # 쿼터를 아끼려고 **수동 실행(dispatch)일 때만** 돈다 — push 로는 안 돈다.
      # (오늘 429 — 일본 자정에 리셋되면 dispatch 한다. 요청 4건.)
      - name: 🇯🇵 세그먼트 분기 옵션 시험 (26차 · dispatch 전용)
        if: env.EDINETDB_KEY != '' && github.event_name == 'workflow_dispatch'
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import json, os, urllib.request, urllib.error
          KEY = os.environ["EDINETDB_KEY"]
          def get(url):
              h = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0",
                   "Accept": "application/json", "X-API-Key": KEY}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=40) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"
          B = "https://edinetdb.jp/v1"
          for url in (f"{B}/companies/E02378/segments?period=quarterly",
                      f"{B}/companies/E02378/segments?period=quarterly_standalone",
                      f"{B}/companies/E02378/financials?period=quarterly",
                      f"{B}/disclosures/search?company=E02378"):
              st, body = get(url)
              tag = url.split("/v1/")[-1]
              print(f"\n== {tag}  status={st}  {len(body):,}자")
              if st != 200:
                  print("   본문:", body[:250])
                  continue
              try:
                  j = json.loads(body)
              except ValueError:
                  print("   JSON 아님:", body[:200]); continue
              data = j.get("data") if isinstance(j, dict) else j
              meta = j.get("meta") if isinstance(j, dict) else None
              if isinstance(data, list):
                  print(f"   행 {len(data)}개 · meta={json.dumps(meta, ensure_ascii=False)[:150]}")
                  for r in data[:3]:
                      print("   행:", json.dumps(r, ensure_ascii=False)[:330])
                  if data:
                      print("   끝행:", json.dumps(data[-1], ensure_ascii=False)[:330])
              else:
                  print("   data:", json.dumps(data, ensure_ascii=False)[:400])
          EOF

      # 25차 — 분기 이력의 마지막 두 검증. 둘 다 키를 안 쓴다(오늘 EDINET DB
      # 쿼터가 429 라 키 쓰는 단계는 전부 걷어냈다).
      # (a) EDINET DB 공식 문서(120K자)에서 GET /v1/... 엔드포인트 전체를 긁어
      #     분기 문서번호(四半期報告書 docID)를 주는 문이 있는지 확정한다.
      # (b) 정부 창고는 pdf/{docID}.pdf 가 키 없이 열린다(23차 확인). 형제
      #     경로가 있는지 XBRL 후보 꼴을 체계적으로 마저 두드린다.
      - name: 🇯🇵 EDINET DB 전체 문 목록 + 창고 형제 경로 (25차)
        timeout-minutes: 7
        run: |
          python - <<'EOF'
          import gzip, re, urllib.request, urllib.error
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0",
                "Accept": "*/*", "Accept-Encoding": "gzip",
                "Accept-Language": "ja,en;q=0.8"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      b = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          b = gzip.decompress(b)
                      return r.status, b
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:200]
              except Exception as e:
                  return None, str(e).encode()

          # (a) 문서에서 엔드포인트 전수
          st, body = get("https://edinetdb.com/docs/api")
          t = body.decode("utf-8", "replace")
          t = re.sub(r"<[^>]+>", " ", t)
          eps = sorted(set(re.findall(r"GET\s+(/v1/[A-Za-z0-9_{}\-./]+)", t)))
          print(f"== 문서 status={st} · GET 엔드포인트 {len(eps)}개")
          for e in eps:
              print("   ", e)
          # docID·문서 관련 낱말 언저리
          for kw in ("doc_id", "docID", "quarterly", "四半期", "filings", "documents"):
              for m in list(re.finditer(kw, t))[:3]:
                  s = max(0, m.start() - 70)
                  cut = re.sub(r"\s+", " ", t[s:m.start() + 150]).strip()
                  print(f"   [{kw}] …{cut}…")

          # (b) 창고 형제 경로 — pdf 형(pdf/{did}.pdf)이 열리니 남은 후보를 다 본다
          did = "S10078HB"
          base = "https://disclosure2dl.edinet-fsa.go.jp/searchdocument"
          pats = [f"{base}/xbrl/{did}.pdf", f"{base}/xbrl/{did}.xbrl",
                  f"{base}/data/{did}.zip", f"{base}/file/{did}.zip",
                  f"{base}/download/{did}.zip", f"{base}/dl/{did}.zip",
                  f"{base}/1/{did}.zip", f"{base}/2/{did}.pdf",
                  f"{base}/type1/{did}.zip", f"{base}/{did}/{did}.zip",
                  f"{base}/{did}/xbrl.zip", f"{base}/zip/{did}/{did}.zip",
                  f"{base}/pdf/{did}",
                  f"https://disclosure2dl.edinet-fsa.go.jp/searchdocument/csv/{did}.csv",
                  f"https://disclosure2dl.edinet-fsa.go.jp/xbrl/{did}.zip",
                  f"https://disclosure2dl.edinet-fsa.go.jp/searchdocument/english/{did}.pdf"]
          print("\n== 창고 형제 경로")
          for p in pats:
              st, b = get(p)
              head = b[:4] if isinstance(b, bytes) else b""
              mark = " ★" if head[:2] in (b"PK", b"%P") else ""
              print(f"   {p.split('.jp/')[-1]:44s} status={st}  {len(b):,}B  머리={head}{mark}")
          # 디렉터리 존재 신호 — 파일명 없이 두드리면 403/404 가 갈리는지
          print("\n== 디렉터리 신호")
          for d in ("pdf", "xbrl", "zip", "csv", "data", "file"):
              st, b = get(f"{base}/{d}/")
              print(f"   {d}/  status={st}  {len(b):,}B")
          EOF
