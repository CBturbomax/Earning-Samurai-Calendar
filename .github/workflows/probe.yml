# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 6차 — 이스트머니 웹 F10 에는 주영구성 표가 없었다. 서버렌더 HTML 을 주는
      # 동화순(10jqka)과 쉐치우(xueqiu) F10 API, 이스트머니 앱 계열 이름을 떠본다.
      - name: 🇭🇰 홍콩 부문 매출 소스 떠보기 (6차)
        timeout-minutes: 8
        run: |
          python - <<'EOF'
          import json, re, urllib.request, http.cookiejar

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          opener.addheaders = [("User-Agent",
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "Chrome/124.0 Safari/537.36"), ("Accept", "*/*")]

          def get(url, timeout=25):
              with opener.open(url, timeout=timeout) as r:
                  return r.read().decode("utf-8", "replace")

          # ── 1) 동화순 basic F10 — A주는 서버렌더 표를 준다. 홍콩도 주나?
          for code in ("HK0700", "HK9992", "HK1810"):
              for page in ("operate.html", "company.html"):
                  url = f"https://basic.10jqka.com.cn/{code}/{page}"
                  try:
                      body = get(url)
                      hit = "主营" in body or "业务" in body
                      print(f"\n== 10jqka {code}/{page}  {len(body):,}B  주영구성:{hit}")
                      if hit:
                          i = body.find("主营")
                          print("  ", re.sub(r"\s+", " ", body[i-100:i+500])[:520])
                  except Exception as e:
                      print(f"\n== 10jqka {code}/{page} 실패 {e}")

          # ── 2) 쉐치우 F10 — 먼저 홈을 열어 쿠키(xq_a_token)를 받는다
          try:
              get("https://xueqiu.com/")
              for sym in ("00700", "09992"):
                  for path in (f"https://stock.xueqiu.com/v5/stock/f10/hk/business.json?symbol={sym}",
                               f"https://stock.xueqiu.com/v5/stock/f10/us/business.json?symbol={sym}"):
                      try:
                          body = get(path)
                          print(f"\n== xueqiu {path.split('/')[-1][:40]}  {body[:360]}")
                      except Exception as e:
                          print(f"\n== xueqiu {sym} 실패 {e}")
                      break
          except Exception as e:
              print("쉐치우 홈 실패:", e)

          # ── 3) 이스트머니 앱 계열 이름 무차별 — SECUCODE 필터 필수였다
          for rn in ("RPT_CUSTOM_HKF10_APP_MAINOP", "RPT_CUSTOM_HKF10_APPFN_MAINOP",
                     "RPT_CUSTOM_HKF10_APP_BUSINESS", "RPT_CUSTOM_HKF10_APPFN_MAINBUSINESS",
                     "RPT_CUSTOM_HKF10_APP_MAINDISTRIBUTION", "RPT_CUSTOM_HKF10_APPINCOME_CONSIST",
                     "RPT_HKF10_INCOME_CONSIST", "RPT_HKF10_FN_MAINOP_PC"):
              try:
                  body = get("https://datacenter.eastmoney.com/securities/api/data/v1/get"
                             f"?reportName={rn}&columns=ALL"
                             "&filter=(SECUCODE%3D%2200700.HK%22)&pageSize=6")
                  d = json.loads(body)
                  data = ((d.get("result") or {}).get("data")) or []
                  msg = d.get("message", "")
                  print(f"\n== {rn} 행{len(data)} {msg[:60]}")
                  if data:
                      print("   ", json.dumps(data[0], ensure_ascii=False)[:240])
              except Exception as e:
                  print(f"\n== {rn} 실패 {e}")
          EOF
