# 소스를 떠보는 자리. 결과만 probe-out 가지에 남기고 아무것도 커밋하지 않는다. **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 🔎 ai_fpi — 캐나다 회사 6-K 에서 실적 표를 왜 못 고르나(11/10)
        continue-on-error: true
        run: python tools/ai/probe_fpi.py 1017413:000101741319000025 1017413:000101741319000012 1017413:000101741319000002 2>&1 | grep -v '^  [a-z_0-9]*\.json' > /tmp/probe.txt
      - name: 결과를 probe-out 가지에
        if: always()
        run: |
          cd /tmp && rm -rf po && mkdir po && cd po && git init -q
          cp /tmp/probe.txt . ; git add . && git -c user.name=bot -c user.email=b@b commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
