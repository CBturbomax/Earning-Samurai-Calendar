# 새 소스를 붙이기 전에 응답 생김새를 눈으로 본다.
#
# 지금 볼 것: **사업부별 매출(세그먼트)**.
# SEC 의 companyfacts/companyconcept 는 부문 축(dimension)을 떨어뜨리고 연결
# 합계만 준다 — 그래서 거기서는 부문별을 못 뽑는다. stockanalysis 에는
# revenue-by-segment 페이지가 따로 있으니 그 응답을 뜯어본다.
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧩 사업부별 매출 — 받아지나
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          import scrape_fin_intl as si     # unflatten 을 그대로 쓴다

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": si.UA, "Accept": "application/json, text/plain, */*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, (e.read().decode("utf-8", "replace")[:200] if e.fp else "")
              except Exception as e:
                  return 0, str(e)

          def look(label, url):
              code, txt = get(url)
              print(f"\n===== {label}  HTTP {code}  {len(txt):,}B")
              if code != 200:
                  print("  ", txt[:180]); return
              try:
                  body = json.loads(txt)
              except Exception as e:
                  print("  JSON 아님:", e); return
              for node in body.get("nodes") or []:
                  if not isinstance(node, dict) or node.get("type") != "data":
                      continue
                  arr = node.get("data")
                  if not isinstance(arr, list):
                      continue
                  tree = si.unflatten(arr)

                  def walk(o, path="", depth=0):
                      if depth > 7:
                          return
                      if isinstance(o, dict):
                          ks = list(o)
                          # 부문 표처럼 보이는 것
                          if any(k in ("segments", "rows", "data", "datekey", "labels") for k in ks):
                              print(f"  {path or '.'}  키({len(ks)}): {ks[:12]}")
                              for k in ("datekey", "labels", "segments"):
                                  v = o.get(k)
                                  if isinstance(v, list):
                                      print(f"      {k}({len(v)}): {v[:8]}")
                          for k in ks[:40]:
                              walk(o[k], f"{path}.{k}", depth + 1)
                      elif isinstance(o, list) and o and depth <= 4:
                          walk(o[0], f"{path}[0]", depth + 1)
                  walk(tree)

          B = "https://stockanalysis.com"
          for label, url in [
            ("RKLB 부문 매출", f"{B}/stocks/rklb/metrics/revenue-by-segment/__data.json"),
            ("AAPL 부문 매출", f"{B}/stocks/aapl/metrics/revenue-by-segment/__data.json"),
            ("SE 부문 매출",   f"{B}/stocks/se/metrics/revenue-by-segment/__data.json"),
            ("도요타 부문",    f"{B}/quote/tyo/7203/metrics/revenue-by-segment/__data.json"),
            ("텐센트 부문",    f"{B}/quote/hkg/0700/metrics/revenue-by-segment/__data.json"),
            ("RKLB 지역별",    f"{B}/stocks/rklb/metrics/revenue-by-geography/__data.json"),
          ]:
              look(label, url)
          PY
