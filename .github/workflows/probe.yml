# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 51차 — 루프가 살아 있는데 monthly_nums_jp.json 이 pv3 에서 안 움직인다.
      # 루프 안에서는 `|| true` 가 오류를 삼켜 아무것도 안 보이므로, 수집기를
      # **여기서 그대로 돌려** 무슨 일이 나는지 본다. 커밋은 안 한다.
      - name: 🗾 월매출 수집기를 그대로 돌려 본다 (51차)
        timeout-minutes: 12
        env:
          MON_PDF_PER_RUN: '40'
        run: |
          python -X faulthandler scrape_mon_jp.py 2>&1 | tail -40
          echo "── 나온 파일 ──"
          python - <<'EOF'
          import json, collections
          d = json.load(open("data/monthly_nums_jp.json", encoding="utf-8"))
          print(f"pv{d['pv']} · {d['companies']}개사 {d['months']}개월 "
                f"· 본공시 {len(d.get('done') or [])} "
                f"· {dict(collections.Counter((d.get('skip') or {}).values()))}")
          EOF
