# 새 소스나 고친 수집기를 전체에 풀기 전에 몇 종목만 떠본다.
#
# 지금 볼 것: **일본 실적을 발표 당일에 받을 수 있는가.**
# stockanalysis 는 며칠 뒤에 싣는다(소니 12일, 도요타 8일, 오늘 발표분 0건).
# 미국은 SEC 에서 직접 받으니 일본도 TDnet 에서 직접 받아야 한다.
name: 소스 접근 확인
on:
  workflow_dispatch:
    inputs:
      syms:
        description: '떠볼 종목이나 일수'
        required: false
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # TDnet 이 일본판 EDGAR 다. 회사가 발표하는 그 순간 결산단신 XBRL 이 올라온다.
      # 열리는지 · 결산단신이 잡히는지 · XBRL 에서 매출이 나오는지 셋을 본다.
      - name: 🇯🇵 TDnet 결산단신을 읽을 수 있는가
        continue-on-error: true
        run: python scrape_fin_jp.py --probe ${{ inputs.syms }}
