# 새 소스를 붙이기 전에 응답 생김새를 눈으로 본다.
#
# 여기서 확인되기 전에는 collect.yml 에 넣지 않는다. 모양을 짐작해서 짜 두면
# 조용히 0건이 되고, 그게 제일 나쁘다(캘린더가 "발표 없음"이라고 거짓말한다).
#
# 지금 보는 것: 일본·홍콩 실적 시계열 (야후 fundamentals-timeseries)
#   - 1Q19 까지 거슬러 오는가
#   - 홍콩이 반기(6M)로 오는가
#   - 통화가 뭐로 오는가
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🇯🇵🇭🇰 야후 재무 시계열
        continue-on-error: true
        run: python scrape_fin_intl.py --probe

      - name: 🇺🇸 SEC — 태그를 갈아탄 회사가 이어 붙는지
        continue-on-error: true
        run: |
          python - <<'PY'
          import scrape_fin as sf
          # 엔비디아(1045810). 옛 태그에는 2020년까지만 있어서, 첫 태그에서 멈추면
          # 6분기밖에 안 나온다. 합쳐서 26분기가 나와야 고쳐진 것이다.
          for name, cik in (("NVDA", 1045810), ("AAPL", 320193), ("SE", 1703399)):
              s = sf.series(cik)
              if not s:
                  print(f"{name}: 없음"); continue
              p = s["points"]
              print(f"{name}: {s['freq']} {len(p)}개  {p[0]['label']} ~ {p[-1]['label']}"
                    f"  최근 매출 {p[-1]['rev']/1e9:.1f}B")
          PY
