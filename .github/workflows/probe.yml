# 새 소스나 고친 수집기를 전체에 풀기 전에 떠본다.
#
# 지금 볼 것: **일본 실적을 발표 당일에 받을 수 있는가.**
# stockanalysis 는 며칠 뒤에 싣는다(소니 12일, 도요타 8일, 오늘 발표분 0건).
# 미국은 SEC 에서 직접 받으니 일본도 TDnet 에서 직접 받아야 한다.
#
# 훑어본 결과: TDnet 200 · 야후재팬 200 · 닛케이 결산 200 · JPX 200,
#            EDINET 401(열쇠 필요) · 가부탄 405 · 민카부 403 · IR뱅크 403.
# TDnet 이 열리므로 이제 표 생김새만 맞추면 된다.
name: 소스 접근 확인
on:
  workflow_dispatch:
    inputs:
      syms:
        description: '떠볼 종목이나 일수'
        required: false
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 목록은 잘 열리는데 우리 정규식이 0건을 냈다. 생김새를 안 보고 정규식을
      # 고치는 건 점치는 것이다. 표 한 줄을 그대로 찍는다.
      - name: 🇯🇵 TDnet 표 한 줄 원문
        continue-on-error: true
        run: python scrape_fin_jp.py --rows

      - name: 🇯🇵 TDnet 결산단신을 읽을 수 있는가
        continue-on-error: true
        run: python scrape_fin_jp.py --probe ${{ inputs.syms }}
