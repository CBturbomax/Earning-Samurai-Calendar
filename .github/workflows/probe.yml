# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 17차 — EDINET API 키 포털. 회원가입을 마친 사용자가 ?mode=1 을 다시 열자
      # 흰 화면이 됐다. mode 마다 무엇이 그려지는지(가입/로그인/키 확인) 떠서
      # '키가 보이는 문'이 어디인지 확인한다. ?mode=1 은 신규 가입 전용이라
      # 가입을 마친 뒤에는 그릴 게 없을 것으로 본다 — 짐작 말고 확인.
      - name: 🇯🇵 EDINET 키 포털 문 찾기 (17차)
        timeout-minutes: 5
        run: |
          python - <<'EOF'
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0",
                "Accept": "text/html,*/*", "Accept-Language": "ja,en;q=0.8"}
          def attr(tag, k):
              m = re.search(k + r'="([^"]*)"', tag)
              return m.group(1) if m else ""
          def visible(t):
              t = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", t, flags=re.S | re.I)
              t = re.sub(r"<[^>]+>", " ", t)
              return re.sub(r"\s+", " ", t).strip()
          for tail in ("", "?mode=1", "?mode=2", "?mode=3"):
              url = "https://api.edinet-fsa.go.jp/api/auth/index.aspx" + tail
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode("utf-8", "replace")
                      print(f"\n== {tail or '(민짜)'}  {r.status} {len(body):,}자  최종 …{r.geturl()[-60:]}")
              except Exception as e:
                  print(f"\n== {tail or '(민짜)'}  실패 {e}")
                  continue
              m = re.search(r"<title[^>]*>([^<]*)</title>", body, re.I)
              print("   제목:", m.group(1).strip() if m else "(없음)")
              print("   글:", visible(body)[:360])
              btns = []
              for tag in re.findall(r"<input[^>]*>", body, re.I):
                  if attr(tag, "type").lower() == "hidden":
                      continue
                  btns.append((attr(tag, "type"), attr(tag, "name")[:26],
                               attr(tag, "value")[:22]))
              print("   입력·단추:", btns[:14])
              print("   링크:", sorted(set(re.findall(
                  r'href="([^"]*(?:mode=|\.aspx)[^"]*)"', body, re.I)))[:10])
          EOF

      # 17차 보조 — 아식스(7936) 부문 표에서 '일본(국내)' 행만 왜 떨어지는지.
      # 12차에서 Japan 문맥이 있는 것은 확인했다. 이번에는 그 문맥을 가리키는
      # 사실(fact)들의 이름·값·부호·자릿수를 전부 떠서 어느 관문(SEG_REV 태그?
      # 문맥 기간? 부호?)에서 버려지는지 짚는다. 진짜 파서도 같이 태워 견준다.
      - name: 🇯🇵 아식스 국내 부문 행 (17차 보조)
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import io, zipfile
          from datetime import date, timedelta
          import scrape_fin_jp as fj
          blob = None
          for back in range(12):
              day = (date.today() - timedelta(days=back)).isoformat()
              try:
                  rows = fj.announcements(day)
              except Exception as e:
                  print(day, "목록 실패:", e)
                  continue
              for r in rows:
                  if r["code"] == "7936" and "短信" in r["title"]:
                      print("공시:", day, r["title"][:60])
                      blob = fj.get("https://www.release.tdnet.info/inbs/" + r["zip"],
                                    binary=True)
                      break
              if blob:
                  break
          if not blob:
              print("최근 12일 목록에 아식스 결산단신이 없다")
              raise SystemExit
          z = zipfile.ZipFile(io.BytesIO(blob))
          docs = {n: z.read(n).decode("utf-8", "replace")
                  for n in z.namelist() if n.lower().endswith(("ixbrl.htm", ".xbrl"))}
          ctx = {cid for txt in docs.values() for cid, _ in fj.CTX_RE.findall(txt)}
          jap = sorted(c for c in ctx if "japan" in c.lower())
          print(f"문맥 {len(ctx)}개 · Japan 문맥 {len(jap)}개")
          for c in jap[:10]:
              print("   ", c)
          for n, txt in docs.items():
              if "Attachment" not in n:
                  continue
              hits = []
              for attrs, inner in fj.IX_FACT.findall(txt):
                  a = dict(fj.IX_ATTR.findall(attrs))
                  cid = a.get("contextRef") or ""
                  if "japan" not in cid.lower():
                      continue
                  hits.append(((a.get("name") or ""), cid[:72],
                               fj.TAGS.sub("", inner)[:16],
                               a.get("scale"), a.get("sign"), a.get("xsi:nil")))
              if hits:
                  print("\n--", n.split("/")[-1][:60], f"Japan 사실 {len(hits)}건")
                  for h in hits[:24]:
                      print("   ", h)
          got = fj.read_segments(blob)
          for st, en, row in got:
              print(f"\nread_segments {st}~{en}")
              for k, v in sorted(row.items()):
                  print(f"    {k[:64]:66s} {v:>16,.0f}")
              clean = {k: round(v / 1e9, 1) for k, v in fj.seg_clean(row).items()}
              print("  seg_clean(십억) ->", clean)
          EOF

      # 17차 열쇠 — 저장소 시크릿에 EDINET_API_KEY 가 올라오면 그때부터 도는 단.
      # (키가 없으면 통째로 건너뛴다.) v2 문서목록이 진짜로 열리는지, 2021·2023
      # 옛 사분기보고서까지 주는지, XBRL zip 안에 부문 축이 있는지까지 본다.
      # 키를 로그에 찍지 않는다 — 요청 주소도 안 찍는다.
      - name: 🇯🇵 EDINET v2 자물쇠 (17차 · 키 있을 때만)
        if: env.EDINET_API_KEY != ''
        timeout-minutes: 8
        run: |
          python - <<'EOF'
          import io, json, os, re, urllib.request, zipfile
          KEY = os.environ["EDINET_API_KEY"]
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()
          picked = None
          for day in ("2026-03-27", "2023-08-10", "2021-08-06"):
              try:
                  j = json.loads(get("https://api.edinet-fsa.go.jp/api/v2/documents.json"
                                     f"?date={day}&type=2&Subscription-Key={KEY}"))
              except Exception as e:
                  print(day, "실패:", getattr(e, "code", type(e).__name__))
                  continue
              docs = j.get("results") or []
              rep = [d for d in docs if d.get("docTypeCode") in ("120", "140", "160")
                     and d.get("xbrlFlag") == "1"]
              print(day, "전체", len(docs), "· 보고서(120/140/160)", len(rep))
              for d in rep[:4]:
                  print("   ", d.get("docID"), d.get("docTypeCode"),
                        d.get("secCode"), (d.get("filerName") or "")[:18])
              if rep and not picked:
                  picked = rep[0]
          if not picked:
              print("보고서를 한 건도 못 받았다 — 키나 API 상태를 본다")
              raise SystemExit
          z = get("https://api.edinet-fsa.go.jp/api/v2/documents/"
                  f"{picked['docID']}?type=1&Subscription-Key={KEY}")
          print("zip", f"{len(z):,}B", picked["docID"],
                (picked.get("filerName") or "")[:18])
          zf = zipfile.ZipFile(io.BytesIO(z))
          pub = [n for n in zf.namelist() if "PublicDoc" in n]
          print("PublicDoc", len(pub), "장:", [p.split("/")[-1][:40] for p in pub[:5]])
          for n in pub:
              if not n.endswith((".xbrl", ".htm")):
                  continue
              x = zf.read(n).decode("utf-8", "replace")
              mem = sorted(set(re.findall(r"([A-Za-z0-9]{2,40}SegmentMember)", x)))
              if mem:
                  print(n.split("/")[-1][:44], "부문 멤버:", mem[:14])
                  break
          EOF
