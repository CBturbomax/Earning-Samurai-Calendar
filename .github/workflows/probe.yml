# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
name: 소스 접근 확인

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 시총 큰 종목인데 부문이 안 잡힌 회사가 무슨 태그를 쓰는지 본다.
      # 짐작으로 태그를 늘리지 않는다 — zip 하나(85MB)만 받아 원문을 센다.
      - name: 🔎 부문이 안 잡힌 큰 종목은 무슨 태그를 쓰나
        timeout-minutes: 8
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
        run: |
          python - <<'EOF'
          import io, json, urllib.request, zipfile, collections
          import scrape_seg_sec as s

          # 엑슨·록히드마틴·제너럴다이내믹스·유나이티드헬스
          WANT = {34088: "XOM", 936468: "LMT", 40533: "GD", 731766: "UNH"}
          blob = s.fetch(s.BULK.format(q="2026q1"))
          z = zipfile.ZipFile(io.BytesIO(blob))

          subs = {}
          with z.open("sub.txt") as f:
              cols = f.readline().decode().rstrip("\r\n").split("\t")
              ia, ic, ifm = (cols.index(c) for c in ("adsh", "cik", "form"))
              for raw in f:
                  p = raw.decode("utf-8", "replace").rstrip("\r\n").split("\t")
                  try: cik = int(p[ic])
                  except (ValueError, IndexError): continue
                  if cik in WANT:
                      subs[p[ia]] = (WANT[cik], p[ifm])

          print("찾은 서류:", sorted(set(subs.values())))
          seen = collections.defaultdict(collections.Counter)
          axes = collections.defaultdict(collections.Counter)
          with z.open("num.txt") as f:
              cols = f.readline().decode().rstrip("\r\n").split("\t")
              ia, it, isg, iu, iv = (cols.index(c) for c in
                                     ("adsh", "tag", "segments", "uom", "value"))
              for raw in f:
                  p = raw.decode("utf-8", "replace").rstrip("\r\n").split("\t")
                  if len(p) <= iv or not p[isg]: continue
                  hit = subs.get(p[ia])
                  if not hit or p[iu] != "USD": continue
                  sym = hit[0]
                  if "Revenu" in p[it] or "Sales" in p[it]:
                      seen[sym][p[it]] += 1
                  axes[sym][";".join(sorted(
                      q.split("=")[0] for q in p[isg].split(";") if q))] += 1

          for sym in sorted(seen) or sorted(axes):
              print(f"\n===== {sym}")
              print("  부문 축이 달린 매출/매상 태그:")
              for t, n in seen[sym].most_common(10):
                  mark = "  <- 우리가 받는 태그" if t in s.REV_RANK else ""
                  print(f"    {n:>6,}  {t}{mark}")
              print("  축 조합 (매출 말고 전부):")
              for a, n in axes[sym].most_common(8):
                  print(f"    {n:>6,}  {a}")
          EOF
