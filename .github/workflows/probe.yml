# 소스를 떠보는 자리. 결과만 로그로 보고 아무것도 커밋하지 않는다.
# **dispatch 전용이다.**
name: 소스 접근 확인

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 60차 — 칸을 가를 때 **진짜 글자폭**을 쓰는 것이 나은가 옛 어림이 나은가.
      # 59차에서 하드오프(2674)의 머리줄 「2026年４月2026年５月…」 이 한 칸으로
      # 뭉쳐 통째로 안 읽혔다. 전각에서 폭이 커져 칸이 덜 갈린 것이다. 한 번
      # 받아 두 판으로 뜯어 **같은 자료에서** 견준다.
      - name: ⚖ 글자폭 켜고 끄고 (60차)
        timeout-minutes: 15
        run: |
          set -o pipefail
          python - <<'EOF' 2>&1 | tail -220
          import json, time, urllib.request
          import pdftext, montable

          rows = json.load(open("data/monthly_jp.json"))["rows"]
          old = json.load(open("data/monthly_nums_jp.json"))
          had = set(old["codes"])
          H = {"User-Agent": "Mozilla/5.0 (compatible; earnings-samurai/1.0)"}
          WATCH = ("2674", "9832", "7476", "6627", "7685", "7134", "7649", "7185")

          out = {True: {}, False: {}}
          t0 = time.time()
          n = 0
          for r in rows:
              if time.time() - t0 > 760:
                  print(f"  …시간이 다 됐다({n}/{len(rows)})")
                  break
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(r["doc"], headers=H),
                          timeout=20) as f:
                      pdf = f.read()
              except Exception:
                  continue
              n += 1
              for adv in (True, False):
                  pdftext.ADV = adv
                  try:
                      res = montable.read(pdf, r["date"], 12, r["title"])
                  except Exception:
                      res = None
                  if not res:
                      continue
                  rec = out[adv].setdefault(r["code"], {"n": r["name"], "m": {}})
                  rec["lab"] = res.get("amount_label", "")
                  rec["y"] = res.get("yoy_label", "")
                  for x in res["rows"]:
                      rec["m"][x["period"]] = (x.get("rev"), x.get("yoy"))
                  if r["code"] in WATCH:
                      rec.setdefault("dbg", []).append(
                          (adv, res.get("amount_label"), res.get("yoy_label"),
                           [(x["period"], x.get("rev"), x.get("yoy"))
                            for x in res["rows"][:4]]))

          for adv in (True, False):
              g = out[adv]
              print(f"\n글자폭 {'켬' if adv else '끔'}: 종목 {len(g)} · "
                    f"달 {sum(len(v['m']) for v in g.values())} · "
                    f"헌 것 중 사라진 것 {sorted(had - set(g))}")
          a, b = set(out[True]), set(out[False])
          print(f"\n켰을 때만: {sorted(a - b)}")
          print(f"껐을 때만: {sorted(b - a)}")

          print("\n" + "=" * 72)
          print("눈여겨보는 종목")
          for c in WATCH:
              for adv in (True, False):
                  v = out[adv].get(c)
                  tag = "켬" if adv else "끔"
                  if not v:
                      print(f"  {c} {tag}: 못 읽음")
                      continue
                  ms = sorted(v["m"])
                  print(f"  {c} {v['n']} {tag}: 금액={v['lab']!r} 전년비={v['y']!r}")
                  print("      " + " ".join(
                      f"{m[2:]}:{('%.4g' % x) if x else '-'}/"
                      f"{('%.1f' % y) if y else '-'}"
                      for m in ms for x, y in [v["m"][m]]))
          EOF
