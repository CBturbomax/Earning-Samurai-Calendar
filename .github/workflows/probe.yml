# 새 소스를 붙이기 전에 응답 생김새를 눈으로 본다.
#
# 여기서 확인되기 전에는 collect.yml 에 넣지 않는다. 모양을 짐작해서 짜 두면
# 조용히 0건이 되고, 그게 제일 나쁘다(캘린더가 "발표 없음"이라고 거짓말한다).
#
# 앞선 확인에서 stockanalysis 만 세 시장 다 200 을 줬다(WSJ·마켓워치 401,
# 인베스팅·IR뱅크 403, 가부탄 405). 이제 그 응답 속을 뜯어본다 —
# **분기를 몇 개나 주는가**가 관건이다. 야후는 4~5개가 한계였다.
name: 소스 접근 확인
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 stockanalysis — 새 수집기가 실제로 뽑아내는가
        continue-on-error: true
        run: python scrape_fin_intl.py --probe
