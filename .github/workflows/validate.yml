name: 코드 검증

on:
  pull_request:
    paths:
      - '*.py'
      - 'us-trade/**'
      - 'japan-exports/**'
      - 'trade-shared/**'
      - 'tests/*.cjs'
      - 'data/monthly_universe_jp.json'
      - 'data/monthly_reviewed_jp.json'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 일자별 차트 회귀 검사
        run: node tests/daily_chart.cjs
      - name: 월매출 표 정렬 회귀 검사
        run: node tests/monthly_table.cjs
      - name: 미국 수출입 데이터 검사
        run: |
          python -m unittest discover -s us-trade/tests -v
          python -m unittest discover -s japan-exports/tests -v
          node trade-shared/discovery.test.mjs
          node trade-shared/highlights.test.mjs
          node japan-exports/tests/test_company_coverage.mjs
          node japan-exports/tests/test_company_impact.mjs
          node us-trade/tests/metrics.mjs
          node us-trade/tests/japan-layout.mjs
          node us-trade/tests/app.mjs
          node --check us-trade/app.js
      - name: Python 문법 검사
        run: |
          python -m py_compile monir.py scrape_mon_ir.py scrape_caps.py build.py
      - name: 월차 parser self-test
        run: |
          python monir.py
          python montable.py
          python monweb.py
          python -m unittest discover -v
      - name: 월차 coverage 구조 검사
        run: python scrape_mon_ir.py --coverage
      - name: 월차 seed JSON 검사
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/monthly_universe_jp.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          codes = d.get("codes") or []
          assert len(codes) >= 300, len(codes)
          assert len(codes) == len(set(codes)), "duplicate monthly seed code"
          print("monthly seed", len(codes))
          PY
      - name: 페이지 빌드 회귀 검사
        run: python build.py
