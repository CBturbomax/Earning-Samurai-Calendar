# 월매출 PDF 읽기 견주기(우리 해석기 vs poppler) — 로그에만 찍고 아무것도 커밋하지 않는다. dispatch 전용.
name: 월매출 PDF 읽기 견주기

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: poppler
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: 견주기
        run: python tools/probe_poppler.py
