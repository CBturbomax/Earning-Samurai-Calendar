# AI(Claude Code `claude -p`)로 실적 보도자료의 사업부 표 읽기 — 규칙(scrape_seg_pr.py)으로 못 읽은 것만, 검산 통과분만.
# **이 워크플로가 data/segments_aipr.json 의 주인이다.**
# 키: GitHub Secrets 의 CLAUDE_CODE_OAUTH_TOKEN(회원님 PC 에서 `claude setup-token`). 없으면 아무것도 안 한다.
name: AI 사업부 판독

on:
  schedule:
    - cron: '9,29,49 * * * *'   # 실적 시즌 — 20분마다(Codex 만)
  workflow_dispatch:
    inputs:
      only:
        description: '빈칸 메우기를 몇 종목만 (예: us:KO jp:6501) — 비우면 전부'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: aiseg-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ai:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'   # 11/02 다시 켬 — Codex(ChatGPT 구독)로만 돈다. Claude 계정은 안 쓴다(추가 결제 걱정)
    timeout-minutes: 20
    env:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      AI_ENGINE: codex
      CODEX_EFFORT: low
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Codex CLI
        if: env.CODEX_AUTH_JSON != ''
        run: |
          mkdir -p ~/.codex && printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json && chmod 600 ~/.codex/auth.json
          npm install -g @openai/codex >/dev/null 2>&1 && codex --version
      - name: 🤖 AI 사업부 판독
        if: env.CODEX_AUTH_JSON != ''
        continue-on-error: true
        timeout-minutes: 12
        env:
          AISEG_SECS: '540'
        run: |
          set -o pipefail
          W=$PWD; (cd /tmp && python "$W/ai_seg.py") | tee ai.log     # 저장소 밖에서 — AGENTS.md·CLAUDE.md 가 프롬프트에 붙지 않게
          { echo '### AI 사업부 판독'; echo '```'; tail -40 ai.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 저장소에 반영
        if: env.CODEX_AUTH_JSON != ''
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ai.log
          git add data/segments_aipr.json 2>/dev/null || true
          git diff --cached --quiet && { echo "달라진 게 없다."; exit 0; }
          git commit -m "AI 사업부 판독 $(date -u +%F' '%H:%M) [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep $((2**i)); continue; }
            git merge --no-edit -X ours origin/main || { git merge --abort; sleep $((2**i)); continue; }
            git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
