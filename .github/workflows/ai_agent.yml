# 새 발표 따라가기 — 막 실적을 낸 회사의 **새 분기 사업부**를 공시 전문에서 읽어 채운다(ai_agent_co.py · AGENT_FRESH=1).
# 회원님(11/15): "앞으로도 실적 발표하면 그건 채워야지 당연히." 지난 빈칸은 11/13~15 에 한 번 다 돌았다 — 여기는 그 뒤로 생기는 칸만 본다.
# 대상: 지난 10일 안에 발표한 회사 중 최근 150일 안에 끝난 분기의 사업부가 빈 곳. 소비재·인터넷 → 산업재(시총 3천억 원↑) → 나머지 업종(1조 원↑).
# 헛돌지 않게: 발표 하나에 세 번까지(하루 한 번) · 실행마다 토큰 상한 · 한도에 걸리면 기록 없이 멈춘다. 검산은 코드가 한다(ai_fpi_co.check).
# 이 파일의 주인은 data/fpi_co.json — ai_fpi.yml(손으로만)과 같은 대기줄에 서서 같은 파일에 동시에 쓰지 않는다.
name: 새 발표 사업부 채우기

on:
  schedule:
    - cron: '17 22 * * *'     # 07:17 KST — 미국 장후 발표가 다 나온 아침
    - cron: '17 10 * * *'     # 19:17 KST — 일본 15시 발표 뒤 저녁
  workflow_dispatch:
    inputs:
      tokens:
        description: '단계마다 토큰 상한'
        required: false
        default: '6000000'
      days:
        description: '며칠 전 발표까지 볼까'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: aifpi-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 170
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AI_MODEL: sonnet
      AGENT_FRESH: '1'
      AGENT_PAR: '4'
      AGENT_HOLES: '4'
      FPI_TOKENS: "${{ github.event.inputs.tokens || '6000000' }}"
      FPI_SECS: '2100'
      DAYS: "${{ github.event.inputs.days || '10' }}"
      SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
    steps:
      - uses: actions/checkout@v4
      - name: 최신 main 으로 맞춘다
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF·OCR 도구
        timeout-minutes: 5
        run: |
          command -v pdftotext || pip install -q pdfplumber
          (sudo timeout 90 apt-get update -qq && sudo timeout 150 apt-get install -y -qq tesseract-ocr) || echo "tesseract 설치 실패 — 그림 표(OCR)는 건너뛴다"
          command -v pdftotext || python -c "import pdfplumber"
      - name: Claude Code CLI
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "열쇠가 없다 — 쉰다"; exit 0; }
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version && echo "AI_READY=1" >> "$GITHUB_ENV"
      - name: 🧩 새 분기 사업부 채우기
        if: env.AI_READY == '1'
        continue-on-error: true
        timeout-minutes: 150
        run: |
          set -o pipefail
          Z=$(date -u +%F); A=$(date -u -d "-${DAYS} days" +%F)
          : > agent.log
          run() { python ai_agent_co.py "$@" 2>&1 | { grep -a -v '^  [a-z_0-9]*\.json\|번역 받기\|받기 실패\|껍데기' || true; } | tee -a agent.log; }
          AGENT_TIER=01 FPI_MIN_CAP=0.2 run --jpdays $A $Z
          AGENT_TIER=01 FPI_MIN_CAP=0.2 run --days $A $Z
          AGENT_TIER=2 FPI_MIN_CAP=0.7 run --jpdays $A $Z
          AGENT_TIER=2 FPI_MIN_CAP=0.7 run --days $A $Z
          timeout 900 python ai_fpi_co.py --confirm 2>&1 | grep -a "요약" | tee -a agent.log || true
          { echo '```'; grep -a "^== \|통과\|요약\|한도" agent.log | tail -300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 저장소에 반영
        if: env.AI_READY == '1'
        run: |
          rm -f agent.log
          git checkout -q -- data/seg_ko_extra.json 2>/dev/null || true
          bash .github/scripts/save_owned.sh "새 발표 사업부 채우기 $(date -u +%F' '%H:%M) [skip ci]" data/fpi_co.json
