# 실적 '수치'만 자주 받는다.
#
# 일정 수집(collect.yml)은 미국·일본·홍콩 캘린더에 시가총액까지 훑느라 20~30분이
# 걸린다. 그걸 20분마다 돌릴 수는 없다. 그런데 회원님이 보고 싶은 건 대개
# **방금 발표한 회사의 숫자**다 — 그건 캘린더가 아니라 실적 수치 쪽이다.
#
# 그래서 무거운 일정 수집은 한 시간마다 그대로 두고, 실적 수치만 떼어 자주 돈다.
# scrape_fin_intl.py 가 '이미 발표했는데 우리 기록이 그보다 앞선' 종목을 맨 앞에
# 세우므로, 방금 발표한 회사가 대기줄 뒤에서 몇 시간씩 기다리지 않는다.
#
# 처음에는 collect.yml 과 **같은 concurrency 그룹**을 썼다. 같은 파일에 동시에 쓰지
# 않으려던 것인데, 그게 이 워크플로를 통째로 굶겼다 — 20분짜리가 30분짜리 뒤에
# 줄을 서고, 20분 뒤 다음 것이 오면 기다리던 놈이 취소된다. 그래서 한 번도
# 끝까지 못 갔고 data/segments.json 이 영영 안 생겼다.
#
# 지금은 그룹을 나누는 대신 **건드리는 파일을 갈랐다.**
#   collect.yml -> data/earnings*.json · data/caps.json   (일정·시가총액)
#   여기        -> data/financials*.json · data/segments.json (실적 수치)
# 겹치는 건 만들어진 index.html 뿐인데, 그건 합친 자료로 다시 만들면 그만이다.
#
# 한 실행이 주기를 넘기면 다음 것이 줄을 서고 그 다음이 오면 취소된다. 취소되는
# 쪽은 아직 아무 일도 안 한 대기분이라 잃을 게 없다. 그래도 넘기지 않게 단계별
# 시간과 종목 수를 주기 안쪽으로 맞춰뒀다.
#
# **20분 -> 30분으로 늘렸다.** 홍콩 수집 창을 400일로 넓히자 캘린더의 홍콩 종목이
# 972 -> 2,681 로 늘었는데, 한 실행에 220종목으로는 그 대기줄이 몇 시간씩 밀렸다 —
# 팝마트가 캘린더에 뜨고도 한나절 넘게 실적 차트가 비어 있었다. 주기를 열 분
# 늦추는 대신 한 실행이 세 배를 받는다(220 -> 700). 발표 당일 종목은 여전히
# 대기줄 맨 앞에 서므로 신선도는 안 죽는다.

name: 실적 수치 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: numbers-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  numbers:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # SEC 는 실적 발표가 아니라 10-Q 가 올라와야 값이 생긴다. 그래도 먼저 본다 —
      # 공식 자료이고, 올라와 있으면 그게 맞다.
      # 단계마다 시간이 차면 거기서 끊는다. 세 수집기 모두 중간중간 파일에 써두므로
      # 끊겨도 받은 만큼은 남고, 다음 실행이 그 뒤부터 이어받는다.
      - name: 📈 미국 실적 수치 (SEC + 나스닥)
        continue-on-error: true
        timeout-minutes: 4
        env:
          SEC_UA: 'Earning Samurai Calendar (cbpark@wisdomasset.co.kr)'
          FIN_PER_RUN: '80'
        run: python scrape_fin.py

      # 🇯🇵 일본은 **공시에서 직접** 받는다. stockanalysis 는 일본 실적을 며칠
      # 뒤에 싣는다(소니 12일·도요타 8일, 발표 당일치는 0건). TDnet 은 회사가
      # 발표하는 그 순간 결산단신 XBRL 을 올리므로 여기가 가장 빠르다.
      # 첫 실행은 열흘치 사백 건이라 한 번에 다 못 받는다. 중간중간 써두므로
      # 시간이 차서 잘려도 받은 만큼은 남고 다음 실행이 이어받는다.
      - name: 🇯🇵 일본 결산단신 (TDnet 공시)
        continue-on-error: true
        timeout-minutes: 5
        env:
          JP_BACK_DAYS: '6'
        run: python scrape_fin_jp.py

      # SEC 에 아직 없는 분기를 여기서 메운다. 발표 당일 반영된다.
      # 요청 사이 0.6초 + 응답 대기라 종목당 1초쯤 본다 -> 6분에 350개.
      - name: 📉 분기 실적 (stockanalysis)
        continue-on-error: true
        timeout-minutes: 10
        env:
          INTL_PER_RUN: '650'
        run: python scrape_fin_intl.py

      # 사업부별 매출의 **뼈대는 SEC 벌크**에서 온다(segments.yml). 여기서 받는
      # stockanalysis 쪽은 벌크가 아직 안 실은 **최근 한두 분기**를 메우고,
      # 사람이 읽기 좋은 부문 이름을 준다. 시총 상위부터 조금씩 받는다.
      - name: 🧩 사업부별 매출 — 최근 분기 (stockanalysis)
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEG_PER_RUN: '120'
          # 세 시장 전부. 시총 상위 1,500에서 멈추면 소형주 부문이 영영 안 온다.
          SEG_TOP_N: '99999'
        run: python scrape_fin_seg.py

      # 무엇을 파는 회사인가. 사업 설명은 잘 안 바뀌므로 상위 종목부터 천천히
      # 채우고 넉 달에 한 번 다시 받는다.
      # 홍콩 부문별 매출 — 동화순 F10 의 비중(%) 스냅샷. 절대 금액은 build.py 가
      # 총매출에 곱해 만든다. 페이지에 최근 세 기간만 실리므로 스냅샷을 쌓아 둔다.
      - name: 🇭🇰 홍콩 부문별 매출 (동화순)
        continue-on-error: true
        timeout-minutes: 3
        env:
          SEG_HK_PER_RUN: '250'
        run: python scrape_seg_hk.py

      - name: 🏷️ 사업 설명 (나스닥·닛케이·stockanalysis)
        continue-on-error: true
        timeout-minutes: 2
        env:
          DESC_PER_RUN: '250'
          # 시총 상위 3,000에서 멈추지 않는다 — 캘린더에 뜨는 종목 전부.
          DESC_TOP_N: '99999'
        run: python scrape_desc.py

      - name: 페이지 다시 만들기
        run: |
          python build.py | tee build.log
          {
            echo '### 실적 수치 갱신'
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 되커밋 방식은 collect.yml 과 같다 — 만들어진 파일은 방금 받은 우리 것이
      # 최신이므로 부딪히면 우리 것을 택하고, 합친 코드로 페이지를 다시 만든다.
      - name: 저장소에 반영
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build.log
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "달라진 게 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "실적 수치 갱신 $(date -u +%F' '%H:%M) [skip ci]"

          for i in 1 2 3 4 5; do
            git merge --abort 2>/dev/null || true
            # 늦게 도착한 쓰기를 거둬 간다. 단계가 시간을 넘겨 죽을 때 파이프 뒤의
            # 파이썬이 고아로 살아남아 data/ 를 계속 쓰는 일이 있다 — 커밋 뒤에
            # desc.json 이 또 바뀌어 있으면 merge 가 "would be overwritten" 으로
            # 서고, 그 실행이 받은 수집분 전체가 버려진다(실제로 홍콩 부문 첫
            # 수집분을 통째로 잃었다). 반복문 들머리마다 쓸어 담으면 안전하다.
            git add data/ index.html 2>/dev/null || true
            git diff --cached --quiet || git commit -m "늦게 도착한 수집분 [skip ci]"
            git fetch origin main || { sleep $((2**i)); continue; }

            if ! git merge --no-edit origin/main; then
              stuck=$(git diff --name-only --diff-filter=U)
              if [ -z "$stuck" ]; then
                # 충돌 없이 merge 가 실패했다(잠금 파일 따위). 다음 바퀴에서 다시.
                echo "merge 실패(충돌 아님), 재시도"; sleep $((2**i)); continue
              fi
              others=$(echo "$stuck" | grep -v -e '^data/' -e '^index\.html$' || true)
              if [ -n "$others" ]; then
                echo "코드가 부딪혔다. 손으로 봐야 한다:"; echo "$others"; exit 1
              fi
              # shellcheck disable=SC2086
              git checkout --ours -- $stuck
              git add $stuck
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "충돌을 못 풀었다:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git commit --no-edit
            fi

            python build.py > /dev/null
            git add index.html
            git diff --cached --quiet || git commit -m "페이지 다시 만들기 [skip ci]"

            git push origin HEAD:main && exit 0
            echo "푸시 실패, $((2**i))초 뒤 재시도"; sleep $((2**i))
          done
          echo "푸시를 끝내 못 했다"; exit 1
